name: LINKS v200 build
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch v200
        run: |
          python3 .github/links_v200_patch.py
      - name: Commit v200
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html public/links-sw.js public/_headers
          git diff --cached --quiet && exit 0
          git commit -m "LINKS v200: standings, app refresh, auto-save and compare timer"
          git push
