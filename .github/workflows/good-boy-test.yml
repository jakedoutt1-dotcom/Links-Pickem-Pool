name: LINKS v200 build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-v200:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v200 updates
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('public/index.html')
          s = p.read_text(encoding='utf-8')

          # v200 version bump and permanent cache-bust for the existing full-color Standings artwork.
          s = s.replace('LINKS PICK’EM POOLS — v199','LINKS PICK’EM POOLS — v200')
          s = s.replace('standings.png?v=199','standings.png?v=200')
          s = s.replace('standings.png?v=198','standings.png?v=200')
          s = s.replace('standings.png?v=197','standings.png?v=200')
          s = s.replace('standings.png?v=196','standings.png?v=200')
          # Catch unversioned references without touching another nav image.
          s = re.sub(r'(nav-v174/standings\.png)(?!\?v=\d+)', r'\1?v=200', s)

          # Installed-app/PWA freshness: register a versioned SW with updateViaCache none,
          # check for a new worker on launch/foreground, and reload once when it takes control.
          refresh = r'''
<script id="links-pwa-refresh-v200">
(()=>{
  if(!('serviceWorker' in navigator)) return;
  let reloading=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(reloading) return;
    reloading=true;
    location.reload();
  });
  const register=()=>navigator.serviceWorker.register('/links-sw.js?v=200',{updateViaCache:'none'})
    .then(reg=>{
      reg.update().catch(()=>{});
      if(reg.waiting) reg.waiting.postMessage({type:'SKIP_WAITING'});
      reg.addEventListener('updatefound',()=>{
        const w=reg.installing;
        if(!w) return;
        w.addEventListener('statechange',()=>{
          if(w.state==='installed' && navigator.serviceWorker.controller){
            w.postMessage({type:'SKIP_WAITING'});
          }
        });
      });
      return reg;
    }).catch(()=>null);
  window.addEventListener('load',register,{once:true});
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') register(); });
})();
</script>
'''
          if 'id="links-pwa-refresh-v200"' not in s:
              if '</body>' not in s:
                  raise SystemExit('No </body> found; refusing unsafe PWA injection.')
              s = s.replace('</body>', refresh + '\n</body>', 1)

          p.write_text(s, encoding='utf-8')

          # Network-first service worker: navigation/HTML always tries the live site first.
          # Static assets may be cached, while versioned URLs force new artwork immediately.
          sw = Path('public/links-sw.js')
          sw.write_text(r'''const CACHE='links-pickem-v200';
const CORE=['/','/index.html','/manifest.webmanifest'];
self.addEventListener('install',event=>{
  self.skipWaiting();
  event.waitUntil(caches.open(CACHE).then(c=>c.addAll(CORE)).catch(()=>{}));
});
self.addEventListener('activate',event=>{
  event.waitUntil((async()=>{
    const keys=await caches.keys();
    await Promise.all(keys.filter(k=>k.startsWith('links-pickem-')&&k!==CACHE).map(k=>caches.delete(k)));
    await self.clients.claim();
  })());
});
self.addEventListener('message',event=>{
  if(event.data&&event.data.type==='SKIP_WAITING') self.skipWaiting();
});
self.addEventListener('fetch',event=>{
  const req=event.request;
  if(req.method!=='GET') return;
  const url=new URL(req.url);
  if(url.origin!==location.origin) return;
  if(req.mode==='navigate'||url.pathname==='/'||url.pathname.endsWith('/index.html')){
    event.respondWith(fetch(req,{cache:'no-store'}).then(res=>{
      const copy=res.clone(); caches.open(CACHE).then(c=>c.put('/index.html',copy)).catch(()=>{});
      return res;
    }).catch(()=>caches.match('/index.html')));
    return;
  }
  event.respondWith(fetch(req).then(res=>{
    if(res.ok){const copy=res.clone();caches.open(CACHE).then(c=>c.put(req,copy)).catch(()=>{});}
    return res;
  }).catch(()=>caches.match(req)));
});
''',encoding='utf-8')

          # Ensure Cloudflare/browser never holds the service worker itself.
          hp=Path('public/_headers')
          h=hp.read_text(encoding='utf-8')
          if '/links-sw.js' not in h:
              h += '\n/links-sw.js\n  Cache-Control: no-cache, no-store, must-revalidate\n'
          hp.write_text(h,encoding='utf-8')

      - name: Validate and commit v200
        run: |
          grep -q 'LINKS PICK’EM POOLS — v200' public/index.html
          grep -q 'links-pwa-refresh-v200' public/index.html
          grep -q 'links-pickem-v200' public/links-sw.js
          grep -q 'standings.png?v=200' public/index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html public/links-sw.js public/_headers
          git commit -m "LINKS v200: fix Standings nav and PWA refresh"
          git push
