name: LINKS v201 packages page
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-v201:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build v201 packages page
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('public/index.html'); s=p.read_text(encoding='utf-8')
          # Preserve all v199 behavior. This patch changes Home/page markup + CSS only.
          start=s.find('<section class="links-package-section-v150 links-package-section-v193" id="linksPackages">')
          end=s.find('<div id="poolLoginModalV150"',start)
          if start<0 or end<0: raise SystemExit('Package section boundaries not found')
          package=s[start:end]
          home_cta='''<section class="links-plans-cta-v201"><div class="kicker">COMMISSIONER PLANS</div><h2>NEED MORE THAN ONE POOL?</h2><p>Start free for life, then add more pool slots only when you need them.</p><button id="openPlansV201" type="button">VIEW PLANS &amp; PACKAGES ›</button></section>\n\n  '''
          s=s[:start]+home_cta+s[end:]
          home_end=s.find('\n</div>',s.find('<div id="home"'))
          if home_end<0: raise SystemExit('Home end not found')
          plans='''\n<div id="plansPageV201" class="hide links-plans-page-v201">
            <div class="links-plans-head-v201"><button id="plansBackV201" type="button">← HOME</button><div><div class="kicker">LINKS PICK’EM POOLS</div><h1>PLANS &amp; PACKAGES</h1><p>Players are always free. Start with one game-pool slot free for life.</p></div></div>
            '''+package+'''<section class="links-home-footer-v200" aria-label="Links Pickem Pools"><div class="links-home-footer-row-v200"><div class="links-home-footer-slogan-v200">YOU PICK.<br>WE TRACK. YOU WIN.</div><div><div class="links-home-footer-paw-v200">🐾</div><div class="links-home-footer-logo-v200">LINKS<small>PICK’EM POOLS</small></div></div><div class="links-home-footer-slogan-v200">BRINGING PEOPLE<br>TOGETHER <span class="links-home-footer-paw-v200">🐾</span></div></div></section>
          </div>\n'''
          s=s[:home_end+7]+plans+s[home_end+7:]
          css='''<style id="links-v201-plans-style">
          #home .links-plans-cta-v201{margin:18px 0;padding:24px;text-align:center;border:2px solid #777;border-radius:17px;background:repeating-linear-gradient(90deg,#1a0d06 0 28px,#2b160b 28px 56px);box-shadow:inset 0 0 0 3px #111,0 9px 24px #000a}#home .links-plans-cta-v201 h2{margin:6px 0;font-size:clamp(24px,4vw,38px)}#home .links-plans-cta-v201 p{color:#ddd}#home #openPlansV201{width:auto;min-width:260px;background:#ff6a1a;border-color:#ff9b61;font-weight:950}
          .links-plans-page-v201{max-width:1180px;margin:auto;padding:18px}.links-plans-head-v201{padding:24px;border:2px solid #777;border-radius:18px;background:radial-gradient(circle at 50% 0,#203448,#080d11 48%,#160b05);text-align:center;box-shadow:inset 0 0 0 3px #111,0 10px 25px #000b}.links-plans-head-v201 #plansBackV201{display:block;width:auto;margin:0 0 12px;background:#251208;border:1px solid #a44b18;color:#fff}.links-plans-head-v201 h1{font-size:clamp(32px,6vw,58px);margin:5px 0;color:#fff;text-shadow:0 3px #000}.links-plans-page-v201 .links-package-section-v150{margin-top:16px;background:repeating-linear-gradient(90deg,#120a06 0 30px,#201006 30px 60px)!important;border:2px solid #737b80!important;box-shadow:inset 0 0 0 3px #111,0 10px 28px #000a}.links-plans-page-v201 .links-package-card-v150{border:2px solid #69747c!important;background:linear-gradient(145deg,#171d22,#0c1115 62%,#241207)!important;box-shadow:inset 0 0 0 2px #111,0 8px 18px #0009!important}.links-plans-page-v201 .links-package-card-v150.featured{border-color:#ff6a1a!important;box-shadow:inset 0 0 0 2px #111,0 0 16px #ff6a1a55!important}.links-plans-page-v201 .links-package-card-v150 button{font-weight:950}.links-plans-page-v201 .links-home-footer-v200{margin-top:20px}
          </style>'''
          s=s.replace('</head>',css+'\n</head>',1)
          js='''<script id="links-v201-plans-nav">document.addEventListener('click',function(e){const open=e.target.closest('#openPlansV201');const back=e.target.closest('#plansBackV201');if(open){const h=document.getElementById('home'),p=document.getElementById('plansPageV201');if(h&&p){h.classList.add('hide');p.classList.remove('hide');window.scrollTo(0,0)}}if(back){const h=document.getElementById('home'),p=document.getElementById('plansPageV201');if(h&&p){p.classList.add('hide');h.classList.remove('hide');window.scrollTo(0,0)}}});</script>'''
          s=s.replace('</body>',js+'\n</body>',1)
          s=s.replace('LINKS PICK’EM POOLS — v200','LINKS PICK’EM POOLS — v201')
          p.write_text(s,encoding='utf-8')
      - name: Validate and commit
        run: |
          grep -q 'id="plansPageV201"' public/index.html
          grep -q 'id="openPlansV201"' public/index.html
          grep -q 'LINKS PICK’EM POOLS — v201' public/index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html
          git commit -m "LINKS v201: themed packages page and cleaner Home"
          git push
