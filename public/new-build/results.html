<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LINKS — Live Scores</title><link rel="stylesheet" href="./shell.css?v=403"><style>.wrap{padding:16px 5%}.filters,.period{display:flex;gap:7px;overflow:auto;margin-bottom:12px}.filters button,.period button,.period select{white-space:nowrap}.scorecard{border:1px solid #29485e;border-radius:9px;padding:14px;margin:8px 0;background:#07131d}.teamrow{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}.team{display:flex;gap:8px;align-items:center;font-weight:900}.team:last-child{justify-content:flex-end;text-align:right}.team.win{color:#63d58b}.team.loss{color:#e06b6b}.logoimg{width:42px;height:42px;object-fit:contain}.live{border-color:#b47b31}.hero{background:linear-gradient(90deg,#02070de8,#06111bc9),url('./assets/links-stadium-hero.png') center/cover no-repeat!important}@media(max-width:600px){.logoimg{width:34px;height:34px}.team{font-size:12px}}</style><script src="./build.js?v=480"></script></head><body><header class="top"><div class="logo">⛓ LINKS</div><nav class="topnav"><a id="cc" href="./control-center.html">CONTROL CENTER</a></nav><a class="back" id="resultsBack" href="./nfl.html">← BACK TO MY PICKS</a></header><section class="hero"><div class="eyebrow">GAME DAY</div><h1>LIVE SCORES</h1><p>Live, final and upcoming team scores. Final winners are green and losing teams are red.</p></section><div class="livebar"><div class="livebrand"><i class="dot"></i> LINKS LIVE</div><div id="liveTrack" class="track"><span>Loading live scores…</span></div></div><main class="wrap"><div class="filters" id="filters"><button class="action primary" data-sport="football/nfl" data-mode="week">NFL</button><button class="action" data-sport="football/college-football" data-mode="week">COLLEGE</button></div><div class="period"><button class="action" id="prev">‹ PREVIOUS</button><select class="action" id="week"></select><button class="action" id="today">TODAY / CURRENT</button><button class="action" id="next">NEXT ›</button></div><section class="card"><h2 id="title">NFL SCORES</h2><div id="scores" class="empty">Loading real scores…</div></section></main><footer class="foot">LINKS NEW BUILD · v542</footer><script src="./shell.js?v=542"></script><script>
const q=new URLSearchParams(location.search),pool=q.get('pool'),demo=!pool,fromSport=q.get('sport')||'nfl';const cc=document.getElementById('cc'),back=document.getElementById('resultsBack');if(pool){cc.href='./control-center.html?pool='+encodeURIComponent(pool);back.href='./nfl.html?pool='+encodeURIComponent(pool)}else{cc.remove();back.href=fromSport==='college'?'./college.html':'./nfl.html';back.textContent='← BACK TO MY PICKS'}
let sport='football/nfl',mode='week',week=1,date=new Date();const weekSel=document.getElementById('week');function fillWeeks(){weekSel.innerHTML='';for(let i=1;i<=18;i++)weekSel.add(new Option('Week '+i,i));[['Wild Card',19],['Divisional',20],['Conference',21],['Super Bowl',22]].forEach(x=>weekSel.add(new Option(x[0],x[1])))}fillWeeks();
const fmt=d=>d.toISOString().slice(0,10).replaceAll('-','');async function load(current=false){const box=document.getElementById('scores');box.innerHTML='<div class="empty">Loading real scores…</div>';let url='https://site.api.espn.com/apis/site/v2/sports/'+sport+'/scoreboard?limit=100';if(mode==='week')url+='&week='+week;else url+='&dates='+fmt(date);try{const r=await fetch(url,{cache:'no-store'}),j=await r.json(),ev=j.events||[];if(current&&mode==='week'&&j.week?.number){week=Number(j.week.number);weekSel.value=String(week)}box.innerHTML=ev.length?ev.map(e=>{const cs=e.competitions?.[0]?.competitors||[],a=cs.find(x=>x.homeAway==='away'),h=cs.find(x=>x.homeAway==='home'),post=e.status?.type?.state==='post',live=e.status?.type?.state==='in';const cls=x=>post?(x?.winner?'win':'loss'):'';const tm=x=>'<div class="team '+cls(x)+'"><img class="logoimg" src="'+String(x?.team?.logo||'')+'" alt=""><span>'+String(x?.team?.shortDisplayName||'Team').replace(/[<>]/g,'')+' <b>'+String(x?.score||'')+'</b></span></div>';return '<div class="scorecard '+(live?'live':'')+'"><small>'+(live?'● LIVE · ':'')+String(e.status?.type?.shortDetail||'').replace(/[<>]/g,'')+'</small><div class="teamrow">'+tm(a)+'<span>VS</span>'+tm(h)+'</div></div>'}).join(''):'<div class="empty">No games returned for this period.</div>'}catch{box.innerHTML='<div class="empty">Score feed is temporarily unavailable. No scores were guessed.</div>'}document.getElementById('title').textContent=document.querySelector('[data-sport="'+sport+'"]').textContent+' SCORES';weekSel.style.display=mode==='week'?'block':'none'}
document.querySelectorAll('[data-sport]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-sport]').forEach(x=>x.classList.remove('primary'));b.classList.add('primary');sport=b.dataset.sport;mode=b.dataset.mode;if(mode==='date')date=new Date();load(true)});weekSel.onchange=()=>{week=Number(weekSel.value);load()};document.getElementById('prev').onclick=()=>{if(mode==='week')week=Math.max(1,week-1);else date=new Date(date.getTime()-86400000);weekSel.value=String(week);load()};document.getElementById('next').onclick=()=>{if(mode==='week')week=Math.min(22,week+1);else date=new Date(date.getTime()+86400000);weekSel.value=String(week);load()};document.getElementById('today').onclick=()=>{date=new Date();load(true)};load(true);
</script></body></html>
