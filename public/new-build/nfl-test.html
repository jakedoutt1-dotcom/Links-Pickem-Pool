<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LINKS — NFL TEST</title><link rel="stylesheet" href="./shell.css?v=401"><style>body{background:#03080d;color:#fff;margin:0}.test-banner{position:sticky;top:0;z-index:100000;background:#7b4f00;color:#fff;text-align:center;padding:7px 10px;font:900 11px system-ui;letter-spacing:1px}.wrap{max-width:1180px;margin:auto;padding:16px 5% 40px}.playerbar{display:flex;justify-content:center;gap:8px;padding:12px;background:#07131d;border:1px solid #315168;border-radius:10px}.playerbar b{color:#e8bb5b}.nav{display:flex;gap:7px;overflow-x:auto;padding:12px 0}.nav button{flex:0 0 auto;padding:12px;border:1px solid #315168;border-radius:7px;background:#0a1a25;color:#fff;font-weight:900}.nav .active{border-color:#e8bb5b;color:#e8bb5b}.weeknav{display:grid;grid-template-columns:auto 1fr auto;gap:8px;margin:12px 0}.weeknav button,.weeknav select{min-height:46px;background:#06111a;color:#fff;border:1px solid #315168;border-radius:8px;padding:0 12px;font-weight:900}.game{border:1px solid #315168;background:#07131d;border-radius:12px;padding:14px;margin:10px 0}.game.win{border-color:#4d8b68}.game.loss{border-color:#944}.teams{display:grid;grid-template-columns:1fr 1fr;gap:10px}.team{border:1px solid #315168;background:#0a1a25;border-radius:9px;padding:12px}.team.picked{border-color:#c9953d;background:#152015}.meta,.summary{color:#9fb0bb;font-size:12px}.result{text-align:center;margin-top:10px}.err{padding:20px;border:1px solid #944;background:#241010;border-radius:10px}</style></head><body><div class="test-banner">NFL TEST PAGE · REVIEW BRANCH · PRODUCTION NOT CHANGED</div><header class="top"><div class="brand">LINKS</div><a class="back" href="./index.html">← HOME</a></header><section class="hero"><div class="eyebrow">NFL GAME CENTER</div><h1>Weekly NFL Pick’em</h1><p>Working shared NFL module test.</p></section><div class="wrap"><div class="playerbar"><span>PLAYER&nbsp;</span><b id="playerName">J. Barnes</b></div><div class="nav"><button class="active">PICKS</button><button>LIVE SCORES</button><button>COMPARE PICKS</button><button>PICKS THAT MATTER</button><button>PROJECTED</button><button>WEEKLY STANDINGS</button><button>YEAR STANDINGS</button><button id="printBtn">PRINT MY PICKS</button></div><div class="weeknav"><button id="prev">←</button><select id="week"></select><button id="next">→</button></div><div id="summary" class="summary">Loading…</div><div id="games"></div></div><script>const qp=new URLSearchParams(location.search);const pool=qp.get('pool')||'';const player=qp.get('player')||'J. Barnes';let week=Number(qp.get('week')||3);if(pool){try{const old=JSON.parse(localStorage.getItem('links-current-pool')||'{}');old.id=pool;old.poolId=pool;localStorage.setItem('links-current-pool',JSON.stringify(old))}catch(e){localStorage.setItem('links-current-pool',JSON.stringify({id:pool,poolId:pool}))}}localStorage.setItem('links-player-name',player);document.getElementById('playerName').textContent=player;const sel=document.getElementById('week');for(let i=1;i<=22;i++){const o=document.createElement('option');o.value=i;o.textContent=i<=18?'Week '+i:({19:'Wild Card',20:'Divisional',21:'Conference',22:'Super Bowl'}[i]);if(i===week)o.selected=true;sel.appendChild(o)}const abbr=x=>String(x||'').toUpperCase();function logo(t){return 'https://a.espncdn.com/i/teamlogos/nfl/500/'+abbr(t).toLowerCase()+'.png'}function render(m){const gm=new Map();m.graded.forEach(x=>{if(x.game)gm.set(x.game.id,x)});document.getElementById('summary').textContent=m.schedule.length+' games · '+m.schedule.filter(x=>x.final).length+' final · '+m.player+' · Week '+m.week;document.getElementById('games').innerHTML=m.schedule.map((g,i)=>{const gr=gm.get(g.id),pick=gr?.pick||'',status=gr?.status||'pending';return '<section class="game '+status+'"><b>GAME '+(i+1)+' · '+(g.final?'FINAL':'SCHEDULED')+'</b><div class="teams"><div class="team '+(pick===g.away?'picked':'')+'"><b>'+g.away+'</b><div class="meta">'+(g.awayRecord||'')+(g.awayMoneyline?' · ML '+g.awayMoneyline:'')+'</div></div><div class="team '+(pick===g.home?'picked':'')+'"><b>'+g.home+'</b><div class="meta">'+(g.homeRecord||'')+(g.homeMoneyline?' · ML '+g.homeMoneyline:'')+'</div></div></div><div class="result">'+(g.final?g.away+' '+g.awayScore+' · '+g.home+' '+g.homeScore+' · WINNER '+g.winner:'PENDING')+(pick?' · PICK '+pick+' · '+status.toUpperCase():'')+'</div></section>'}).join('')}async function load(){document.getElementById('summary').textContent='Loading Week '+week+'…';document.getElementById('games').innerHTML='';try{const m=await window.LINKS_NFL_REWRITE.model(week);render(m)}catch(e){document.getElementById('games').innerHTML='<div class="err">'+e.message+'</div>'}}function setWeek(w){week=Math.max(1,Math.min(22,Number(w)));sel.value=week;const u=new URL(location.href);u.searchParams.set('week',week);history.replaceState({},'',u);load()}sel.onchange=e=>setWeek(e.target.value);document.getElementById('prev').onclick=()=>setWeek(week-1);document.getElementById('next').onclick=()=>setWeek(week+1);document.getElementById('printBtn').onclick=()=>window.print();window.addEventListener('links:nfl:ready',load,{once:true});</script><script src="./nfl-rewrite/module.js?v=774"></script></body></html>
