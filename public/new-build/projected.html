<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LINKS — Projected</title><link rel="stylesheet" href="./shell.css?v=403"><style>.wrap{padding:18px 5%;max-width:1050px;margin:auto}.rank{display:grid;grid-template-columns:55px 1fr auto;gap:12px;align-items:center;padding:14px;border-bottom:1px solid #29485e}.rank b:last-child{color:#e8bb5b}.lock{padding:24px;text-align:center}</style></head><body><header class="top"><div class="logo">⛓ LINKS</div><nav class="topnav"><a id="back" href="./control-center.html">CONTROL CENTER</a><a href="./results.html">LIVE SCORES</a></nav></header><div class="livebar"><div class="livebrand"><i class="dot"></i> LINKS LIVE</div><div id="liveTrack" class="track"><span>Loading live scores…</span></div></div><main class="wrap"><section class="card"><div class="eyebrow">POOL OUTLOOK</div><h1>PROJECTED</h1><p class="muted">Projected pool position using locked picks and live game results. Picks stay private until the pool deadline.</p><div id="projection" class="lock">Checking lock status…</div></section></main><script src="./shell.js?v=403"></script><script>const q=new URLSearchParams(location.search),pool=q.get('pool')||'',player=localStorage.getItem('links-player-id')||'';document.getElementById('back').href='./control-center.html'+(pool?'?pool='+encodeURIComponent(pool):'');async function load(){const box=document.getElementById('projection');try{const r=await fetch('./api/projection?pool='+encodeURIComponent(pool)+'&player='+encodeURIComponent(player),{cache:'no-store'}),j=await r.json();if(!j.locked){box.innerHTML='<h2>PICKS ARE STILL PRIVATE</h2><p>Projected standings unlock after the pick deadline.</p>';return}const rows=(j.players||[]).sort((a,b)=>(b.correct-a.correct)||(b.possible-a.possible));box.className='';box.innerHTML=rows.length?rows.map((x,i)=>'<div class="rank"><b>#'+(i+1)+'</b><span>'+String(x.name||'Player').replace(/[<>]/g,'')+'</span><b>'+x.correct+' right · '+x.possible+' live</b></div>').join(''):'<div class="lock">No locked pool picks are available yet.</div>'}catch{box.innerHTML='<h2>PROJECTION UNAVAILABLE</h2><p>No projection was guessed. Try again when the live feed is available.</p>'}}load()</script></body></html>
