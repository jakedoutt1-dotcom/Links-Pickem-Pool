<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#06101a"><title>LINKS Admin</title><style>*{box-sizing:border-box}body{margin:0;background:#02070c;color:#f5f7fa;font-family:Arial,sans-serif;min-height:100vh}.top{height:72px;padding:8px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #29485e;background:#06111b;position:sticky;top:0;z-index:5}.top img{width:180px;max-height:56px;object-fit:contain}.top a{color:#e8bd59;text-decoration:none;font-weight:900;font-size:12px}.wrap{max-width:1180px;margin:auto;padding:18px}.hero{border:1px solid #9c722d;border-radius:12px;padding:22px;background:linear-gradient(120deg,#102536,#050b11);margin-bottom:14px}.hero h1{margin:4px 0;font-size:28px}.eyebrow{color:#e8bd59;font-size:11px;font-weight:900;letter-spacing:2px}.card{border:1px solid #29485e;border-radius:10px;background:#07131d;padding:16px;margin-bottom:12px}.auth{max-width:520px;margin:55px auto}.form{display:grid;gap:9px}input,button{font:inherit;border-radius:7px;padding:12px}input{border:1px solid #36576d;background:#020a10;color:#fff}button{border:1px solid #49677b;background:#102a3e;color:#fff;font-weight:900;cursor:pointer}.primary{border-color:#e8bd59;background:linear-gradient(#7c551d,#35220c)}.danger{border-color:#a94747;background:#351313}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{border:1px solid #29485e;border-radius:9px;padding:15px;background:#091925}.stat b{font-size:30px;display:block;color:#e8bd59}.tabs{display:flex;gap:7px;overflow:auto;margin:12px 0}.tabs button{white-space:nowrap}.tabs .on{border-color:#e8bd59;color:#e8bd59}.row{display:grid;grid-template-columns:1.4fr 1fr .7fr auto;gap:8px;align-items:center;padding:11px 4px;border-bottom:1px solid #203746}.row:last-child{border:0}.muted{color:#91a5b3;font-size:12px}.actions{display:flex;gap:6px;flex-wrap:wrap}.hide{display:none!important}@media(max-width:700px){.wrap{padding:10px}.grid{grid-template-columns:1fr}.row{grid-template-columns:1fr}.top img{width:145px}.hero h1{font-size:22px}}</style><script src="./build.js?v=611"></script></head><body><header class="top"><img src="./assets/links-logo.png" onerror="this.src='./assets/app-logo.png'" alt="LINKS"><a href="./">← HOME</a></header><div class="wrap"><section id="auth" class="card auth"><div class="eyebrow">OWNER ACCESS</div><h1 id="authTitle">LINKS ADMIN</h1><p id="authCopy" class="muted">Checking administrator setup…</p><div class="form"><input id="pw" type="password" autocomplete="current-password" placeholder="Admin password"><input id="pw2" class="hide" type="password" autocomplete="new-password" placeholder="Confirm admin password"><button id="authBtn" class="primary">CONTINUE</button><div id="authMsg" class="muted"></div></div></section><main id="dash" class="hide"><section class="hero"><div class="eyebrow">LINKS SYSTEM CONTROL</div><h1>MASTER ADMIN</h1><p class="muted">Manage the LINKS platform, pools, commissioners, players, email and system controls.</p><div class="actions"><button id="refresh">REFRESH</button><button id="changePw">CHANGE ADMIN PASSWORD</button><button id="logout">SIGN OUT</button></div></section><section class="grid"><div class="stat"><b id="poolN">0</b>POOLS</div><div class="stat"><b id="playerN">0</b>PLAYERS</div><div class="stat"><b id="inviteN">0</b>PENDING INVITES</div></section><nav class="tabs"><button class="on" data-tab="pools">POOLS</button><button data-tab="commissioners">COMMISSIONERS</button><button data-tab="players">PLAYERS</button><button data-tab="games">GAMES</button><button data-tab="email">EMAIL</button><button data-tab="playmaker">PLAYMAKER</button><button data-tab="website">WEBSITE</button><button data-tab="revenue">REVENUE</button><button data-tab="system">SYSTEM</button><button data-tab="activity">ACTIVITY</button></nav><section id="content" class="card"></section></main></div><script>
const API='./api/pools',auth=document.getElementById('auth'),dash=document.getElementById('dash'),msg=document.getElementById('authMsg');let setup=false,data=null;const token=()=>sessionStorage.getItem('links-owner-admin-token')||'';
async function status(){try{const r=await fetch(API+'?admin=status',{cache:'no-store'}),j=await r.json();setup=!!j.passwordSet;authTitle.textContent=setup?'LINKS ADMIN LOGIN':'SET LINKS ADMIN PASSWORD';authCopy.textContent=setup?'Enter your master LINKS Admin password.':'First-time setup: choose the master password for the LINKS system.';pw2.classList.toggle('hide',setup);authBtn.textContent=setup?'SIGN IN →':'SET ADMIN PASSWORD →'}catch{msg.textContent='Admin service is unavailable.'}}
authBtn.onclick=async()=>{msg.textContent='WORKING…';const password=pw.value;if(!setup&&password!==pw2.value){msg.textContent='Passwords do not match.';return}const action=setup?'linksAdminLogin':'linksAdminSetup',r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,password})}),j=await r.json();if(!r.ok){msg.textContent=j.error||'Unable to continue.';return}if(!setup){setup=true;pw.value=pw2.value='';await status();msg.textContent='Password set. Sign in with it.';return}sessionStorage.setItem('links-owner-admin-token',j.token);openDash()};
async function openDash(){const r=await fetch(API+'?admin=dashboard',{headers:{Authorization:'Bearer '+token()},cache:'no-store'}),j=await r.json();if(!r.ok){sessionStorage.removeItem('links-owner-admin-token');auth.classList.remove('hide');dash.classList.add('hide');msg.textContent=j.error||'Please sign in.';return}data=j;auth.classList.add('hide');dash.classList.remove('hide');poolN.textContent=j.stats.pools;playerN.textContent=j.stats.players;inviteN.textContent=j.stats.pendingInvites;render('pools')}
function render(tab){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));if(tab==='pools'){content.innerHTML='<h2>ALL POOLS</h2><p class="muted">Open a pool’s commissioner controls without mixing NFL and College settings.</p>'+data.pools.map(p=>'<div class="row"><div><b>'+esc(p.name)+'</b><div class="muted">'+esc(p.code)+'</div></div><div>'+esc(p.commissionerEmail||'')+'</div><div>'+(p.active?'ACTIVE':'INACTIVE')+'</div><div class="actions"><button onclick="openPool(\''+p.id+'\',\'NFL Pick’em\')">NFL ADMIN</button><button onclick="openPool(\''+p.id+'\',\'College Pick’em\')">COLLEGE ADMIN</button></div></div>').join('')||'<p>No pools yet.</p>';return}const copy={commissioners:['COMMISSIONERS','Search and manage commissioner accounts, welcomes and access.'],players:['PLAYERS','Player lookup, access and password recovery controls.'],games:['GAMES','Global game availability, season status and rollover controls.'],email:['EMAIL','Invitation, welcome, reset-email and delivery tools.'],playmaker:['PLAYMAKER','Odds-provider, Playmaker availability and handoff controls.'],website:['WEBSITE','Homepage announcements, maintenance notices and featured content.'],revenue:['REVENUE','Packages, free-pool rules, ads and affiliate settings.'],system:['SYSTEM','Build health, database status and emergency game controls.'],activity:['ACTIVITY','Owner-admin activity and audit history.']}[tab];content.innerHTML='<h2>'+copy[0]+'</h2><p class="muted">'+copy[1]+'</p><p>Master control section is ready for the next controls without exposing commissioner-only settings to regular users.</p>'}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function openPool(id,game){location.href='./commissioner.html?pool='+encodeURIComponent(id)+'&game='+encodeURIComponent(game)+'&view=week'}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>render(b.dataset.tab));refresh.onclick=openDash;logout.onclick=()=>{sessionStorage.removeItem('links-owner-admin-token');location.reload()};changePw.onclick=async()=>{const password=prompt('Enter a NEW LINKS Admin password (8+ characters):');if(!password)return;const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token()},body:JSON.stringify({action:'linksAdminChangePassword',password})}),j=await r.json();alert(r.ok?'Admin password changed. Sign in again.':(j.error||'Password not changed.'));if(r.ok){sessionStorage.removeItem('links-owner-admin-token');location.reload()}};(async()=>{await status();if(token())openDash()})();
</script></body></html>
