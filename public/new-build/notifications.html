<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LINKS — Notifications</title><link rel="stylesheet" href="./shell.css?v=387"><style>.notice{padding:13px;border:1px solid #29485e;border-radius:8px;margin:8px 0;background:#07131d}.notice small{display:block;color:#8194a2}</style><style>.hero{position:relative;overflow:hidden;background-image:linear-gradient(90deg,#02070de8,#06111bc9 48%,#03080de8),url('./assets/links-stadium-hero.png')!important;background-size:cover!important;background-position:center 55%!important}.hero>*{position:relative;z-index:2}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,#03080d99);pointer-events:none}.logo{font-size:0;width:190px;height:52px;background:url('./assets/ChatGPT Image Sep 22, 2026, 07_35_27 PM.png') left center/contain no-repeat}.logo small{display:none}</style><script src="./build.js?v=global1"></script></head><body><header class="top"><div class="logo">⛓ LINKS<small>PICKS. POOLS. PEOPLE.</small></div><a class="back" href="./control-center.html">← CONTROL CENTER</a></header><section class="hero"><div class="eyebrow">LINKS ALERTS</div><h1>NOTIFICATIONS</h1><p>Deadlines, pool invitations, results and commissioner messages without fake activity.</p></section><main class="grid"><section class="card"><h2>INBOX</h2><div id="notices"></div></section><aside class="card"><h2>PREFERENCES</h2><label class="notice"><input type="checkbox" data-pref="locks" checked> Pick-lock reminders</label><label class="notice"><input type="checkbox" data-pref="results" checked> Results</label><label class="notice"><input type="checkbox" data-pref="pool" checked> Pool activity</label><label class="notice"><input type="checkbox" data-pref="commissioner" checked> Commissioner messages</label></aside></main><footer class="foot">LINKS NEW BUILD · v387</footer><script src="./shell.js?v=387"></script><script>const K='links-notification-prefs-v1',N='links-notifications-v1';let prefs={};try{prefs=JSON.parse(localStorage.getItem(K)||'{}')}catch{}document.querySelectorAll('[data-pref]').forEach(x=>{if(x.dataset.pref in prefs)x.checked=!!prefs[x.dataset.pref];x.onchange=()=>{prefs[x.dataset.pref]=x.checked;localStorage.setItem(K,JSON.stringify(prefs))}});let n=[];try{n=JSON.parse(localStorage.getItem(N)||'[]')}catch{};let pools=[];try{pools=JSON.parse(localStorage.getItem('links-pools-v1')||'[]')}catch{};const generated=[];for(const p of pools.filter(x=>x.active!==false)){const games=(p.games||[p.game]).filter(Boolean);generated.push({title:p.name||'LINKS Pool',time:'POOL STATUS',message:games.length+' active game type'+(games.length===1?'':'s')+' · '+(p.role==='commissioner'?'Commissioner':'Player')})}const all=[...n,...generated];document.getElementById('notices').innerHTML=all.length?all.map(x=>'<div class="notice"><b>'+String(x.title||'LINKS').replace(/[<>]/g,'')+'</b><small>'+String(x.time||'').replace(/[<>]/g,'')+'</small><p>'+String(x.message||'').replace(/[<>]/g,'')+'</p></div>').join(''):'<div class="empty">You’re caught up. Real LINKS alerts will appear here as they are generated.</div>';</script></body></html>
