const q=new URLSearchParams(location.search),po=(()=>{try{return JSON.parse(localStorage.getItem('links-current-pool')||'null')||{}}catch{return{}}})(),pool=q.get('pool')||q.get('poolId')||po.id||po.poolId||po.pool_id||'',role=localStorage.getItem('links-player-role')||'',el=document.getElementById('standings'),statusEl=document.getElementById('status'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function num(v){const n=Number(v);return Number.isFinite(n)?n:0}async function getWeek(w){const r=await fetch('./api/standings-v649?pool='+encodeURIComponent(pool)+'&week='+w+'&role='+encodeURIComponent(role)+'&_='+Date.now(),{cache:'no-store'}),j=await r.json().catch(()=>({error:'Standings are temporarily unavailable. Please try again.'}));if(!r.ok)throw Error(j.error||'Week '+w+' unavailable');return j}async function load(){if(!pool){el.textContent='Pool information is missing.';return}try{const failedWeeks=[];const totals=new Map,gradedWeeks=[];let finalGames=0;for(let w=1;w<=22;w++){let j;try{j=await getWeek(w)}catch{failedWeeks.push(w);continue}const rows=Array.isArray(j.rows)?j.rows:[];const graded=num(j.finalGames);if(!rows.length||!graded)continue;gradedWeeks.push({w,graded,expected:num(j.expectedGames),final:!!j.allFinal});finalGames+=graded;const winners=new Set(j.allFinal?(j.finalizedWinners||[]):[]);for(const x of rows){const name=String(x.player||x.name||'').trim();if(!name)continue;const v=totals.get(name)||{name,wins:0,losses:0,weekWins:0};v.wins+=num(x.wins);v.losses+=num(x.losses);if(winners.has(name))v.weekWins++;totals.set(name,v)}}const a=[...totals.values()].sort((a,b)=>b.wins-a.wins||a.losses-b.losses||b.weekWins-a.weekWins||a.name.localeCompare(b.name));statusEl.textContent=gradedWeeks.length?'Season totals · '+gradedWeeks.length+' weeks · '+finalGames+' final games':'No final games counted yet.';if(failedWeeks.length)statusEl.textContent+=' · Incomplete: could not load weeks '+failedWeeks.join(', ');if(!a.length){el.className='empty';el.textContent=failedWeeks.length?'Season standings could not be loaded. Your saved picks and results have not been changed.':'Year standings will appear as soon as the first NFL game is final.';return}el.className='table';el.innerHTML='<div class="row head"><div>Rank</div><div>Player</div><div class="center">W</div><div class="center">L</div><div class="center">Record</div><div class="center">Week Wins</div></div>'+a.map((x,i)=>'<div class="row"><b>'+(i+1)+'</b><b class="player">'+esc(x.name)+'</b><span class="center win">'+x.wins+'</span><span class="center loss">'+x.losses+'</span><b class="center">'+x.wins+'–'+x.losses+'</b><b class="center">'+x.weekWins+'</b></div>').join('')}catch(e){el.className='empty';el.textContent=e.message||'Season standings could not be loaded.'}}window.addEventListener('links:nfl:ready',()=>{window.LINKS_NFL_NAV?.mount('alltime',document.querySelector('main'));});load()
