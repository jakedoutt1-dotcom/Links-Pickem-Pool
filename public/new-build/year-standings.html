<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>LINKS Year Standings</title><style>body{margin:0;background:#05090d;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:980px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px}.logo{font-size:30px;font-weight:1000;color:#efbd58}.back{color:#efbd58;text-decoration:none;font-weight:900}.card{margin-top:20px;padding:22px;border:1px solid #29485d;border-radius:14px;background:#0a141d}h1{margin:0 0 7px}.sub{color:#9db0bc;line-height:1.5}.row{display:grid;grid-template-columns:55px minmax(120px,1fr) 90px 90px;padding:13px 10px;border-bottom:1px solid #1d3444;align-items:center}.head{color:#efbd58;font-size:11px;font-weight:900;text-transform:uppercase}.empty{text-align:center;padding:40px;color:#8fa1ac}.foot{text-align:center;color:#53636e;font-size:10px;letter-spacing:2px;padding:18px}@media(max-width:560px){.wrap{padding:14px}.card{padding:14px}.row{grid-template-columns:42px minmax(100px,1fr) 60px 68px;font-size:13px;padding:12px 4px}.head{font-size:9px}}</style></head><body><div class="wrap"><div class="top"><div class="logo">LINKS</div><a id="back" class="back" href="./nfl-standings.html">WEEKLY STANDINGS</a></div><div class="card"><h1>Year Standings</h1><div class="sub">Season totals from completed weekly results. Weekly Standings remains separate.</div><div class="row head"><div>Rank</div><div>Player</div><div>Wins</div><div>Correct</div></div><div id="standings" class="empty">Loading season standings…</div></div><div class="foot">LINKS BUILD · v762</div></div><script src="./build.js?v=762"></script><script>const q=new URLSearchParams(location.search);const pool=q.get('pool')||q.get('poolId')||(()=>{try{const p=JSON.parse(localStorage.getItem('links-current-pool')||'{}');return p.id||p.poolId||p.pool_id||''}catch{return''}})();if(pool)document.getElementById('back').href='./nfl-standings.html?pool='+encodeURIComponent(pool);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const el=document.getElementById('standings');if(!pool){el.textContent='Pool information is missing.';return}try{const r=await fetch('/new-build/api/legacy-history?pool='+encodeURIComponent(pool),{cache:'no-store'});const j=await r.json();const weeks=Array.isArray(j.weeks)?j.weeks:Array.isArray(j.history)?j.history:[];const m=new Map;for(const w of weeks){const rows=w.standings||w.players||[];for(const x of rows){const n=x.name||x.player||x.playerName;if(!n)continue;const v=m.get(n)||{name:n,wins:0,correct:0};v.correct+=Number(x.correct||x.wins||0);if(x.winner===true||x.isWinner===true)v.wins++;m.set(n,v)}}const a=[...m.values()].sort((a,b)=>b.wins-a.wins||b.correct-a.correct||a.name.localeCompare(b.name));if(!a.length){el.textContent='Season standings will appear from the pool’s completed saved NFL results.';return}el.className='';el.innerHTML=a.map((x,i)=>'<div class="row"><div>'+(i+1)+'</div><div><b>'+esc(x.name)+'</b></div><div>'+x.wins+'</div><div>'+x.correct+'</div></div>').join('')}catch(e){el.textContent='Season standings could not be loaded.'}}load()</script></body></html>
