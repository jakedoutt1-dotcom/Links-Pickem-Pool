ent-pool')||'null')||{}}catch{return{}}})(),pool=q.get('pool')||q.get('poolId')||po.id||po.poolId||po.pool_id||'',role=localStorage.getItem('links-player-role')||'',el=document.getElementById('standings'),statusEl=document.getElementById('status'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));if(pool)document.getElementById('back').href='./nfl-standings.html?pool='+encodeURIComponent(pool);function num(v){const n=Number(v);return Number.isFinite(n)?n:0}function weeklyWinner(rows){if(!rows.length)return[];const sorted=[...rows].sort((a,b)=>num(b.wins)-num(a.wins)||(Number(a.tieDiff??Infinity)-Number(b.tieDiff??Infinity))||String(a.player||'').localeCompare(String(b.player||''))),top=sorted[0],wins=num(top.wins),diff=top.tieDiff==null?null:Number(top.tieDiff);return sorted.filter(x=>num(x.wins)===wins&&((x.tieDiff==null&&diff==null)||Number(x.tieDiff)===diff)).map(x=>String(x.player||''))}async function getWeek(w){const r=await fetch('./api/standings-v649?pool='+encodeURIComponent(pool)+'&week='+w+'&role='+encodeURIComponent(role)+'&_='+Date.now(),{cache:'no-store'}),j=await r.json();if(!r.ok)throw Error(j.error||'Week '+w+' unavailable');return j}async function load(){if(!pool){el.textContent='Pool information is missing.';return}try{let current=1;try{const r=await fetch('https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?limit=1',{cache:'no-store'}),j=await r.json();current=num(j.week?.number)||1}catch{}const totals=new Map,completed=[];for(let w=1;w<=22;w++){if(w>current)break;let j;try{j=await getWeek(w)}catch{continue}if(!j.allFinal)continue;const rows=Array.isArray(j.rows)?j.rows:[];if(!rows.length)continue;completed.push(w);const winners=new Set(weeklyWinner(rows));for(const x of rows){const name=String(x.player||x.name||'').trim();if(!name)continue;const v=totals.get(name)||{name,wins:0,losses:0,weekWins:0,weeks:0};v.wins+=num(x.wins);v.losses+=num(x.losses);v.weeks++;if(winners.has(name))v.weekWins++;totals.set(name,v)}}const a=[...totals.values()].sort((a,b)=>b.wins-a.wins||a.losses-b.losses||b.weekWins-a.weekWins||a.name.localeCompare(b.name));statusEl.textContent=completed.length?'COUNTED FINAL WEEKS: '+completed.map(w=>w<=18?'W'+w:w===19?'WILD CARD':w===20?'DIVISIONAL':w===21?'CONFERENCE':'SUPER BOWL').join(' · '):'No completed weeks counted yet.';if(!a.length){el.className='empty';el.textContent='Year standings will appear after the first NFL week is final.';return}el.className='table';el.innerHTML='<div class="row head"><div>Rank</div><div>Player</div><div class="center">W</div><div class="center">L</div><div class="center">Record</div><div class="center">Week Wins</div></div>'+a.map((x,i)=>'<div class="row"><b>'+(i+1)+'</b><b class="player">'+esc(x.name)+'</b><span class="center win">'+x.wins+'</span><span class="center loss">'+x.losses+'</span><b class="center">'+x.wins+'–'+x.losses+'</b><b class="center">'+x.weekWins+'</b></div>').join('')}catch(e){el.className='empty';el.textContent=e.message||'Season standings could not be loaded.'}}load()</script></body></html>
