<!doctype html><html lang="en"><head><script src="./session-security.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LINKS Game Setup</title><link rel="stylesheet" href="./shell.css"><link rel="stylesheet" href="./commissioner-hub.css"><link rel="icon" type="image/png" href="/links-small-logo.png?v=1"><link rel="apple-touch-icon" href="/links-small-logo.png?v=1"><script src="/new-build/logo-shine.js" defer></script></head><body><header class="top"><a id="backToGame" class="action" hidden>← BACK TO PICKS</a></header><main class="hub"><section class="hub-panel"><h1 id="title">Game Admin</h1><p>Set the current event’s deadline and eligible selections. Existing picks stay saved.</p><form id="setup"><label>Event title<input name="title" maxlength="100" required></label><label>Deadline (your local time)<input name="deadline" type="datetime-local" required></label><label>Maximum selections per player<input name="limit" type="number" min="1" max="50" value="1" required></label><label>Add eligible names, one per line<textarea name="options" rows="8" style="width:100%;box-sizing:border-box;background:#061018;color:#fff;padding:12px"></textarea></label><button class="action primary">SAVE GAME SETUP</button></form><p id="message" role="status"></p></section></main><script src="./shell.js?v=20261004"></script><script src="./game-setup.js?v=20261001"></script><script src="./game-admin-layout.js?v=1"></script></body></html>
