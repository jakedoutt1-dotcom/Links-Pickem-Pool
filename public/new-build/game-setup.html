<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LINKS Game Setup</title><link rel="stylesheet" href="./shell.css"><link rel="stylesheet" href="./commissioner-hub.css"></head><body><header class="top"><a class="action" href="./commissioner-hub.html">← MY POOLS</a></header><main class="hub"><section class="hub-panel"><h1 id="title">Game setup</h1><p>Set the current event’s deadline and eligible selections. Existing picks stay saved.</p><form id="setup"><label>Event title<input name="title" maxlength="100" required></label><label>Deadline (your local time)<input name="deadline" type="datetime-local" required></label><label>Maximum selections per player<input name="limit" type="number" min="1" max="50" value="1" required></label><label>Add eligible names, one per line<textarea name="options" rows="8" style="width:100%;box-sizing:border-box;background:#061018;color:#fff;padding:12px"></textarea></label><button class="action primary">SAVE GAME SETUP</button></form><p id="message" role="status"></p></section></main><script src="./shell.js"></script><script src="./game-setup.js"></script></body></html>
