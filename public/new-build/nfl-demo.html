<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>LINKS — NFL Pick’em Demo</title><style>html,body,#demo{margin:0;width:100%;height:100%;border:0;background:#03080d}body{overflow:hidden}#demo{display:block}</style></head><body><iframe id="demo" src="./nfl.html" title="LINKS NFL Pick'em Demo"></iframe><script>const f=document.getElementById('demo');function unlock(){try{const d=f.contentDocument;if(!d)return;const cd=d.getElementById('pickCountdown');if(cd){const s=cd.querySelector('span'),b=cd.querySelector('b');if(s)s.textContent='PRACTICE DEMO';if(b)b.textContent='NO DEADLINE · PICKS STAY OPEN'}const line=d.getElementById('gameStatusLine');if(line)line.textContent='NFL PICK’EM DEMO · PRACTICE MODE · NO PICK DEADLINE';d.querySelectorAll('#slate .game-team').forEach(x=>{x.disabled=false;x.removeAttribute('disabled')});d.querySelectorAll('#slate .game-state').forEach(x=>x.textContent='DEMO OPEN')}catch(e){}}f.addEventListener('load',()=>{unlock();setInterval(unlock,500)});</script></body></html>
