<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LINKS — NFL Live Scores</title><link rel="stylesheet" href="./shell.css?v=657"><script src="./build.js?v=657"></script><style>.wrap{padding:18px 5%;max-width:1100px;margin:auto}.score{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;padding:14px;margin:9px 0;border:1px solid #29485e;border-radius:10px;background:#07131d}.team{display:flex;align-items:center;gap:8px;font-weight:900}.team:last-child{justify-content:flex-end;text-align:right}.team img{width:38px;height:38px;object-fit:contain}.num{font-size:24px;font-weight:950}.state{text-align:center;color:#e8bb5b;font-size:11px;font-weight:900}.weekbar{display:grid;grid-template-columns:auto 1fr auto;gap:8px;margin:12px 0}.weekbar button,.weekbar select{min-height:44px;border:1px solid #315168;border-radius:8px;background:#07131d;color:#fff;padding:8px;font-weight:900;text-align:center}</style></head><body><header class="top"><div class="logo">⛓ LINKS</div></header><main class="wrap"><section class="card"><div class="eyebrow">NFL PICK’EM</div><h1>LIVE SCORES</h1><div class="weekbar"><button id="prev">←</button><select id="week"></select><button id="next">→</button></div><div id="status" class="proof">Loading scores…</div><div id="scores"></div></section></main><footer class="foot">LINKS NEW BUILD · v657</footer><script src="./shell.js?v=657"></script><script>const q=new URLSearchParams(location.search);let selected=Number(q.get('week')||0),current=0;const labels={19:'Wild Card',20:'Divisional',21:'Conference Championships',22:'Super Bowl'};for(let w=1;w<=22;w++)week.add(new Option(w<=18?'Week '+w:labels[w],w));function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function load(){try{let base='https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?limit=100';if(!current){const r=await fetch(base,{cache:'no-store'}),j=await r.json();current=Number(j.week?.number||1);if(!selected)selected=current;week.value=String(selected)}const post=selected>18,type=post?3:2,apiWeek=post?({19:1,20:2,21:3,22:5}[selected]||1):selected,r=await fetch(base+'&seasontype='+type+'&week='+apiWeek,{cache:'no-store'}),j=await r.json(),events=j.events||[];status.textContent=(selected<=18?'WEEK '+selected:labels[selected])+' · '+events.length+' GAMES';scores.innerHTML=events.map(e=>{const c=e.competitions?.[0]||{},a=(c.competitors||[]).find(x=>x.homeAway==='away'),h=(c.competitors||[]).find(x=>x.homeAway==='home'),d=e.status?.type?.shortDetail||'';if(!a||!h)return'';const t=x=>'<div class="team"><img src="'+(x.team?.logo||'')+'"><span>'+esc(x.team?.shortDisplayName||x.team?.displayName)+'</span><span class="num">'+esc(x.score||'')+'</span></div>';return '<div class="score">'+t(a)+'<div class="state">'+esc(d)+'</div>'+t(h)+'</div>'}).join('')||'<div class="empty">No games found for this week.</div>'}catch(e){status.textContent='Live scores are temporarily unavailable.'}}function go(w){selected=Math.max(1,Math.min(22,Number(w)||current||1));week.value=String(selected);const u=new URL(location.href);u.searchParams.set('week',selected);history.replaceState(null,'',u);load()}prev.onclick=()=>go(selected-1);next.onclick=()=>go(selected+1);week.onchange=()=>go(week.value);load();setInterval(load,60000)</script></body></html>
