<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LINKS — Compare Picks</title><link rel="stylesheet" href="./shell.css?v=644"><style>
.wrap{padding:18px 5%;max-width:1100px;margin:auto}.weekbar{display:grid;grid-template-columns:auto 1fr auto;gap:8px;margin:12px 0}.weekbar select,.weekbar button,.h2h select{min-height:44px;border:1px solid #315168;border-radius:8px;background:#07131d;color:#fff;padding:8px;font-weight:900}.compare-player{border:1px solid #34404d;border-radius:12px;padding:10px;margin:9px 0;background:#111923}.compare-player h4{margin:0 0 8px;font-size:16px}.compare-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}.compare-pick{display:flex;justify-content:space-between;gap:8px;align-items:center;background:#18222d;border-radius:8px;padding:7px 8px;font-size:13px}.compare-pick .game-no{opacity:.65;min-width:28px}.compare-pick .team-name{font-weight:800;text-align:right}.compare-correct{border:1px solid rgba(85,239,141,.38)}.compare-correct .team-name{color:#55ef8d}.compare-wrong{border:1px solid rgba(255,100,100,.30)}.compare-wrong .team-name{color:#ff6464}.compare-tie{margin-top:8px;padding-top:8px;border-top:1px solid #34404d;font-size:13px}.h2h{margin:14px 0;border:1px solid #34485a;background:#101922;padding:14px;border-radius:12px}.h2h-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.h2h-summary{display:flex;justify-content:space-between;background:#182530;border-radius:9px;padding:8px 10px;margin:11px 0}.h2h-row{display:grid;grid-template-columns:34px 1fr 1fr;gap:6px;margin:6px 0}.h2h-team{min-height:50px;display:flex;align-items:center;gap:6px;padding:7px;background:#192731;border-radius:9px;font-size:12px}.h2h-win{border:1px solid #2a9d62;color:#45e58d}.h2h-loss{border:1px solid #9d3b42;color:#ff737c}.signed{padding:8px 0;color:#e8bb5b;font-weight:900}.note{color:#aebcc6}.logo32{width:28px;height:28px;object-fit:contain}@media(min-width:700px){.compare-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:520px){.h2h-grid{grid-template-columns:1fr}}
</style><script src="./build.js?v=644"></script></head><body><header class="top"><div class="logo">⛓ LINKS</div><a class="back" id="back" href="./nfl.html">← NFL PICK’EM</a></header><div id="signed" class="signed wrap"></div><div class="livebar"><div class="livebrand"><i class="dot"></i> LINKS LIVE</div><div id="liveTrack" class="track"><span>Loading live scores…</span></div></div><main class="wrap"><section class="card"><div class="eyebrow">NFL PICK’EM</div><h1>COMPARE PICKS</h1><p class="note">Same behavior as the old LINKS Compare Picks: picks stay private until lock, then everyone’s picks are shown. Final winners turn green and losers turn red.</p><div class="weekbar"><button id="prev">←</button><select id="week"></select><button id="next">→</button></div><div id="status" class="proof">Loading…</div><div id="h2h"></div><div id="box"></div></section></main><footer class="foot">LINKS NEW BUILD · v644</footer><script src="./shell.js?v=644"></script><script>
const q=new URLSearchParams(location.search),pool=q.get('pool')||'',role=localStorage.getItem('links-player-role')||localStorage.getItem('links-current-role')||'',playerName=localStorage.getItem('links-player-name')||localStorage.getItem('links-player-id')||'',esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let selected=Number(q.get('week')||0)||1,data=null;
signed.textContent=playerName?'SIGNED IN: '+playerName:'';
back.href='./nfl.html?pool='+encodeURIComponent(pool)+'&week='+encodeURIComponent(selected);
for(let w=1;w<=22;w++)week.add(new Option(w<=18?'Week '+w:({19:'Wild Card',20:'Divisional',21:'Conference Championships',22:'Super Bowl'}[w]||'Week '+w),w));
week.value=String(selected);
function logo(team){let t=String(team||'').toLowerCase();if(t==='was')t='wsh';return t?'https://a.espncdn.com/i/teamlogos/nfl/500/'+t+'.png':''}
function go(w){w=Math.max(1,Math.min(22,Number(w)||1));const u=new URL(location.href);u.searchParams.set('week',w);location.href=u.href}
prev.onclick=()=>go(selected-1);next.onclick=()=>go(selected+1);week.onchange=()=>go(week.value);
function drawH2H(players,results){if(players.length<2){h2h.innerHTML='';return}const opts=players.map((p,i)=>'<option value="'+i+'">'+esc(p.player)+'</option>').join('');h2h.innerHTML='<div class="h2h"><h3 style="margin-top:0">HEAD-TO-HEAD COMPARE</h3><div class="note">Choose two players to quickly see where their picks are different.</div><div class="h2h-grid"><select id="a">'+opts+'</select><select id="b">'+opts+'</select></div><div id="sum"></div><div id="rows"></div></div>';a.value='0';b.value='1';const draw=()=>{const p1=players[+a.value],p2=players[+b.value];let same=0,diff=0,rows=[];for(let i=0;i<Math.max(Object.keys(p1.picks||{}).length,Object.keys(p2.picks||{}).length,16);i++){const x=String(p1.picks?.[i]||'—'),y=String(p2.picks?.[i]||'—');if(x===y){if(x!=='—')same++;continue}if(x==='—'&&y==='—')continue;diff++;const cell=(t)=>{const win=results[i],cls=win?(t===win?' h2h-win':' h2h-loss'):'';return '<div class="h2h-team'+cls+'">'+(t!=='—'?'<img class="logo32" src="'+logo(t)+'" alt="">':'')+'<b>'+esc(t)+'</b></div>'};rows.push('<div class="h2h-row"><div style="display:flex;align-items:center;justify-content:center">G'+(i+1)+'</div>'+cell(x)+cell(y)+'</div>')}sum.innerHTML='<div class="h2h-summary"><b>Different: '+diff+'</b><span>Same: '+same+'</span></div><div class="note">'+esc(p1.player)+' tiebreaker: <b>'+esc(p1.tie??'—')+'</b> &nbsp; · &nbsp; '+esc(p2.player)+' tiebreaker: <b>'+esc(p2.tie??'—')+'</b></div>';rows.innerHTML=rows.length?rows.join(''):'<div class="note" style="padding:12px;text-align:center">These players made the same picks.</div>'};a.onchange=draw;b.onchange=draw;draw()}
async function load(){status.textContent='Loading Week '+selected+'…';try{const r=await fetch('./api/compare-picks?pool='+encodeURIComponent(pool)+'&week='+selected+'&role='+encodeURIComponent(role),{cache:'no-store'}),j=await r.json();data=j;if(!r.ok)throw Error(j.error||'Compare Picks unavailable');if(!j.locked){status.innerHTML='<b>PICKS ARE STILL PRIVATE</b><div class="note">Everyone’s picks appear after the weekly picks lock.</div>';box.innerHTML='';h2h.innerHTML='';return}status.innerHTML='<b>WEEK '+selected+' · LOCKED</b><div class="note">Correct picks turn green after a game is final; losing picks turn red.</div>';drawH2H(j.players||[],j.results||{});box.innerHTML=(j.players||[]).map(p=>{let cells=[];const max=Math.max((j.games||[]).length,...Object.keys(p.picks||{}).map(Number).map(x=>x+1),0);for(let i=0;i<max;i++){const t=p.picks?.[i],win=j.results?.[i]??j.results?.[String(i)]??null;let cls='',mark='';if(t&&win){if(t===win){cls=' compare-correct';mark=' ✓'}else{cls=' compare-wrong';mark=' ✕'}}cells.push('<div class="compare-pick'+cls+'"><span class="game-no">G'+(i+1)+'</span>'+(t?'<img class="logo32" src="'+logo(t)+'" alt="">':'')+'<span class="team-name">'+esc(t||'—')+mark+'</span></div>')}return '<div class="compare-player"><h4>'+esc(p.player)+'</h4><div class="compare-grid">'+cells.join('')+'</div><div class="compare-tie"><b>Tiebreaker:</b> '+esc(p.tie??'—')+'</div></div>'}).join('')||'<div class="empty">No picks were saved for this week.</div>'}catch(e){status.textContent=e.message;box.innerHTML='';h2h.innerHTML=''}}load();
</script></body></html>
