<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LINKS — Compare Picks</title><link rel="stylesheet" href="./shell.css?v=403"><style>.wrap{padding:18px 5%;max-width:1100px;margin:auto}.gridp{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.player{border:1px solid #315168;border-radius:8px;background:#07131d;padding:12px}.pick{padding:7px 0;border-bottom:1px solid #1d3545;font-size:11px}</style></head><body><header class="top"><div class="logo">⛓ LINKS</div><nav class="topnav"><a id="back" href="./control-center.html">CONTROL CENTER</a><a id="scores" href="./results.html">LIVE SCORES</a></nav></header><div class="livebar"><div class="livebrand"><i class="dot"></i> LINKS LIVE</div><div id="liveTrack" class="track"><span>Loading live scores…</span></div></div><main class="wrap"><section class="card"><div class="eyebrow">LOCKED PICKS ONLY</div><h1>COMPARE PICKS</h1><p class="muted">Everybody’s selections stay private until the deadline. After lock, the pool can compare picks here.</p><div id="box" class="empty">Checking lock status…</div></section></main><script src="./shell.js?v=403"></script><script>const q=new URLSearchParams(location.search),pool=q.get('pool')||'',game=q.get('game')||'NFL Pick’em';document.getElementById('back').href='./control-center.html?pool='+encodeURIComponent(pool);document.getElementById('scores').href='./results.html?pool='+encodeURIComponent(pool);async function load(){const box=document.getElementById('box');try{const r=await fetch('./api/compare-picks?pool='+encodeURIComponent(pool)+'&game='+encodeURIComponent(game)+'&period=current',{cache:'no-store'}),j=await r.json();if(!j.locked){box.innerHTML='<h2>PICKS ARE STILL PRIVATE</h2><p>Compare Picks unlocks after the deadline.</p>';return}const groups={};for(const p of j.picks||[])(groups[p.playerName]??=[]).push(p);box.className='gridp';box.innerHTML=Object.entries(groups).map(([name,ps])=>'<div class="player"><h3>'+String(name).replace(/[<>]/g,'')+'</h3>'+ps.map(p=>'<div class="pick">'+String(p.selection).replace(/[<>]/g,'')+(p.points?' · '+p.points+' pts':'')+'</div>').join('')+'</div>').join('')||'<div class="empty">No locked picks are available yet.</div>'}catch{box.innerHTML='<div class="empty">Compare Picks is unavailable right now. No private picks were exposed.</div>'}}load()</script></body></html>
