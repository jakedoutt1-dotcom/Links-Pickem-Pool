<script>(async()=>{await window.LINKS_NFL_WEEK_READY;

const q=new URLSearchParams(location.search),po=(()=>{try{return JSON.parse(localStorage.getItem('links-current-pool')||'null')||{}}catch{return{}}})(),pool=q.get('pool')||po.id||'',role=localStorage.getItem('links-player-role')||'',weekEl=document.getElementById('week'),statusEl=document.getElementById('status'),boxEl=document.getElementById('box'),labels={19:'Wild Card',20:'Divisional',21:'Conference Championships',22:'Super Bowl'},esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let selected=Number(q.get('week')||0)||1;for(let w=1;w<=22;w++)weekEl.add(new Option(w<=18?'Week '+w:labels[w],w));function go(w){selected=Math.max(1,Math.min(22,Number(w)||1));weekEl.value=selected;const u=new URL(location.href);u.searchParams.set('week',selected);history.replaceState(null,'',u);load()}prev.onclick=()=>go(selected-1);next.onclick=()=>go(selected+1);weekEl.onchange=()=>go(weekEl.value);function logo(t){t=String(t||'').toLowerCase().replace('was','wsh');return t?'https://a.espncdn.com/i/teamlogos/nfl/500/'+t+'.png':''}async function load(){statusEl.textContent='Loading…';boxEl.innerHTML='';try{const requested=selected,r=await fetch('./api/compare-picks?pool='+encodeURIComponent(pool)+'&week='+requested+'&_='+Date.now(),{cache:'no-store'}),j=await r.json();if(selected!==requested)return;const schedule=(j.games||[]).map(g=>({...g,final:g.completed}));if(!r.ok)throw Error(j.error||'Compare Picks unavailable');if(!j.locked){statusEl.innerHTML='<b>Picks are private until the first kickoff of the week.</b>';return}const winnerByTeam=new Map();schedule.forEach(g=>{winnerByTeam.set(g.home,g);winnerByTeam.set(g.away,g)});statusEl.innerHTML='<b>WEEK '+selected+' · LOCKED</b>';boxEl.innerHTML=(j.players||[]).map(p=>{let cells=[],max=Math.max((j.games||[]).length,...Object.keys(p.picks||{}).map(Number).map(x=>x+1),0);for(let i=0;i<max;i++){const t=p.picks?.[i],g=t?winnerByTeam.get(String(t).toUpperCase().replace(/^WAS$/,'WSH
