<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LINKS — Compare Picks</title><link rel="stylesheet" href="./shell.css?v=711"><style>.wrap{padding:18px 5%;max-width:1100px;margin:auto}.weekbar{display:grid;grid-template-columns:auto 1fr auto;gap:8px;margin:12px 0}.weekbar select,.weekbar button{min-height:44px;border:1px solid #315168;border-radius:8px;background:#07131d;color:#fff;padding:8px;font-weight:900}.compare-player{border:1px solid #34404d;border-radius:12px;padding:10px;margin:9px 0;background:#111923}.compare-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}.compare-pick{display:flex;justify-content:space-between;align-items:center;background:#18222d;border-radius:8px;padding:7px}.compare-correct{border:1px solid #55ef8d}.compare-wrong{border:1px solid #ff6464}.logo32{width:28px;height:28px;object-fit:contain}</style><script src="./build.js?v=711"></script></head><body><header class="top"><div class="logo">⛓ LINKS</div></header><nav class="nflnav" id="nflnav"></nav><div class="livebar"><div class="livebrand"><i class="dot"></i> LINKS LIVE</div><div id="liveTrack" class="track"><span>Loading live scores…</span></div></div><main class="wrap"><section class="card"><div class="eyebrow">NFL PICK’EM</div><h1>COMPARE PICKS</h1><div class="weekbar"><button id="prev">←</button><select id="week"></select><button id="next">→</button></div><div id="status" class="proof">Loading…</div><div id="box"></div></section></main><footer class="foot">LINKS NEW BUILD · v711</footer><script src="./shell.js?v=711"></script><script>
const q=new URLSearchParams(location.search),po=(()=>{try{return JSON.parse(localStorage.getItem('links-current-pool')||'null')||{}}catch{return{}}})(),pool=q.get('pool')||po.id||'',role=localStorage.getItem('links-player-role')||'',weekEl=document.getElementById('week'),statusEl=document.getElementById('status'),boxEl=document.getElementById('box'),labels={19:'Wild Card',20:'Divisional',21:'Conference Championships',22:'Super Bowl'},esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let selected=Number(q.get('week')||0)||1;for(let w=1;w<=22;w++)weekEl.add(new Option(w<=18?'Week '+w:labels[w],w));function go(w){selected=Math.max(1,Math.min(22,Number(w)||1));weekEl.value=selected;const u=new URL(location.href);u.searchParams.set('week',selected);history.replaceState(null,'',u);load()}prev.onclick=()=>go(selected-1);next.onclick=()=>go(selected+1);weekEl.onchange=()=>go(weekEl.value);function logo(t){t=String(t||'').toLowerCase().replace('was','wsh');return t?'https://a.espncdn.com/i/teamlogos/nfl/500/'+t+'.png':''}async function load(){statusEl.textContent='Loading…';boxEl.innerHTML='';try{const r=await fetch('./api/compare-picks?pool='+encodeURIComponent(pool)+'&week='+selected+'&role='+encodeURIComponent(role)+'&_='+Date.now(),{cache:'no-store'}),j=await r.json();if(!r.ok)throw Error(j.error||'Compare Picks unavailable');if(!j.locked&&!/admin|commissioner/i.test(role)){statusEl.innerHTML='<b>PICKS ARE STILL PRIVATE</b>';return}statusEl.innerHTML='<b>WEEK '+selected+' · LOCKED</b>';boxEl.innerHTML=(j.players||[]).map(p=>{let cells=[],max=Math.max((j.games||[]).length,...Object.keys(p.picks||{}).map(Number).map(x=>x+1),0);for(let i=0;i<max;i++){const t=p.picks?.[i],win=j.results?.[i]??j.results?.[String(i)]??null,cls=t&&win?(t===win?' compare-correct':' compare-wrong'):'';cells.push('<div class="compare-pick'+cls+'"><span>G'+(i+1)+'</span>'+(t?'<img class="logo32" src="'+logo(t)+'">':'')+'<b>'+esc(t||'—')+'</b></div>')}return '<div class="compare-player"><h4>'+esc(p.player)+'</h4><div class="compare-grid">'+cells.join('')+'</div><div><b>Tiebreaker:</b> '+esc(p.tie??'—')+'</div></div>'}).join('')||'<div class="proof">No picks were saved for this week.</div>'}catch(e){statusEl.textContent=e.message||'Compare Picks unavailable'}}async function boot(){if(!q.get('week')){try{const r=await fetch('https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?limit=1',{cache:'no-store'}),j=await r.json();selected=Number(j.week?.number||1)||1}catch{}}weekEl.value=selected;load()}boot();
</script></body></html>
