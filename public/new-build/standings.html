<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LINKS — Standings</title><link rel="stylesheet" href="./shell.css?v=403"><style>.wrap{padding:18px 5%;max-width:1050px;margin:auto}.games{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.games a{padding:18px;border:1px solid #315168;border-radius:8px;color:#fff;text-decoration:none;font-weight:900;background:#07131d}@media(max-width:650px){.games{grid-template-columns:1fr 1fr}}</style></head><body><header class="top"><div class="logo">⛓ LINKS</div><nav class="topnav"><a id="back" href="./control-center.html">CONTROL CENTER</a><a href="./results.html">LIVE SCORES</a></nav></header><main class="wrap"><section class="card"><div class="eyebrow">YOUR POOL</div><h1>STANDINGS</h1><p class="muted">Choose a pool game to view its standings and results.</p><div id="games" class="games"></div></section></main><script>const q=new URLSearchParams(location.search),pool=q.get('pool');document.getElementById('back').href='./control-center.html'+(pool?'?pool='+encodeURIComponent(pool):'');let p=null;try{p=JSON.parse(localStorage.getItem('links-current-pool')||'null')}catch{}const routes={'NFL Pick’em':'nfl.html','College Pick’em':'college.html','Survivor':'survivor.html','Confidence':'confidence.html','Game 33':'game33.html','March Madness':'march-madness.html','Golf':'golf.html','NASCAR':'nascar.html','Fantasy':'fantasy.html','Custom':'custom.html'},gs=(p?.games||[p?.game]).filter(Boolean);document.getElementById('games').innerHTML=gs.length?gs.map(g=>'<a href="./'+(routes[g]||'control-center.html')+(pool?'?pool='+encodeURIComponent(pool):'')+'">'+String(g).replace(/[<>]/g,'')+'</a>').join(''):'<div class="empty">No active pool games found.</div>';</script></body></html>
