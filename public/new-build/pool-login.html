<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LINKS — Enter Your Locker Room</title><script src="./session-security.js"></script><link rel="icon" href="/links-small-logo.png"><link rel="stylesheet" href="./locker-login.css?v=1"><link rel="stylesheet" href="./links-stadium-theme.css?v=1"><script src="/new-build/site-navigation.js?v=1" defer></script></head><body class="locker-login"><header class="login-header"><a href="./index.html" aria-label="LINKS home"><img src="/links-small-logo.png" alt="LINKS"></a><a class="login-home" href="./index.html">← Back to home</a></header><main class="login-layout"><section class="login-welcome"><p class="login-eyebrow">YOUR TEAM IS WAITING</p><h1>Your pool. <br>Your people. <br><span>Your Locker Room.</span></h1><p>Find your pool, sign in, and take your place on the team.</p><div class="login-benefit">PLAYERS JOIN FREE</div></section><section class="card login-card" aria-labelledby="loginTitle"><div class="login-card-top"><span class="login-eyebrow">WELCOME TO LINKS</span><h2 id="loginTitle">Enter your Locker Room</h2><p>Start with your pool name or invite code.</p></div><div class="form"><div class="login-search"><label for="poolSearch">Pool name or code</label><input id="poolSearch" autocomplete="off" placeholder="e.g. Barnes Family"><button id="findPool" class="action primary">FIND MY POOL →</button></div><div id="matches"></div><div id="loginMsg" class="muted" role="status" aria-live="polite"></div></div><div class="login-card-foot">One team. All your pools.</div></section></main><footer class="login-footer">LINKS · PICKS. POOLS. PEOPLE.</footer><script>
const resetToken=new URLSearchParams(location.search).get('reset');if(resetToken){document.querySelector('main .card').innerHTML='<h2>RESET PASSWORD</h2><p>Choose your new LINKS password.</p><div class="form"><input id="newResetPass" type="password" autocomplete="new-password" placeholder="New password · 4+ characters"><input id="confirmResetPass" type="password" autocomplete="new-password" placeholder="Confirm new password"><button id="completeReset" class="action primary">SAVE NEW PASSWORD →</button><div id="resetMsg" class="muted"></div></div>';document.getElementById('completeReset').onclick=async()=>{const a=document.getElementById('newResetPass').value,b=document.getElementById('confirmResetPass').value,m=document.getElementById('resetMsg');if(a.length<4||a!==b){m.textContent='Passwords must match and be at least 4 characters.';return}const r=await fetch('./api/members',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'completeReset',token:resetToken,password:a})}),j=await r.json();if(!r.ok){m.textContent=j.error||'Password was not changed.';return}m.textContent='PASSWORD UPDATED · You can now return to Pool Login.';document.getElementById('completeReset').disabled=true}}
if(!resetToken){
const K='links-pools-v1',q=document.getElementById('poolSearch'),box=document.getElementById('matches'),msg=document.getElementById('loginMsg');function pools(){try{return JSON.parse(localStorage.getItem(K)||'[]')}catch{return[]}}function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}const gameRoutes={'NFL Pick’em':'nfl.html','College Pick’em':'college.html','Survivor':'survivor.html','Confidence':'confidence.html','Game 33':'game33.html','Squares':'squares.html','Props':'props.html','Playoffs':'playoff.html','March Madness':'march-madness.html','Golf':'golf.html','NASCAR':'nascar.html','Fantasy':'fantasy.html','Dynasty':'dynasty.html','Custom':'custom.html'};function poolDestination(p){if(new URLSearchParams(location.search).get('triviaHost')==='1')return './trivia-night.html?host=1';return './control-center.html?pool='+encodeURIComponent(p.id)};async function render(){const raw=q.value.trim(),v=raw.toLowerCase();if(!v){box.innerHTML='';return}let m=pools().filter(p=>String(p.name||'').toLowerCase().includes(v)||String(p.code||'').toLowerCase()===v).slice(0,10);try{const r=await fetch('./api/pools?search='+encodeURIComponent(raw),{cache:'no-store'}),j=await r.json();if(r.ok&&Array.isArray(j.pools)){const a=pools();for(const p of j.pools){const mi=m.findIndex(x=>String(x.id)===String(p.id)),ai=a.findIndex(x=>String(x.id)===String(p.id));if(mi<0)m.push(p);else m[mi]=p;if(ai<0)a.push(p);else a[ai]=p}localStorage.setItem(K,JSON.stringify(a));m=m.slice(0,10)}}catch{}box.innerHTML=m.map(p=>'<button class="action" style="display:flex;align-items:center;gap:12px;text-align:left" data-id="'+esc(p.id)+'"><span>'+esc(p.name)+' · '+esc(p.code)+'</span>'+(Number.isFinite(p.playerCount)?'<span style="margin-left:auto;white-space:nowrap;color:#edc466;font-size:12px">'+Number(p.playerCount)+' '+(Number(p.playerCount)===1?'player':'players')+'</span>':'')+'</button>').join('');box.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>open(b.dataset.id));msg.textContent=m.length?'':'No matching pool was found.'}async function open(id){let p=pools().find(x=>String(x.id)===String(id));if(!p)return;msg.textContent='Loading players…';let members=[];try{const qp=new URLSearchParams({pool:String(p.id||''),name:String(p.name||''),code:String(p.code||'')});const r=await fetch('./api/members?'+qp.toString(),{cache:'no-store'}),j=await r.json();if(r.ok&&Array.isArray(j.members)){members=j.members.filter(x=>(x.status||'active')==='active');if(j.resolvedPoolId&&String(j.resolvedPoolId)!==String(p.id)){p={...p,id:j.resolvedPoolId,name:j.poolName||p.name,code:j.poolCode||p.code};const a=pools().filter(x=>String(x.id)!==String(id)&&String(x.id)!==String(p.id));a.push(p);localStorage.setItem(K,JSON.stringify(a))}}else{msg.textContent=j.error||'Players could not be loaded.'}}catch{msg.textContent='Players could not be loaded.'}if(!members.length){box.innerHTML='<div class="card" style="min-height:0;margin-top:12px"><b>'+esc(p.name)+'</b><p class="muted">No active players are available yet.</p></div>';return}const remembered=localStorage.getItem('links-player-name')||'';box.innerHTML='<div class="card" style="min-height:0;margin-top:12px"><button type="button" class="login-back" id="backToPoolSearch">← Choose another pool</button><h3>'+esc(p.name)+'</h3><label for="poolPlayer">Choose your player</label><select id="poolPlayer" style="width:100%;padding:12px;border-radius:7px;border:1px solid #315168;background:#030b11;color:#fff">'+members.map(x=>'<option value="'+esc(x.playerId)+'" '+(String(x.displayName||'').toLowerCase()===remembered.toLowerCase()?'selected':'')+'>'+esc(x.displayName||x.email||'Player')+'</option>').join('')+'</select><label for="poolPassword">Password</label><input id="poolPassword" type="password" autocomplete="current-password" placeholder="Password"><label style="display:block"><input id="rememberPool" type="checkbox" checked style="width:auto"> Remember me on this device</label><small>Leave unchecked on shared computers. Temporary sign-in lasts in this tab for up to 12 hours.</small><button id="enterPool" class="action primary">ENTER LOCKER ROOM →</button></div>';if(members.some(x=>String(x.displayName||'').toLowerCase()===remembered.toLowerCase()))document.getElementById('poolPlayer').dataset.playerConfirmed='true';document.getElementById('backToPoolSearch').onclick=()=>{box.replaceChildren();msg.textContent='';q.focus()};msg.textContent='Select your name and enter your password.';document.getElementById('enterPool').onclick=async()=>{const btn=document.getElementById('enterPool'),player=document.getElementById('poolPlayer').value,password=document.getElementById('poolPassword').value,name=members.find(x=>String(x.playerId)===String(player))?.displayName||'Player';if(!password){msg.textContent='Enter your password.';return}btn.disabled=true;btn.textContent='SIGNING IN…';let r,j;try{r=await fetch('./api/members',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'login',pool:p.id,poolName:p.name,poolCode:p.code,player:members.find(x=>String(x.playerId)===String(player))?.loginName||player,password,remember:document.getElementById('rememberPool').checked})});j=await r.json()}catch{j={error:'Sign in is unavailable.'}}if(!r?.ok){msg.textContent=j?.error||'Password does not match.';btn.disabled=false;btn.textContent='ENTER LOCKER ROOM →';return}const linkedAccount=await window.LINKS_ACCOUNT_FOR_LOGIN(j.token);window.LINKS_REMEMBER.set(document.getElementById('rememberPool').checked);if(linkedAccount)localStorage.setItem('links-account-token',linkedAccount);try{const refreshed=await fetch('./api/pools?id='+encodeURIComponent(p.id),{cache:'no-store'}),fresh=await refreshed.json();if(refreshed.ok&&fresh.pool)p={...p,...fresh.pool};p.role=j.player?.role||'player';const cached=pools().filter(x=>String(x.id)!==String(p.id));cached.push(p);localStorage.setItem(K,JSON.stringify(cached))}catch{}localStorage.setItem('links-legacy-token',j.token||'');localStorage.setItem('links-token',j.token||'');localStorage.setItem('links-current-pool',JSON.stringify(p));localStorage.setItem('links-player-id',player);localStorage.setItem('links-player-name',j.player?.displayName||name);if(j.player?.role)localStorage.setItem('links-player-role',j.player.role);location.replace((await import('./links-account-client.mjs')).enabled?'./links-login.html?connect=1':poolDestination(p))}}q.addEventListener('input',render);document.getElementById('findPool').onclick=render;const params=new URLSearchParams(location.search),invite=params.get('invite'),code=params.get('code');if(code){q.value=code;render()}if(invite){(async()=>{msg.textContent='Opening your invitation…';try{const r=await fetch('./api/invites?token='+encodeURIComponent(invite),{cache:'no-store'}),j=await r.json();if(!r.ok||!j.invite){msg.textContent=j.error||'Invitation could not be opened.';return}const pending=j.invite.status==='pending';box.innerHTML='<div class="card" style="min-height:0;margin-top:12px"><b>'+esc(j.invite.name)+'</b><p class="muted">Invitation for '+esc(j.invite.email)+'</p>'+(pending?'<input id="joinName" placeholder="Your display name"><button id="acceptInvite" class="action primary">JOIN POOL →</button>':'<div class="empty">This invitation has already been used or is no longer active.</div>')+'</div>';msg.textContent=pending?'Invitation found.':'Ask the commissioner for a new invitation if you need access on this device.';if(!pending)return;document.getElementById('acceptInvite').onclick=async()=>{const b=document.getElementById('acceptInvite');b.disabled=true;b.textContent='JOINING…';const rr=await fetch('./api/join',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:invite,displayName:document.getElementById('joinName').value.trim()})}),jj=await rr.json();if(!rr.ok){msg.textContent=jj.error||'Could not join pool.';b.disabled=false;b.textContent='JOIN POOL →';return}localStorage.setItem('links-player-id',jj.player.id);localStorage.setItem('links-current-pool',JSON.stringify(jj.pool));let a=pools().filter(x=>x.id!==jj.pool.id);a.push(jj.pool);localStorage.setItem(K,JSON.stringify(a));location.href='./control-center.html?pool='+encodeURIComponent(jj.pool.id)}}catch{msg.textContent='Shared invitation service is unavailable.'}})()}
}
</script><script src="./login-submit.js"></script><script src="./login-ad.js"></script><script type="module">import {enabled} from "./links-account-client.mjs";const q=new URLSearchParams(location.search);if(enabled&&!q.has("invite")&&!q.has("code"))location.replace("./links-login.html");</script></body></html>
