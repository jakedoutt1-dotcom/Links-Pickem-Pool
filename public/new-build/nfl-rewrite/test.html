<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LINKS NFL Module Test</title><style>body{margin:0;background:#061019;color:#fff;font-family:Arial}.wrap{max-width:900px;margin:auto;padding:20px}button,select{padding:10px;background:#102331;color:#fff;border:1px solid #456}table{width:100%;border-collapse:collapse;margin-top:15px}td,th{padding:8px;border-bottom:1px solid #234;text-align:left}.win{color:#5f8}.loss{color:#f77}.pending{color:#fc6}.unknown{color:#f55}</style><script src="/new-build/site-navigation.js?v=1" defer></script></head><body><div class="wrap"><h1>NFL Pick'em Module Verification</h1><p>Shared NFL Core · selected-week schedule/results · player picks · shared navigation · compact print module.</p><select id="week"><option>1</option><option>2</option><option selected>3</option></select> <button id="go">LOAD</button><div id="out">Loading modules…</div></div><script src="./core.js?v=770"></script><script src="./navigation.js?v=770"></script><script src="./print-card.js?v=770"></script><script>async function go(){const w=Number(document.getElementById('week').value),u=new URL(location.href);u.searchParams.set('week',w);history.replaceState({},'',u);const out=document.getElementById('out');out.textContent='Loading…';try{const m=await LINKS_NFL_REWRITE.model(w);out.innerHTML='<h2>'+m.player+' · Week '+w+'</h2><p>'+m.schedule.length+' scheduled games · '+m.schedule.filter(x=>x.final).length+' final</p><button id="printTest">PRINT MY PICKS</button><table><tr><th>#</th><th>Pick</th><th>Matchup</th><th>Result</th></tr>'+m.graded.map((x,i)=>'<tr><td>G'+(i+1)+'</td><td>'+x.pick+'</td><td>'+(x.game?x.game.away+' @ '+x.game.home:'NO MATCH')+'</td><td class="'+x.status+'">'+x.status.toUpperCase()+(x.game?.winner?' · '+x.game.winner:'')+'</td></tr>').join('')+'</table>';document.getElementById('printTest').onclick=()=>LINKS_NFL_PRINT.open()}catch(e){out.textContent=e.message}}document.getElementById('go').onclick=go;go()</script></body></html>
