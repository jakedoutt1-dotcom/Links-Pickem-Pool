<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LINKS — NFL Pick Tools</title><link rel="stylesheet" href="./shell.css?v=719"><style>.wrap{padding:18px 5%;max-width:1100px;margin:auto}.weekbar{display:grid;grid-template-columns:auto 1fr auto;gap:8px;margin:12px 0}.weekbar button,.weekbar select,.opp-select{min-height:46px;border:1px solid #315168;border-radius:8px;background:#07131d;color:#fff;padding:8px;font-weight:900}.note{color:#aebcc6}.gtm-summary{display:flex;justify-content:space-between;gap:8px;background:#182530;border-radius:9px;padding:10px;margin:10px 0}.gtm-player-heads{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:10px 0 6px}.gtm-player-head{padding:9px 10px;text-align:center;border-bottom:2px solid #315168;color:#e8bb5b;font-weight:1000;font-size:15px}.gtm-game{border:1px solid #34404d;border-radius:12px;background:#111923;padding:10px;margin:8px 0}.gtm-sides{display:grid;grid-template-columns:1fr 1fr;gap:7px}.gtm-side{display:flex;align-items:center;gap:8px;background:#192731;border-radius:9px;padding:9px}.gtm-side img{width:38px;height:38px;object-fit:contain}.gtm-you{border:1px solid #ff6a1a}.proj-game{border:1px solid #34404d;border-radius:12px;background:#111923;padding:12px;margin:9px 0}.proj-head{display:flex;justify-content:space-between;color:#91a8b6;font-size:10px}.proj-teams{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.proj-team{display:flex;align-items:center;gap:9px;padding:10px;border-radius:9px;background:#192731}.proj-team.fav{border:1px solid #e8bb5b}.proj-team img{width:42px;height:42px;object-fit:contain}.proj-pct{margin-left:auto;font-size:20px;font-weight:1000;color:#e8bb5b}.espn-tag{font-size:9px;color:#8da7b7;letter-spacing:.6px}</style><script src="./build.js?v=719"></script></head><body><header class="top"><div class="logo">⛓ LINKS</div></header><nav class="nflnav" id="nflnav"></nav><main class="wrap"><section class="c const q=new URLSearchParams(location.search),po=(()=>{try{return JSON.parse(localStorage.getItem('links-current-pool')||'null')||{}}catch{return{}}})(),pool=q.get('pool')||po.id||'',role=localStorage.getItem('links-player-role')||'',playerName=localStorage.getItem('links-player-name')||'',tool=q.get('tool')==='projected'?'projected':'matter',labels={19:'Wild Card',20:'Divisional',21:'Conference Championships',22:'Super Bowl'},weekEl=document.getElementById('week'),statusEl=document.getElementById('status'),bodyEl=document.getElementById('body');let selected=Number(q.get('week')||0)||1;title.textContent=tool==='projected'?'PROJECTED':'PICKS THAT MATTER';for(let w=1;w<=22;w++)weekEl.add(new Option(w<=18?'Week '+w:labels[w],w));weekEl.value=selected;const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function go(w){selected=Math.max(1,Math.min(22,Number(w)||1));weekEl.value=selected;const u=new URL(location.href);u.searchParams.set('week',selected);history.replaceState(null,'',u);load()}prev.onclick=()=>go(selected-1);next.onclick=()=>go(selected+1);weekEl.onchange=()=>go(weekEl.value);function logo(t){t=String(t||'').toLowerCase().replace('was','wsh');return t?'https://a.espncdn.com/i/teamlogos/nfl/500/'+t+'.png':''}function drawMatter(j){const players=j.players||[],me=players.find(p=>String(p.player).toLowerCase()===String(playerName).toLowerCase())||players[0],others=players.filter(p=>p!==me);if(!me||!others.length){bodyEl.innerHTML='<div class="proof">Picks That Matter appears when at least two players have saved picks.</div>';return}bodyEl.innerHTML='<div class="note">Games where your pick differs from another player.</div><select id="opp" class="opp-select" style="width:100%;margin:10px 0">'+others.map((p,i)=>'<option value="'+i+'">'+esc(p.player)+'</option>').join('')+'</select><div id="rows"></div>';const opp=document.getElementById('opp'),rows=document.getElementById('rows');function draw(){const async function drawProjected(){statusEl.textContent='Loading ESPN projections for Week '+selected+'…';try{const r=await fetch('https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?seasontype='+(selected>18?3:2)+'&week='+selected+'&limit=100',{cache:'no-store'}),j=await r.json(),events=j.events||[];const rows=await Promise.all(events.map(async e=>{const c=e.competitions?.[0],teams=c?.competitors||[],away=teams.find(x=>x.homeAway==='away'),home=teams.find(x=>x.homeAway==='home');let hp=null,ap=null;try{const pr=await fetch('https://sports.core.api.espn.com/v2/sports/football/leagues/nfl/events/'+e.id+'/competitions/'+e.id+'/predictor',{cache:'no-store'}),pj=await pr.json();hp=Number(pj.homeTeam?.gameProjection??pj.homeTeam?.teamChanceLoss??NaN);ap=Number(pj.awayTeam?.gameProjection??pj.awayTeam?.teamChanceLoss??NaN);if(Number.isFinite(hp)&&hp<=1)hp*=100;if(Number.isFinite(ap)&&ap<=1)ap*=100;if(!Number.isFinite(ap)&&Number.isFinite(hp))ap=100-hp;if(!Number.isFinite(hp)&&Number.isFinite(ap))hp=100-ap}catch{}return{e,away,home,ap,hp}}));statusEl.innerHTML='<b>WEEK '+selected+' · ESPN MATCHUP PROJECTIONS</b><div class="espn-tag">Win probability shown when ESPN predictor data is available.</div>';bodyEl.innerHTML=rows.map((x,i)=>{const a=x.away,h=x.home,ap=Number.isFinite(x.ap)?x.ap:null,hp=Number.isFinite(x.hp)?x.hp:null,fav=ap!=null&&hp!=null?(ap>hp?'a':'h'):'';return '<div class="proj-game"><div class="proj-head"><b>GAME '+(i+1)+'</b><span>'+esc(x.e.status?.type?.shortDetail||'')+'</span></div><div class="proj-teams"><div class="proj-team '+(fav==='a'?'fav':'')+'"><img src="'+esc(a?.team?.logo||logo(a?.team?.abbreviation))+'"><div><b>'+esc(a?.team?.abbreviation||'AWAY')+'</b><div class="note">'+esc(a?.records?.[0]?.summary||'')+'</div></div><span class="proj-pct">'+(ap==null?'—':ap.toFixed(1)+'%')+'</span></div><div class="proj-team '+(fav==='h'?'fav':'')+'"><img src="'+esc(h?.team?.logo||logo(h?.team?.abbreviation))+'"><div><b>'+esc(h?.team?.abbreviation||'HOME')+'</b><div class="note">'+esc(h?.records?.[0]?.summary||'')+'</div></div><span class="proj-pct">'+(hp==null?'—':hp.toFixed(1)+'%')+'</span></div></div></div>'}).join('')||'<div class="proof">No ESPN matchups found for this week.</div>'}catch(e){statusEl.textContent='ESPN projections unavailable';bodyEl.innerHTML='<div class="proof">Projection feed could not be loaded.</div>'}}
async function load(){if(tool==='projected'){drawProjected();return}statusEl.textContent='Loading Week '+selected+'…';bodyEl.innerHTML='';try{const r=await fetch('./api/compare-picks?pool='+encodeURIComponent(pool)+'&week='+selected+'&role='+encodeURIComponent(role)+'&_='+Date.now(),{cache:'no-store'}),j=await r.json();if(!r.ok)throw Error(j.error||'Pool picks unavailable');if(!j.locked&&!/admin|commissioner/i.test(role)){statusEl.innerHTML='<b>PICKS ARE STILL PRIVATE</b>';return}statusEl.innerHTML='<b>WEEK '+selected+'</b> · SAVED PICKS';drawMatter(j)}catch(e){statusEl.textContent=e.message||'Data unavailable'}}load();
