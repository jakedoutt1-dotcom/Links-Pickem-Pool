<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LINKS — NFL Pick Tools</title><link rel="stylesheet" href="./shell.css?v=662"><style>.wrap{padding:18px 5%;max-width:1100px;margin:auto}.nflnav{display:flex;gap:7px;overflow-x:auto;padding:10px 5%;background:#07131d;border-bottom:1px solid #29485e;position:sticky;top:0;z-index:50}.nflnav a{flex:0 0 auto;min-height:42px;display:flex;align-items:center;padding:0 12px;border:1px solid #315168;border-radius:7px;background:#0a1a25;color:#fff;text-decoration:none;font-size:11px;font-weight:900}.nflnav a.active{border-color:#e8bb5b;color:#e8bb5b}.weekbar{display:grid;grid-template-columns:auto 1fr auto;gap:8px;margin:12px 0}.weekbar button,.weekbar select{min-height:46px;border:1px solid #315168;border-radius:8px;background:#07131d;color:#fff;padding:8px;font-weight:900;text-align:center}.diff{padding:12px;margin:8px 0;border:1px solid #29485e;border-radius:8px;background:#07131d}.signed{padding:8px 5%;color:#e8bb5b;font-weight:900;text-align:right;background:#07131d}.note{color:#aebcc6}.rank{display:flex;justify-content:space-between;gap:10px;align-items:center}.rank strong{color:#55ef8d}</style></head><body><header class="top"><div class="logo">⛓ LINKS</div><button class="back" id="signOut">SIGN OUT</button></header><div id="signed" class="signed"></div><nav class="nflnav" id="nav"></nav><main class="wrap"><section class="card"><div class="eyebrow">NFL PICK’EM</div><h1 id="title">PROJECTED</h1><div class="weekbar"><button id="prev">←</button><select id="week"></select><button id="next">→</button></div><div id="status" class="proof">Loading pool picks…</div><div id="body"></div></section></main><footer class="foot">LINKS NEW BUILD · v662</footer><script>const q=new URLSearchParams(location.search),pool=q.get('pool')||'',role=localStorage.getItem('links-player-role')||'',name=localStorage.getItem('links-player-name')||'',tool=q.get('tool')==='matter'?'matter':'projected',esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));let selected=Number(q.get('week')||0)||0,current=0;signed.textContent=name?'SIGNED IN: '+name:'';title.textContent=tool==='matter'?'PICKS THAT MATTER':'PROJECTED';for(let w=1;w<=22;w++)week.add(new Option(w<=18?'Week '+w:({19:'Wild Card',20:'Divisional',21:'Conference Championships',22:'Super Bowl'}[w]),w));function links(){const w=selected||current||1,u=(f,x='')=>'./'+f+'?pool='+encodeURIComponent(pool)+'&week='+w+x;nav.innerHTML='<a href="'+u('nfl.html')+'">PICKS</a><a href="'+u('nfl-scores.html')+'">LIVE SCORES</a><a href="'+u('compare-picks.html')+'">COMPARE PICKS</a><a class="'+(tool==='matter'?'active':'')+'" href="'+u('pick-tools.html','&sport=nfl&tool=matter')+'">PICKS THAT MATTER</a><a class="'+(tool==='projected'?'active':'')+'" href="'+u('pick-tools.html','&sport=nfl&tool=projected')+'">PROJECTED</a><a href="'+u('nfl-standings.html')+'">STANDINGS</a><a href="'+u('nfl.html','&pickcard=1')+'">PRINT MY PICKS</a>'+( /admin|commissioner/i.test(role)?'<a href="./commissioner.html?pool='+encodeURIComponent(pool)+'&game='+encodeURIComponent('NFL Pick’em')+'">ADMIN</a>':'')}function go(w){selected=Math.max(1,Math.min(22,Number(w)||1));week.value=selected;links();const u=new URL(location.href);u.searchParams.set('week',selected);history.replaceState(null,'',u);load()}prev.onclick=()=>go(selected-1);next.onclick=()=>go(selected+1);week.onchange=()=>go(week.value);signOut.onclick=()=>{['links-current-pool','links-player-id','links-player-name','links-player-role','links-session-v1'].forEach(k=>localStorage.removeItem(k));location.replace('./index.html')};async function load(){status.textContent='Loading Week '+selected+'…';body.innerHTML='';try{const [cr,sr]=await Promise.all([fetch('./api/compare-picks?pool='+encodeURIComponent(pool)+'&week='+selected+'&role='+encodeURIComponent(role)+'&_='+Date.now(),{cache:'no-store'}),fetch('https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?limit=100&week='+selected,{cache:'no-store'})]),cj=await cr.json(),sj=await sr.json();if(!cr.ok)throw Error(cj.error||'Pool picks unavailable');if(!cj.locked&&!/admin|commissioner/i.test(role)){status.innerHTML='<b>PICKS ARE STILL PRIVATE</b><div class="note">These tools open after the weekly picks lock.</div>';return}const players=cj.players||[],events=sj.events||[],results=cj.results||{};status.innerHTML='<b>WEEK '+selected+'</b> · ESPN game state and odds';if(tool==='matter'){const max=Math.max(...players.map(p=>Object.keys(p.picks||{}).length),0),rows=[];for(let i=0;i<max;i++){const vals=players.map(p=>p.picks?.[i]).filter(Boolean),uniq=[...new Set(vals)];if(uniq.length>1)rows.push('<div class="diff"><b>GAME '+(i+1)+'</b><br>'+players.map(p=>esc(p.player)+': <b>'+esc(p.picks?.[i]||'—')+'</b>').join(' · ')+'</div>')}body.innerHTML=rows.join('')||'<div class="proof">No split picks for this week.</div>';return}const projectedWinner={};events.forEach((e,i)=>{const c=e.competitions?.[0],teams=c?.competitors||[],state=e.status?.type?.state;let winner='';if(state==='post'||state==='in'){winner=(teams.find(x=>x.winner)||[...teams].sort((a,b)=>Number(b.score||0)-Number(a.score||0))[0])?.team?.abbreviation||''}else{winner=String(c?.odds?.[0]?.details||'').split(' ')[0]}projectedWinner[i]=String(winner||'').toUpperCase()});const totals=players.map(p=>{let n=0;Object.entries(p.picks||{}).forEach(([i,pick])=>{const actual=results[i]??results[String(i)],want=String(actual||projectedWinner[i]||'').toUpperCase();if(want&&String(pick||'').toUpperCase()===want)n++});return{player:p.player,n}}).sort((a,b)=>b.n-a.n);body.innerHTML='<div class="note" style="margin:10px 0">Projected uses this pool’s real saved picks plus ESPN live/final results and ESPN pregame favorite/odds.</div>'+totals.map((x,i)=>'<div class="diff rank"><b>'+(i+1)+' · '+esc(x.player)+'</b><strong>'+x.n+' projected correct</strong></div>').join('')}catch(e){status.textContent=e.message||'Data unavailable'}}async function boot(){if(!selected){try{const r=await fetch('https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?limit=1',{cache:'no-store'}),j=await r.json();current=Number(j.week?.number||1)}catch{current=1}selected=current}week.value=selected;links();load()}boot();</script></body></html>
