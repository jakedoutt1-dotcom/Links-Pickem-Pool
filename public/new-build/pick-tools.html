<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LINKS — NFL Pick Tools</title><link rel="stylesheet" href="./shell.css?v=675"><style>.wrap{padding:18px 5%;max-width:1100px;margin:auto}.signed{padding:8px 5%;color:#e8bb5b;font-weight:900;text-align:right;background:#07131d}.weekbar{display:grid;grid-template-columns:auto 1fr auto;gap:8px;margin:12px 0}.weekbar button,.weekbar select,.opp-select{min-height:46px;border:1px solid #315168;border-radius:8px;background:#07131d;color:#fff;padding:8px;font-weight:900}.note{color:#aebcc6}.gtm-summary{display:flex;justify-content:space-between;gap:8px;background:#182530;border-radius:9px;padding:10px;margin:10px 0}.gtm-game{border:1px solid #34404d;border-radius:12px;background:#111923;padding:10px;margin:8px 0}.gtm-head{display:flex;justify-content:space-between;font-size:11px;color:#aebcc6;margin-bottom:7px}.gtm-sides{display:grid;grid-template-columns:1fr 1fr;gap:7px}.gtm-side{display:flex;align-items:center;gap:8px;background:#192731;border-radius:9px;padding:9px;font-size:12px}.gtm-side img{width:38px;height:38px;object-fit:contain;flex:0 0 38px}.gtm-side b{display:block;font-size:14px}.gtm-you{border:1px solid #ff6a1a}.proj-table{width:100%;border-collapse:collapse;margin-top:12px}.proj-table th,.proj-table td{padding:10px 7px;border-bottom:1px solid #29485e;text-align:left}.proj-meter{height:8px;background:#17232c;border-radius:20px;overflow:hidden;margin-top:5px}.proj-meter span{display:block;height:100%;background:linear-gradient(90deg,#2a9d62,#e8bb5b)}.source{margin:10px 0;padding:10px;border:1px solid #315168;border-radius:9px;background:#081925}.source b{color:#55ef8d}</style><script src="./build.js?v=675"></script></head><body><header class="top"><div class="logo">⛓ LINKS</div><button class="back" id="signOut">SIGN OUT</button></header><div id="signed" class="signed"></div><nav class="nflnav" id="nflnav"></nav><main class="wrap"><section class="card"><div class="eyebrow">NFL PICK’EM</div><h1 id="title"></h1><div class="weekbar"><button id="prev">←</button><select id="week"></select><button id="next">→</button></div><div id="status" class="proof">Loading…</div><div id="body"></div></section></main><footer class="foot">LINKS NEW BUILD · v675</footer><script src="./shell.js?v=675"></script><script>
const q=new URLSearchParams(location.search),pool=q.get('pool')||'',role=localStorage.getItem('links-player-role')||'',playerName=localStorage.getItem('links-player-name')||localStorage.getItem('links-player-id')||'',tool=q.get('tool')==='matter'?'matter':'projected',esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let selected=0,current=0;signed.textContent=playerName?'SIGNED IN: '+playerName:'';title.textContent=tool==='matter'?'PICKS THAT MATTER':'PROJECTED STANDINGS';const labels={19:'Wild Card',20:'Divisional',21:'Conference Championships',22:'Super Bowl'};for(let w=1;w<=22;w++)week.add(new Option(w<=18?'Week '+w:labels[w],w));
const ALIAS={WAS:'WSH',WSH:'WSH',JAC:'JAX',JAX:'JAX',LA:'LAR',LAR:'LAR',LV:'LV',OAK:'LV',SD:'LAC',LAC:'LAC'};function abbr(t){t=String(t||'').trim().toUpperCase();return ALIAS[t]||t}function logo(t){const a=abbr(t);return a?'https://a.espncdn.com/i/teamlogos/nfl/500/'+a.toLowerCase()+'.png':''}function go(w){selected=Math.max(1,Math.min(22,Number(w)||current||1));week.value=String(selected);const u=new URL(location.href);u.searchParams.set('week',selected);history.replaceState(null,'',u);load()}prev.onclick=()=>go(selected-1);next.onclick=()=>go(selected+1);week.onchange=()=>go(week.value);signOut.onclick=()=>{['links-current-pool','links-player-id','links-player-name','links-player-role','links-session-v1'].forEach(k=>localStorage.removeItem(k));location.replace('./index.html')};
function cell(team,name,you){const a=abbr(team);return '<div class="gtm-side '+(you?'gtm-you':'')+'><img src="'+logo(a)+'" alt="'+esc(a)+' logo" onerror="this.style.visibility=\'hidden\'"><div><small>'+esc(name)+'</small><b>'+esc(a)+'</b></div></div>'}
function drawMatter(j){const players=j.players||[],me=players.find(p=>String(p.player||'').toLowerCase()===String(playerName).toLowerCase())||players[0],others=players.filter(p=>p!==me);if(!me||!others.length){body.innerHTML='<div class="proof">Picks That Matter appears when at least two players have saved picks.</div>';return}body.innerHTML='<div class="note">Games where your pick differs from another player.</div><select id="opp" class="opp-select" style="width:100%;margin:10px 0">'+others.map((p,i)=>'<option value="'+i+'">'+esc(p.player)+'</option>').join('')+'</select><div id="matterRows"></div>';const draw=()=>{const o=others[Number(opp.value)||0];let same=0,diff=0,rows=[];const max=Math.max(Object.keys(me.picks||{}).length,Object.keys(o.picks||{}).length,(j.games||[]).length);for(let i=0;i<max;i++){const a=me.picks?.[i]||'—',b=o.picks?.[i]||'—';if(a===b){if(a!=='—')same++;continue}if(a==='—'&&b==='—')continue;diff++;rows.push('<div class="gtm-game"><div class="gtm-head"><b>GAME '+(i+1)+'</b><span>SWING GAME</span></div><div class="gtm-sides">'+cell(a,me.player,true)+cell(b,o.player,false)+'</div></div>')}matterRows.innerHTML='<div class="gtm-summary"><b>'+esc(me.player)+' vs '+esc(o.player)+'</b><span><b>'+diff+'</b> different · '+same+' same</span></div>'+rows.join('')};opp.onchange=draw;draw()}
async function probabilities(games){const out={};await Promise.all(games.map(async(g,i)=>{if(!g.eventId)return;try{const r=await fetch('https://site.api.espn.com/apis/site/v2/sports/football/nfl/summary?event='+encodeURIComponent(g.eventId),{cache:'no-store'}),j=await r.json(),wp=j.winprobability||[];if(wp.length){const last=wp[wp.length-1],home=Number(last.homeWinPercentage);if(Number.isFinite(home))out[i]={home:home,away:1-home}}}catch{}}));return out}
async function drawProjected(j){const games=j.games||[],players=j.players||[];if(!games.length||!players.length){body.innerHTML='<div class="proof">Waiting for saved picks for this week.</div>';return}body.innerHTML='<div class="proof">Calculating ESPN win probabilities…</div>';const probs=await probabilities(games),results=j.results||{};const rows=players.map((p,order)=>{let correct=0,expected=0,picked=0,pending=0;for(let i=0;i<games.length;i++){const pick=abbr(p.picks?.[i]);if(!pick)continue;picked++;const winner=abbr(results[i]??results[String(i)]??'');if(winner){if(winner===pick)correct++;continue}pending++;const g=games[i],pr=probs[i];let chance=.5;if(pr){if(pick===abbr(g.home))chance=pr.home;else if(pick===abbr(g.away))chance=pr.away}expected+=chance}return{player:p.player,order,picked,pending,correct,projected:correct+expected}}).sort((a,b)=>b.projected-a.projected||b.correct-a.correct||a.order-b.order);body.innerHTML='<div class="source"><b>● ESPN WIN PROBABILITY PROJECTION</b><div class="note">Uses the current ESPN probability for each unfinished matchup and actual winners for completed games.</div></div><div style="overflow-x:auto"><table class="proj-table"><thead><tr><th>#</th><th>Player</th><th>Projected</th><th>Correct</th><th>Chance</th></tr></thead><tbody>'+rows.map((r,i)=>{const pct=r.picked?100*r.projected/r.picked:0;return '<tr><td>'+(i+1)+'</td><td><b>'+esc(r.player)+'</b></td><td><b>'+r.projected.toFixed(2)+'</b></td><td>'+r.correct+'</td><td><b>'+pct.toFixed(0)+'%</b><div class="proj-meter"><span style="width:'+Math.min(100,pct)+'%"></span></div></td></tr>'}).join('')+'</tbody></table></div>'}
async function load(){status.textContent='Loading '+(selected<=18?'Week '+selected:labels[selected])+'…';body.innerHTML='';try{const r=await fetch('./api/compare-picks?pool='+encodeURIComponent(pool)+'&week='+selected+'&role='+encodeURIComponent(role)+'&_='+Date.now(),{cache:'no-store'}),j=await r.json();if(!r.ok)throw Error(j.error||'Pool picks unavailable');if(!j.locked&&!/admin|commissioner/i.test(role)){status.innerHTML='<b>PICKS ARE STILL PRIVATE</b><div class="note">These tools open after picks lock.</div>';return}status.innerHTML='<b>'+(selected<=18?'WEEK '+selected:labels[selected].toUpperCase())+'</b> · POOL PICKS';if(tool==='matter')drawMatter(j);else await drawProjected(j)}catch(e){status.textContent=e.message||'Data unavailable'}}
async function boot(){try{const r=await fetch('https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?limit=100',{cache:'no-store'}),j=await r.json();current=Number(j.week?.number||1)||1}catch{current=1}selected=current;week.value=String(selected);const u=new URL(location.href);u.searchParams.set('week',selected);history.replaceState(null,'',u);load()}boot();
</script></body></html>
