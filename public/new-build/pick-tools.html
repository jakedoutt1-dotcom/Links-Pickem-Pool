<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LINKS — NFL Pick Tools</title><link rel="stylesheet" href="./shell.css?v=722"><style>.wrap{padding:18px 5%;max-width:1100px;margin:auto}.weekbar{display:grid;grid-template-columns:auto 1fr auto;gap:8px;margin:12px 0}.weekbar button,.weekbar select,.opp-select{min-height:46px;border:1px solid #315168;border-radius:8px;background:#07131d;color:#fff;padding:8px;font-weight:900}.note{color:#aebcc6}.gtm-summary{display:flex;justify-content:space-between;gap:8px;background:#182530;border-radius:9px;padding:10px;margin:10px 0}.gtm-player-heads{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:10px 0 6px}.gtm-player-head{padding:9px 10px;text-align:center;border-bottom:2px solid #315168;color:#e8bb5b;font-weight:1000;font-size:15px}.gtm-game,.proj-game{border:1px solid #34404d;border-radius:12px;background:#111923;padding:10px;margin:8px 0}.gtm-sides{display:grid;grid-template-columns:1fr 1fr;gap:7px}.gtm-side{display:flex;align-items:center;gap:8px;background:#192731;border-radius:9px;padding:9px}.gtm-side img{width:38px;height:38px;object-fit:contain}.gtm-you{border:1px solid #ff6a1a}.proj-overall{border:1px solid #e8bb5b;border-radius:12px;padding:14px;margin:12px 0;background:rgba(232,187,91,.07);text-align:center}.proj-overall .big{font-size:34px;font-weight:1000;color:#e8bb5b}.proj-rank{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:12px 10px;border-bottom:1px solid #29485e}.proj-rank:first-child{border-top:1px solid #29485e}.proj-rank.me{background:rgba(232,187,91,.08);border-radius:8px}.proj-rank .rank{font-weight:1000;color:#91a8b6}.proj-rank .name{font-weight:1000}.proj-rank .pct{font-size:20px;font-weight:1000;color:#e8bb5b}.proj-list-title{margin:16px 0 6px;color:#e8bb5b;font-size:11px;font-weight:1000;letter-spacing:1.5px}.proj-pick{display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:10px;background:#192731;border-radius:9px;padding:11px}.proj-pick img{width:48px;height:48px;object-fit:contain}.proj-pct{font-size:22px;font-weight:1000;color:#e8bb5b}.proj-pct.won{color:#55ef8d}.proj-pct.lost{color:#ff737c}.proj-head{display:flex;justify-content:space-between;color:#91a8b6;font-size:10px;margin-bottom:7px}.espn-tag{font-size:9px;color:#8da7b7;letter-spacing:.6px}</style><script src="./build.js?v=722"></script></head><body><header class="top"><div class="logo">⛓ LINKS</div></header><nav class="nflnav" id="nflnav"></nav><main class="wrap"><section class="card"><div class="eyebrow">NFL PICK’EM</div><h1 id="title">PICKS THAT MATTER</h1><div class="weekbar"><button id="prev">←</button><select id="week"></select><button id="next">→</button></div><div id="status" class="proof">Loading…</div><div id="body"></div></section></main><footer class="foot">LINKS NEW BUILD · v722</footer><script src="./shell.js?v=722"></script><script>
const q=new URLSearchParams(location.search),po=(()=>{try{return JSON.parse(localStorage.getItem('links-current-pool')||'null')||{}}catch{return{}}})(),pool=q.get('pool')||po.id||'',role=localStorage.getItem('links-player-role')||'',playerName=localStorage.getItem('links-player-name')||'',tool=q.get('tool')==='projected'?'projected':'matter',labels={19:'Wild Card',20:'Divisional',21:'Conference Championships',22:'Super Bowl'},weekEl=document.getElementById('week'),statusEl=document.getElementById('status'),bodyEl=document.getElementById('body');let selected=Number(q.get('week')||0)||1;title.textContent=tool==='projected'?'PROJECTED':'PICKS THAT MATTER';for(let w=1;w<=22;w++)weekEl.add(new Option(w<=18?'Week '+w:labels[w],w));weekEl.value=selected;const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function go(w){selected=Math.max(1,Math.min(22,Number(w)||1));weekEl.value=selected;const u=new URL(location.href);u.searchParams.set('week',selected);history.replaceState(null,'',u);load()}prev.onclick=()=>go(selected-1);next.onclick=()=>go(selected+1);weekEl.onchange=()=>go(weekEl.value);function logo(t){t=String(t||'').toLowerCase().replace('was','wsh');return t?'https://a.espncdn.com/i/teamlogos/nfl/500/'+t+'.png':''}function drawMatter(j){const players=j.players||[],me=players.find(p=>String(p.player).toLowerCase()===String(playerName).toLowerCase())||players[0],others=players.filter(p=>p!==me);if(!me||!others.length){bodyEl.innerHTML='<div class="proof">Picks That Matter appears when at least two players have saved picks.</div>';return}bodyEl.innerHTML='<div class="note">Games where your pick differs from another player.</div><select id="opp" class="opp-select" style="width:100%;margin:10px 0">'+others.map((p,i)=>'<option value="'+i+'">'+esc(p.player)+'</option>').join('')+'</select><div id="rows"></div>';const opp=document.getElementById('opp'),rows=document.getElementById('rows');function draw(){const o=others[+opp.value||0];let same=0,diff=0,out=[];const max=Math.max(Object.keys(me.picks||{}).length,Object.keys(o.picks||{}).length,(j.games||[]).length);for(let i=0;i<max;i++){const a=me.picks?.[i]||'—',b=o.picks?.[i]||'—';if(a===b){if(a!=='—')same++;continue}if(a==='—'&&b==='—')continue;diff++;out.push('<div class="gtm-game"><b>GAME '+(i+1)+'</b><div class="gtm-sides"><div class="gtm-side gtm-you">'+(a!=='—'?'<img src="'+logo(a)+'">':'')+'<b>'+esc(a)+'</b></div><div class="gtm-side">'+(b!=='—'?'<img src="'+logo(b)+'">':'')+'<b>'+esc(b)+'</b></div></div></div>')}rows.innerHTML='<div class="gtm-summary"><b>'+esc(me.player)+' vs '+esc(o.player)+'</b><span>'+diff+' different · '+same+' same</span></div><div class="gtm-player-heads"><div class="gtm-player-head">'+esc(me.player)+'</div><div class="gtm-player-head">'+esc(o.player)+'</div></div>'+out.join('')}opp.onchange=draw;draw()}
async function drawProjected(){statusEl.textContent='Loading pool picks and ESPN projections…';bodyEl.innerHTML='';try{const [pr,sr]=await Promise.all([fetch('./api/compare-picks?pool='+encodeURIComponent(pool)+'&week='+selected+'&role='+encodeURIComponent(role)+'&_='+Date.now(),{cache:'no-store'}),fetch('https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?seasontype='+(selected>18?3:2)+'&week='+selected+'&limit=100',{cache:'no-store'})]),pj=await pr.json(),sj=await sr.json();if(!pr.ok)throw Error(pj.error||'Saved picks unavailable');const players=pj.players||[],events=sj.events||[];if(!players.length){statusEl.textContent='No saved picks found';return}const probs=[];for(let i=0;i<events.length;i++){const e=events[i],cmp=e.competitions?.[0],teams=cmp?.competitors||[],away=teams.find(x=>x.homeAway==='away'),home=teams.find(x=>x.homeAway==='home'),final=!!e.status?.type?.completed;let hp=null,ap=null,winner='';if(final){winner=String(teams.find(x=>x.winner)?.team?.abbreviation||'').toUpperCase()}else{try{const rr=await fetch('https://sports.core.api.espn.com/v2/sports/football/leagues/nfl/events/'+e.id+'/competitions/'+e.id+'/predictor',{cache:'no-store'}),x=await rr.json();hp=Number(x.homeTeam?.gameProjection);ap=Number(x.awayTeam?.gameProjection);if(Number.isFinite(hp)&&hp<=1)hp*=100;if(Number.isFinite(ap)&&ap<=1)ap*=100;if(!Number.isFinite(ap)&&Number.isFinite(hp))ap=100-hp;if(!Number.isFinite(hp)&&Number.isFinite(ap))hp=100-ap;if(!Number.isFinite(hp))hp=null;if(!Number.isFinite(ap))ap=null}catch{hp=null;ap=null}}probs.push({e,teams,away,home,final,winner,hp,ap})}function projectPlayer(p){let total=0,count=0;const detail=[];for(let i=0;i<probs.length;i++){const g=probs[i],pick=String(p.picks?.[i]??p.picks?.[String(i)]??'').toUpperCase();if(!pick)continue;const ha=String(g.home?.team?.abbreviation||'').toUpperCase(),aa=String(g.away?.team?.abbreviation||'').toUpperCase();let pct=null,state='';if(g.final){pct=pick===g.winner?100:0;state=pct===100?'won':'lost'}else if(pick===ha&&Number.isFinite(g.hp))pct=g.hp;else if(pick===aa&&Number.isFinite(g.ap))pct=g.ap;if(Number.isFinite(pct)){total+=pct;count++}detail.push({i,g,pick,pct,state,pickedTeam:g.teams.find(x=>String(x.team?.abbreviation||'').toUpperCase()===pick)})}return{player:p.player,pct:count?total/count:null,count,detail}}const ranked=players.map(projectPlayer).sort((a,b)=>{const ap=Number.isFinite(a.pct)?a.pct:-1,bp=Number.isFinite(b.pct)?b.pct:-1;return bp-ap||String(a.player||'').localeCompare(String(b.player||''))});const me=ranked.find(x=>String(x.player).toLowerCase()===String(playerName).toLowerCase())||ranked[0];statusEl.innerHTML='<b>WEEK '+selected+' · PROJECTED STANDINGS</b><div class="espn-tag">Finished games use actual results. Unfinished games use ESPN win probability for each player\'s saved pick.</div>';const list='<div class="proj-list-title">PROJECTED WIN PERCENTAGE</div>'+ranked.map((x,i)=>'<div class="proj-rank '+(String(x.player).toLowerCase()===String(playerName).toLowerCase()?'me':'')+'"><div class="rank">'+(i+1)+'</div><div class="name">'+esc(x.player)+'</div><div class="pct">'+(Number.isFinite(x.pct)?x.pct.toFixed(1)+'%':'—')+'</div></div>').join('');const detail=me?'<div class="proj-list-title">'+esc(me.player)+' PICKS</div>'+me.detail.map(x=>'<div class="proj-game"><div class="proj-head"><b>GAME '+(x.i+1)+'</b><span>'+esc(x.g.e.status?.type?.shortDetail||'')+'</span></div><div class="proj-pick"><img src="'+esc(x.pickedTeam?.team?.logo||logo(x.pick))+'"><div><b>'+esc(x.pick)+'</b><div class="note">PICK</div></div><span class="proj-pct '+x.state+'">'+(Number.isFinite(x.pct)?x.pct.toFixed(1)+'%':'—')+'</span></div></div>').join(''):'';bodyEl.innerHTML=list+detail}catch(e){statusEl.textContent=e.message||'Projection unavailable';bodyEl.innerHTML='<div class="proof">Could not load saved picks and ESPN projection data.</div>'}}
async function load(){if(tool==='projected'){drawProjected();return}statusEl.textContent='Loading Week '+selected+'…';bodyEl.innerHTML='';try{const r=await fetch('./api/compare-picks?pool='+encodeURIComponent(pool)+'&week='+selected+'&role='+encodeURIComponent(role)+'&_='+Date.now(),{cache:'no-store'}),j=await r.json();if(!r.ok)throw Error(j.error||'Pool picks unavailable');if(!j.locked&&!/admin|commissioner/i.test(role)){statusEl.innerHTML='<b>PICKS ARE STILL PRIVATE</b>';return}statusEl.innerHTML='<b>WEEK '+selected+'</b> · SAVED PICKS';drawMatter(j)}catch(e){statusEl.textContent=e.message||'Data unavailable'}}load();
