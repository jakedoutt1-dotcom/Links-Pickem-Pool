<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LINKS — NFL Pick Tools</title><link rel="stylesheet" href="./shell.css?v=672"><style>
.wrap{padding:18px 5%;max-width:1100px;margin:auto}.signed{padding:8px 5%;color:#e8bb5b;font-weight:900;text-align:right;background:#07131d}.weekbar{display:grid;grid-template-columns:auto 1fr auto;gap:8px;margin:12px 0}.weekbar button,.weekbar select,.opp-select{min-height:46px;border:1px solid #315168;border-radius:8px;background:#07131d;color:#fff;padding:8px;font-weight:900}.note{color:#aebcc6}.gtm-summary{display:flex;justify-content:space-between;gap:8px;background:#182530;border-radius:9px;padding:10px;margin:10px 0}.gtm-game{border:1px solid #34404d;border-radius:12px;background:#111923;padding:10px;margin:8px 0}.gtm-head{display:flex;justify-content:space-between;font-size:11px;color:#aebcc6;margin-bottom:7px}.gtm-sides{display:grid;grid-template-columns:1fr 1fr;gap:7px}.gtm-side{display:flex;align-items:center;gap:8px;background:#192731;border-radius:9px;padding:9px;font-size:12px}.gtm-side img{width:34px;height:34px;object-fit:contain}.gtm-side b{display:block;font-size:14px}.gtm-you{border:1px solid #ff6a1a}.gtm-win{border-color:#2a9d62;color:#45e58d}.gtm-loss{border-color:#9d3b42;color:#ff737c}.proj-table{width:100%;border-collapse:collapse;margin-top:12px}.proj-table th,.proj-table td{padding:10px 7px;border-bottom:1px solid #29485e;text-align:left}.proj-table th{font-size:10px;color:#9fb0bb;text-transform:uppercase}.proj-meter{height:8px;background:#17232c;border-radius:20px;overflow:hidden;margin-top:5px}.proj-meter span{display:block;height:100%;background:linear-gradient(90deg,#2a9d62,#e8bb5b)}.source{margin:10px 0;padding:10px;border:1px solid #315168;border-radius:9px;background:#081925}.source b{color:#55ef8d}.logo32{width:30px;height:30px;object-fit:contain}@media(max-width:560px){.wrap{padding:12px 3%}.gtm-sides{grid-template-columns:1fr 1fr}.gtm-side{padding:7px;gap:5px}.gtm-side img{width:27px;height:27px}.proj-table th,.proj-table td{padding:8px 4px;font-size:11px}}
</style><script src="./build.js?v=672"></script></head><body><header class="top"><div class="logo">⛓ LINKS</div><button class="back" id="signOut">SIGN OUT</button></header><div id="signed" class="signed"></div><nav class="nflnav" id="nflnav"></nav><main class="wrap"><section class="card"><div class="eyebrow">NFL PICK’EM</div><h1 id="title"></h1><div class="weekbar"><button id="prev">←</button><select id="week"></select><button id="next">→</button></div><div id="status" class="proof">Loading…</div><div id="body"></div></section></main><footer class="foot">LINKS NEW BUILD · v672</footer><script src="./shell.js?v=672"></script><script>
const q=new URLSearchParams(location.search),pool=q.get('pool')||'',role=localStorage.getItem('links-player-role')||'',playerName=localStorage.getItem('links-player-name')||localStorage.getItem('links-player-id')||'',tool=q.get('tool')==='matter'?'matter':'projected',esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let selected=Number(q.get('week')||0)||0,current=0;
signed.textContent=playerName?'SIGNED IN: '+playerName:'';title.textContent=tool==='matter'?'PICKS THAT MATTER':'PROJECTED STANDINGS';
const labels={19:'Wild Card',20:'Divisional',21:'Conference Championships',22:'Super Bowl'};for(let w=1;w<=22;w++)week.add(new Option(w<=18?'Week '+w:labels[w],w));
function logo(team){let t=String(team||'').toLowerCase();if(t==='was')t='wsh';return t?'https://a.espncdn.com/i/teamlogos/nfl/500/'+t+'.png':''}
function go(w){selected=Math.max(1,Math.min(22,Number(w)||1));week.value=String(selected);const u=new URL(location.href);u.searchParams.set('week',selected);history.replaceState(null,'',u);load()}
prev.onclick=()=>go(selected-1);next.onclick=()=>go(selected+1);week.onchange=()=>go(week.value);signOut.onclick=()=>{['links-current-pool','links-player-id','links-player-name','links-player-role','links-session-v1'].forEach(k=>localStorage.removeItem(k));location.replace('./index.html')};
function resultClass(team,win){if(!win)return'';return String(team).toUpperCase()===String(win).toUpperCase()?' gtm-win':' gtm-loss'}
function drawMatter(j){const players=j.players||[],results=j.results||{},me=players.find(p=>String(p.player||'').toLowerCase()===String(playerName).toLowerCase())||players[0];if(!me){body.innerHTML='<div class="proof">No saved picks for this week.</div>';return}const others=players.filter(p=>p!==me);if(!others.length){body.innerHTML='<div class="proof">Picks That Matter appears when another player has locked picks.</div>';return}body.innerHTML='<div class="note">See the games where your pick is different from another player.</div><select id="opp" class="opp-select" style="width:100%;margin:10px 0">'+others.map((p,i)=>'<option value="'+i+'">'+esc(p.player)+'</option>').join('')+'</select><div id="matterRows"></div>';const draw=()=>{const opp=others[Number(document.getElementById('opp').value)||0];let same=0,diff=0,rows=[];const max=Math.max((j.games||[]).length,Object.keys(me.picks||{}).length,Object.keys(opp.picks||{}).length);for(let i=0;i<max;i++){const a=me.picks?.[i]||'—',b=opp.picks?.[i]||'—';if(a===b){if(a!=='—')same++;continue}if(a==='—'&&b==='—')continue;diff++;const win=results[i]??results[String(i)]??'';const cell=(team,name,you)=>'<div class="gtm-side '+(you?'gtm-you ':'')+resultClass(team,win)+'><img src="'+logo(team)+'" alt=""><div><small>'+esc(name)+'</small><b>'+esc(team)+'</b></div></div>';rows.push('<div class="gtm-game"><div class="gtm-head"><b>GAME '+(i+1)+'</b><span>SWING GAME</span></div><div class="gtm-sides">'+cell(a,me.player,true)+cell(b,opp.player,false)+'</div></div>')}matterRows.innerHTML='<div class="gtm-summary"><b>'+esc(me.player)+' vs '+esc(opp.player)+'</b><span><b>'+diff+'</b> different · '+same+' same</span></div>'+(rows.join('')||'<div class="proof">No different picks between these players.</div>')};opp.onchange=draw;draw()}
function drawProjected(j){const games=j.games||[],players=j.players||[],outcomes=j.results||{};if(!games.length||!players.length){body.innerHTML='<div class="proof">Waiting for games and saved picks.</div>';return}const rows=players.map((entry,order)=>{const pm=entry.picks||{};let actualCorrect=0,expectedRemaining=0,picked=0,pending=0;for(let i=0;i<games.length;i++){const g=games[i],team=pm[i],finalWinner=outcomes[i]??outcomes[String(i)]??null;if(!team)continue;picked++;if(finalWinner){if(String(finalWinner).toUpperCase()===String(team).toUpperCase())actualCorrect++}else{pending++;const awayPct=Number(g?.market?.awayPct),homePct=Number(g?.market?.homePct);let pickProb=.5;if(Number.isFinite(awayPct)&&Number.isFinite(homePct)){if(String(team).toUpperCase()===String(g.away).toUpperCase())pickProb=awayPct/100;else if(String(team).toUpperCase()===String(g.home).toUpperCase())pickProb=homePct/100}expectedRemaining+=Math.max(0,Math.min(1,pickProb))}}return{player:entry.player||'Player',order,picked,pending,actualCorrect,projected:actualCorrect+expectedRemaining}}).sort((a,b)=>b.projected-a.projected||b.actualCorrect-a.actualCorrect||a.order-b.order);body.innerHTML='<div class="source"><b>● LIVE PROJECTION · ESPN LIVE DATA</b><div class="note">Projection uses ESPN game probabilities plus final results. If ESPN has no probability for a game, the unfinished pick is treated as 50/50.</div></div><div style="overflow-x:auto"><table class="proj-table"><thead><tr><th>#</th><th>Player</th><th>Projected</th><th>Correct Now</th><th>Pick Outlook</th></tr></thead><tbody>'+rows.map((r,i)=>{const denom=Math.max(1,r.picked),pct=Math.max(0,Math.min(100,(r.projected/denom)*100));return'<tr><td>'+(i+1)+'</td><td><b>'+esc(r.player)+'</b></td><td><b>'+r.projected.toFixed(2)+'</b> / '+(r.picked||games.length)+'</td><td>'+r.actualCorrect+'</td><td><b>'+pct.toFixed(0)+'%</b><div class="proj-meter"><span style="width:'+pct.toFixed(1)+'%"></span></div><div class="note">'+r.pending+' remaining</div></td></tr>'}).join('')+'</tbody></table></div>'}
async function load(){status.textContent='Loading '+(selected<=18?'Week '+selected:labels[selected])+'…';body.innerHTML='';try{const r=await fetch('./api/compare-picks?pool='+encodeURIComponent(pool)+'&week='+selected+'&role='+encodeURIComponent(role)+'&_='+Date.now(),{cache:'no-store'}),j=await r.json();if(!r.ok)throw Error(j.error||'Pool picks unavailable');if(!j.locked&&!/admin|commissioner/i.test(role)){status.innerHTML='<b>PICKS ARE STILL PRIVATE</b><div class="note">These tools open after the weekly picks lock.</div>';return}status.innerHTML='<b>'+(selected<=18?'WEEK '+selected:labels[selected].toUpperCase())+'</b> · LOCKED POOL PICKS';tool==='matter'?drawMatter(j):drawProjected(j)}catch(e){status.textContent=e.message||'Data unavailable'}}
async function boot(){if(!selected){try{const r=await fetch('https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?limit=1',{cache:'no-store'}),j=await r.json();current=Number(j.week?.number||1)}catch{current=1}selected=current}week.value=String(selected);load()}boot();
</script></body></html>
