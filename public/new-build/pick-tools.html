<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LINKS — NFL Pick Tools</title><link rel="stylesheet" href="./shell.css?v=790"><style>.wrap{padding:18px 5%;max-width:1100px;margin:auto}.weekbar{display:grid;grid-template-columns:auto 1fr auto;gap:8px;margin:12px 0}.weekbar button,.weekbar select,.opp-select{min-height:46px;border:1px solid #315168;border-radius:8px;background:#07131d;color:#fff;padding:8px;font-weight:900}.note{color:#aebcc6}.gtm-summary{display:flex;justify-content:space-between;gap:8px;background:#182530;border-radius:9px;padding:10px;margin:10px 0}.gtm-player-heads{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:10px 0 6px}.gtm-player-head{padding:9px 10px;text-align:center;border-bottom:2px solid #315168;color:#e8bb5b;font-weight:1000;font-size:15px}.gtm-game{border:1px solid #34404d;border-radius:12px;background:#111923;padding:10px;margin:8px 0}.gtm-sides{display:grid;grid-template-columns:1fr 1fr;gap:7px}.gtm-side{display:flex;align-items:center;gap:8px;background:#192731;border-radius:9px;padding:9px}.gtm-side img{width:38px;height:38px;object-fit:contain}.gtm-you{border:1px solid #ff6a1a}.proj-rank{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:12px 10px;border-bottom:1px solid #29485e}.proj-rank.me{background:rgba(232,187,91,.08);border-radius:8px}.proj-rank .rank{font-weight:1000;color:#91a8b6}.proj-rank .name{font-weight:1000}.proj-rank .pct{font-size:20px;font-weight:1000;color:#55ef8d}.proj-list-title{margin:16px 0 6px;color:#e8bb5b;font-size:11px;font-weight:1000;letter-spacing:1.5px}.proj-meta{font-size:10px;color:#8da7b7}.proj-meter{height:6px;background:#25313b;border-radius:99px;overflow:hidden;margin-top:4px}.proj-meter span{display:block;height:100%;background:#55ef8d}</style><script src="./version.js?v=790"></script><script src="./build.js?v=790"></script><script src="./nfl-rewrite/core.js?v=790"></script></head><body><header class="top"><div class="logo">⛓ LINKS</div></header><nav class="nflnav" id="nflnav"></nav><main class="wrap"><section class="card"><div class="eyebrow">NFL PICK’EM</div><h1 id="title">PICKS THAT MATTER</h1><div class="weekbar"><button id="prev">←</button><select id="week"></select><button id="next">→</button></div><div id="status" class="proof">Loading…</div><div id="body"></div></section></main><footer class="foot" data-links-version>v790</footer><script src="./shell.js?v=790"></script><script>
const q=new URLSearchParams(location.search),po=(()=>{try{return JSON.parse(localStorage.getItem('links-current-pool')||'null')||{}}catch{return{}}})(),pool=q.get('pool')||po.id||'',role=localStorage.getItem('links-player-role')||'',playerName=localStorage.getItem('links-player-name')||'',tool=q.get('tool')==='projected'?'projected':'matter',labels={19:'Wild Card',20:'Divisional',21:'Conference Championships',22:'Super Bowl'},weekEl=document.getElementById('week'),statusEl=document.getElementById('status'),bodyEl=document.getElementById('body');let selected=Number(q.get('week')||0)||1;title.textContent=tool==='projected'?'PROJECTED':'PICKS THAT MATTER';for(let w=1;w<=22;w++)weekEl.add(new Option(w<=18?'Week '+w:labels[w],w));weekEl.value=selected;const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const ALIAS={WAS:'WSH',WSH:'WSH',JAC:'JAX',JAX:'JAX',LA:'LAR',LAR:'LAR',OAK:'LV',LV:'LV',SD:'LAC',LAC:'LAC'};function abbr(t){t=String(t||'').trim().toUpperCase();return ALIAS[t]||t}function go(w){selected=Math.max(1,Math.min(22,Number(w)||1));weekEl.value=selected;const u=new URL(location.href);u.searchParams.set('week',selected);history.replaceState(null,'',u);load()}prev.onclick=()=>go(selected-1);next.onclick=()=>go(selected+1);weekEl.onchange=()=>go(weekEl.value);function logo(t){t=abbr(t).toLowerCase();return t?'https://a.espncdn.com/i/teamlogos/nfl/500/'+t+'.png':''}
function drawMatter(j){const players=j.players||[],me=players.find(p=>String(p.player).toLowerCase()===String(playerName).toLowerCase())||players[0],others=players.filter(p=>p!==me);if(!me||!others.length){bodyEl.innerHTML='<div class="proof">Picks That Matter appears when at least two players have saved picks.</div>';return}bodyEl.innerHTML='<div class="note">Games where your pick differs from another player.</div><select id="opp" class="opp-select" style="width:100%;margin:10px 0">'+others.map((p,i)=>'<option value="'+i+'">'+esc(p.player)+'</option>').join('')+'</select><div id="rows"></div>';const opp=document.getElementById('opp'),rows=document.getElementById('rows');function draw(){const o=others[+opp.value||0];let same=0,diff=0,out=[];const max=Math.max(Object.keys(me.picks||{}).length,Object.keys(o.picks||{}).length,(j.games||[]).length);for(let i=0;i<max;i++){const a=me.picks?.[i]||'—',b=o.picks?.[i]||'—';if(a===b){if(a!=='—')same++;continue}if(a==='—'&&b==='—')continue;diff++;out.push('<div class="gtm-game"><b>GAME '+(i+1)+'</b><div class="gtm-sides"><div class="gtm-side gtm-you">'+(a!=='—'?'<img src="'+logo(a)+'">':'')+'<b>'+esc(a)+'</b></div><div class="gtm-side">'+(b!=='—'?'<img src="'+logo(b)+'">':'')+'<b>'+esc(b)+'</b></div></div></div>')}rows.innerHTML='<div class="gtm-summary"><b>'+esc(me.player)+' vs '+esc(o.player)+'</b><span>'+diff+' different · '+same+' same</span></div><div class="gtm-player-heads"><div class="gtm-player-head">'+esc(me.player)+'</div><div class="gtm-player-head">'+esc(o.player)+'</div></div>'+out.join('')}opp.onchange=draw;draw()}
async function probabilities(games){const out={};await Promise.all(games.map(async(g,n)=>{const i=Number(g.gameIndex??n),eventId=g.id||g.eventId;if(!eventId)return;try{const r=await fetch('https://site.api.espn.com/apis/site/v2/sports/football/nfl/summary?event='+encodeURIComponent(eventId),{cache:'no-store'}),j=await r.json(),wp=j.winprobability||[];if(wp.length){const last=wp[wp.length-1],home=Number(last.homeWinPercentage);if(Number.isFinite(home))out[i]={home,away:1-home}}if(!out[i]){const comp=j.header?.competitions?.[0],od=comp?.odds?.[0],homePct=Number(od?.homeTeamOdds?.winPercentage),awayPct=Number(od?.awayTeamOdds?.winPercentage);if(Number.isFinite(homePct)&&Number.isFinite(awayPct))out[i]={home:homePct>1?homePct/100:homePct,away:awayPct>1?awayPct/100:awayPct}}}catch{}}));return out}
async function sharedWeek(){const board=await LINKS_NFL_REWRITE.scoreboard(selected);const games=(board||[]).map((g,n)=>({...g,gameIndex:Number(g.gameIndex??n)}));const results={};games.forEach(g=>{if(g.final&&g.winner)results[g.gameIndex]=abbr(g.winner)});return{games,results}}
async function savedPicks(){const r=await fetch('./api/compare-picks?pool='+encodeURIComponent(pool)+'&week='+selected+'&role='+encodeURIComponent(role)+'&_='+Date.now(),{cache:'no-store'}),j=await r.json();if(!r.ok)throw Error(j.error||'Saved picks unavailable');return j}
async function drawProjected(){statusEl.textContent='Calculating ESPN win probabilities…';bodyEl.innerHTML='';try{const [c,engine]=await Promise.all([savedPicks(),sharedWeek()]);const players=(c.players||[]).filter(p=>Object.keys(p.picks||{}).length),games=engine.games,results=engine.results,probs=await probabilities(games);const rows=players.map((p,order)=>{let correct=0,expected=0,picked=0,pending=0;const indexes=[...new Set([...games.map((g,n)=>Number(g.gameIndex??n)),...Object.keys(p.picks||{}).map(Number)])].filter(Number.isFinite).sort((a,b)=>a-b);for(const i of indexes){const pick=abbr(p.picks?.[i]);if(!pick)continue;picked++;const winner=abbr(results[i]??'');if(winner){if(winner===pick)correct++;continue}pending++;const g=games.find((x,n)=>Number(x.gameIndex??n)===i),pr=probs[i];let chance=.5;if(g&&pr){if(pick===abbr(g.home))chance=pr.home;else if(pick===abbr(g.away))chance=pr.away}expected+=Math.max(0,Math.min(1,chance))}return{player:p.player||'Player',order,picked,pending,correct,projected:correct+expected}}).sort((a,b)=>b.projected-a.projected||b.correct-a.correct||a.order-b.order);statusEl.innerHTML='<b>WEEK '+selected+' · PROJECTED STANDINGS</b><div class="proj-meta">● ESPN WIN PROBABILITY PROJECTION<br>Completed games use the shared LINKS NFL engine. Games still in progress use ESPN live win probability; upcoming games use ESPN probability when available and 50/50 only when ESPN provides none.</div>';bodyEl.innerHTML='<div class="proj-list-title">PROJECTED</div>'+rows.map((x,i)=>{const pct=x.picked?100*x.projected/x.picked:0;return '<div class="proj-rank '+(String(x.player).toLowerCase()===String(playerName).toLowerCase()?'me':'')+'"><div class="rank">'+(i+1)+'</div><div class="name">'+esc(x.player)+'<div class="proj-meta"><b>'+x.projected.toFixed(2)+'</b> / '+x.picked+' projected · '+x.correct+' correct now · '+x.pending+' remaining</div><div class="proj-meter"><span style="width:'+Math.min(100,pct).toFixed(1)+'%"></span></div></div><div class="pct">'+pct.toFixed(0)+'%</div></div>'}).join('')}catch(e){statusEl.textContent=e.message||'Projection unavailable';bodyEl.innerHTML='<div class="proof">Could not calculate projection.</div>'}}
async function load(){if(tool==='projected'){drawProjected();return}statusEl.textContent='Loading Week '+selected+'…';bodyEl.innerHTML='';try{const [j,engine]=await Promise.all([savedPicks(),sharedWeek()]);if(!j.locked&&!/admin|commissioner/i.test(role)){statusEl.innerHTML='<b>PICKS ARE STILL PRIVATE</b>';return}statusEl.innerHTML='<b>WEEK '+selected+'</b> · SAVED PICKS';drawMatter({...j,games:engine.games,results:engine.results})}catch(e){statusEl.textContent=e.message||'Data unavailable'}}load();
</script></body></html>
