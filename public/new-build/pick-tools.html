<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LINKS — NFL Pick Tools</title><link rel="stylesheet" href="./shell.css?v=728"><style>.wrap{padding:18px 5%;max-width:1100px;margin:auto}.weekbar{display:grid;grid-template-columns:auto 1fr auto;gap:8px;margin:12px 0}.weekbar button,.weekbar select,.opp-select{min-height:46px;border:1px solid #315168;border-radius:8px;background:#07131d;color:#fff;padding:8px;font-weight:900}.note{color:#aebcc6}.gtm-summary{display:flex;justify-content:space-between;gap:8px;background:#182530;border-radius:9px;padding:10px;margin:10px 0}.gtm-player-heads{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:10px 0 6px}.gtm-player-head{padding:9px 10px;text-align:center;border-bottom:2px solid #315168;color:#e8bb5b;font-weight:1000;font-size:15px}.gtm-game{border:1px solid #34404d;border-radius:12px;background:#111923;padding:10px;margin:8px 0}.gtm-sides{display:grid;grid-template-columns:1fr 1fr;gap:7px}.gtm-side{display:flex;align-items:center;gap:8px;background:#192731;border-radius:9px;padding:9px}.gtm-side img{width:38px;height:38px;object-fit:contain}.gtm-you{border:1px solid #ff6a1a}.proj-rank{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:12px 10px;border-bottom:1px solid #29485e}.proj-rank.me{background:rgba(232,187,91,.08);border-radius:8px}.proj-rank .rank{font-weight:1000;color:#91a8b6}.proj-rank .name{font-weight:1000}.proj-rank .pct{font-size:20px;font-weight:1000;color:#e8bb5b}.proj-list-title{margin:16px 0 6px;color:#e8bb5b;font-size:11px;font-weight:1000;letter-spacing:1.5px}.proj-meta{font-size:10px;color:#8da7b7}.proj-alive{color:#55ef8d!important}.proj-meter{height:6px;background:#25313b;border-radius:99px;overflow:hidden;margin-top:4px}.proj-meter span{display:block;height:100%;background:#55ef8d}</style><script src="./build.js?v=728"></script></head><body><header class="top"><div class="logo">⛓ LINKS</div></header><nav class="nflnav" id="nflnav"></nav><main class="wrap"><section class="card"><div class="eyebrow">NFL PICK’EM</div><h1 id="title">PICKS THAT MATTER</h1><div class="weekbar"><button id="prev">←</button><select id="week"></select><button id="next">→</button></div><div id="status" class="proof">Loading…</div><div id="body"></div></section></main><footer class="foot">LINKS NEW BUILD · v728</footer><script src="./shell.js?v=728"></script><script>
const q=new URLSearchParams(location.search),po=(()=>{try{return JSON.parse(localStorage.getItem('links-current-pool')||'null')||{}}catch{return{}}})(),pool=q.get('pool')||po.id||'',role=localStorage.getItem('links-player-role')||'',playerName=localStorage.getItem('links-player-name')||'',tool=q.get('tool')==='projected'?'projected':'matter',labels={19:'Wild Card',20:'Divisional',21:'Conference Championships',22:'Super Bowl'},weekEl=document.getElementById('week'),statusEl=document.getElementById('status'),bodyEl=document.getElementById('body');let selected=Number(q.get('week')||0)||1;title.textContent=tool==='projected'?'PROJECTED':'PICKS THAT MATTER';for(let w=1;w<=22;w++)weekEl.add(new Option(w<=18?'Week '+w:labels[w],w));weekEl.value=selected;const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function go(w){selected=Math.max(1,Math.min(22,Number(w)||1));weekEl.value=selected;const u=new URL(location.href);u.searchParams.set('week',selected);history.replaceState(null,'',u);load()}prev.onclick=()=>go(selected-1);next.onclick=()=>go(selected+1);weekEl.onchange=()=>go(weekEl.value);function logo(t){t=String(t||'').toLowerCase().replace('was','wsh');return t?'https://a.espncdn.com/i/teamlogos/nfl/500/'+t+'.png':''}function drawMatter(j){const players=j.players||[],me=players.find(p=>String(p.player).toLowerCase()===String(playerName).toLowerCase())||players[0],others=players.filter(p=>p!==me);if(!me||!others.length){bodyEl.innerHTML='<div class="proof">Picks That Matter appears when at least two players have saved picks.</div>';return}bodyEl.innerHTML='<div class="note">Games where your pick differs from another player.</div><select id="opp" class="opp-select" style="width:100%;margin:10px 0">'+others.map((p,i)=>'<option value="'+i+'">'+esc(p.player)+'</option>').join('')+'</select><div id="rows"></div>';const opp=document.getElementById('opp'),rows=document.getElementById('rows');function draw(){const o=others[+opp.value||0];let same=0,diff=0,out=[];const max=Math.max(Object.keys(me.picks||{}).length,Object.keys(o.picks||{}).length,(j.games||[]).length);for(let i=0;i<max;i++){const a=me.picks?.[i]||'—',b=o.picks?.[i]||'—';if(a===b){if(a!=='—')same++;continue}if(a==='—'&&b==='—')continue;diff++;out.push('<div class="gtm-game"><b>GAME '+(i+1)+'</b><div class="gtm-sides"><div class="gtm-side gtm-you">'+(a!=='—'?'<img src="'+logo(a)+'">':'')+'<b>'+esc(a)+'</b></div><div class="gtm-side">'+(b!=='—'?'<img src="'+logo(b)+'">':'')+'<b>'+esc(b)+'</b></div></div></div>')}rows.innerHTML='<div class="gtm-summary"><b>'+esc(me.player)+' vs '+esc(o.player)+'</b><span>'+diff+' different · '+same+' same</span></div><div class="gtm-player-heads"><div class="gtm-player-head">'+esc(me.player)+'</div><div class="gtm-player-head">'+esc(o.player)+'</div></div>'+out.join('')}opp.onchange=draw;draw()}
async function drawProjected(){statusEl.textContent='Loading projected standings…';bodyEl.innerHTML='';try{const r=await fetch('./api/compare-picks?pool='+encodeURIComponent(pool)+'&week='+selected+'&role='+encodeURIComponent(role)+'&_='+Date.now(),{cache:'no-store'}),c=await r.json();if(!r.ok)throw Error(c.error||'Saved picks unavailable');if(!c.locked&&!/admin|commissioner/i.test(role)){statusEl.innerHTML='<b>PROJECTED OPENS AFTER THE FIRST KICKOFF</b>';return}const players=c.players||[],games=c.games||[],outcomes=c.results||c.outcomes||{};const rows=players.map((entry,order)=>{const player=entry.player||entry.name||('Player '+(order+1)),pm=entry.picks||{};let actualCorrect=0,expectedRemaining=0,picked=0,pending=0;for(let i=0;i<games.length;i++){const team=pm[i],finalWinner=outcomes[i]??outcomes[String(i)]??games[i]?.winner??null;if(!team)continue;picked++;if(finalWinner){if(String(finalWinner)===String(team))actualCorrect++}else{pending++;expectedRemaining+=0.5}}return{player,order,picked,pending,actualCorrect,expectedRemaining,projected:actualCorrect+expectedRemaining}}).sort((a,b)=>b.projected-a.projected||b.actualCorrect-a.actualCorrect||a.order-b.order);statusEl.innerHTML='<b>WEEK '+selected+' · PROJECTED STANDINGS</b><div class="proj-meta">● LIVE PROJECTION · ESPN LIVE DATA<br>Projection uses the original LINKS calculation: games already correct plus a neutral 50/50 estimate for every remaining saved pick. Official standings use final results only.</div>';bodyEl.innerHTML='<div class="proj-list-title">PROJECTED</div>'+rows.map((x,i)=>{const denom=Math.max(1,x.picked),strength=Math.max(0,Math.min(100,(x.projected/denom)*100));return '<div class="proj-rank '+(String(x.player).toLowerCase()===String(playerName).toLowerCase()?'me':'')+'"><div class="rank">'+(i+1)+'</div><div class="name">'+esc(x.player)+'<div class="proj-meta"><b>'+x.projected.toFixed(2)+'</b> / '+(x.picked||games.length)+' projected · '+x.actualCorrect+' correct now · '+x.pending+' remaining</div><div class="proj-meter"><span style="width:'+strength.toFixed(1)+'%"></span></div></div><div class="pct proj-alive">'+strength.toFixed(0)+'%</div></div>'}).join('')}catch(e){statusEl.textContent=e.message||'Projection unavailable';bodyEl.innerHTML='<div class="proof">Could not calculate projection.</div>'}}
async function load(){if(tool==='projected'){drawProjected();return}statusEl.textContent='Loading Week '+selected+'…';bodyEl.innerHTML='';try{const r=await fetch('./api/compare-picks?pool='+encodeURIComponent(pool)+'&week='+selected+'&role='+encodeURIComponent(role)+'&_='+Date.now(),{cache:'no-store'}),j=await r.json();if(!r.ok)throw Error(j.error||'Pool picks unavailable');if(!j.locked&&!/admin|commissioner/i.test(role)){statusEl.innerHTML='<b>PICKS ARE STILL PRIVATE</b>';return}statusEl.innerHTML='<b>WEEK '+selected+'</b> · SAVED PICKS';drawMatter(j)}catch(e){statusEl.textContent=e.message||'Data unavailable'}}load();
</script></body></html>
