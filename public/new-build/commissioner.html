<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LINKS — Commissioner Admin</title><link rel="stylesheet" href="./shell.css?v=405"><style>
:root{--panel:#07131d;--panel2:#0b1925;--line:#29485e;--muted:#aebcc6;--gold:#e8bb5b;--blue:#2785b5;--green:#168b50;--red:#7b242b}body{background:#03080d}.hero{background:linear-gradient(90deg,#02070de8,#07131dcc),url('./assets/links-stadium-hero.png') center/cover}.logo{font-size:0;width:190px;height:52px;background:url('./assets/ChatGPT Image Sep 22, 2026, 07_35_27 PM.png') left center/contain no-repeat}.logo small{display:none}.admin-shell{max-width:920px;margin:auto;padding:14px}.admin-mode{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border:1px solid #315168;border-radius:11px;background:linear-gradient(90deg,#0d2230,#07131d);margin-bottom:10px}.admin-mode b{color:#fff;font-size:18px}.admin-mode span{display:block;color:var(--gold);font-size:11px;font-weight:900;margin-top:3px}.admin-nav{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;position:sticky;top:0;z-index:40;background:#03080df2;backdrop-filter:blur(8px);padding:8px 0}.admin-nav button{min-height:48px;border:1px solid #315168;border-radius:8px;background:#0a1a26;color:#fff;font-weight:900;font-size:10px}.admin-nav button:hover{border-color:#6fc7e5}.admin-card{background:linear-gradient(145deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:13px;padding:15px;margin:10px 0;box-shadow:0 12px 28px #0005}.admin-card h3{margin:0 0 8px}.admin-card input,.admin-card select,.admin-card textarea{width:100%;box-sizing:border-box;padding:11px;border:1px solid #465a6c;border-radius:9px;background:#030b11;color:#fff;margin-top:5px}.admin-card textarea{min-height:110px;resize:vertical}.small,.muted{font-size:12px;color:var(--muted);line-height:1.5}.live-kickoff{margin:10px 0;padding:11px;border:1px solid #405769;border-radius:9px;background:#0d1821}.live-kickoff b{display:block;color:#fff;margin-top:4px}.action{width:100%;margin-top:9px;min-height:46px;border:1px solid #397d9d;border-radius:8px;background:linear-gradient(#15506c,#092c40);color:#fff;font-weight:900}.action.primary{border-color:#54b9d8;background:linear-gradient(#1880a4,#0b4965)}.action.green{border-color:#36a86d;background:linear-gradient(#18804d,#0b482b)}.action.gold{border-color:#e8bb5b;background:linear-gradient(#9b6a20,#4c310e)}.action.red{border-color:#b74b55;background:linear-gradient(#7b242b,#43141a)}.proof{margin-top:8px;padding:9px;border:1px solid #344653;border-radius:9px;color:var(--muted);font-size:12px}.tool-card .action{background:#102c3f}.player-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.member-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;border-top:1px solid #203746;padding:10px 0}.member-row:first-child{border-top:0}.member-row .action{width:auto;margin:0;min-height:38px;padding:8px 11px}.section-title{color:var(--gold);font-size:11px;letter-spacing:1px;font-weight:900;margin:16px 0 6px}.tool-pane{display:none;margin-top:12px;padding:13px;border:1px solid #486477;border-radius:10px;background:#050e15}.tool-pane.open{display:block}.college-only{display:none}.is-college .college-only{display:block}.is-college .nfl-only{display:none}.old-admin-section{scroll-margin-top:70px}@media(max-width:720px){.admin-shell{padding:9px}.admin-nav{grid-template-columns:1fr 1fr}.player-grid{grid-template-columns:1fr}.member-row{grid-template-columns:1fr}.member-row .action{width:100%}.hero{min-height:180px}.admin-mode{align-items:flex-start;flex-direction:column}}
</style><script src="./build.js?v=635"></script></head><body><header class="top"><div class="logo">LINKS<small>PICKS. POOLS. PEOPLE.</small></div><a class="back" id="backPool" href="./control-center.html">← BACK TO POOL</a></header><section class="hero"><div class="eyebrow">COMMISSIONER CONTROLS</div><h1 id="heroTitle">NFL PICK’EM ADMIN</h1><p>Pool settings, deadlines, players, access and corrections in one place.</p></section><div class="livebar"><div class="livebrand"><i class="dot"></i> LINKS LIVE</div><div id="liveTrack" class="track"><span>Loading live scores…</span></div></div><main class="admin-shell"><div class="admin-mode"><div><b id="adminGameTitle">🏈 NFL PICK’EM ADMIN</b><span id="adminMeta">COMMISSIONER · CURRENT WEEK</span></div><button class="action" id="changeGame" style="width:auto;margin:0">🎮 CHANGE GAME</button></div><div class="admin-nav"><button data-jump="settings">POOL SETTINGS</button><button data-jump="players">PLAYERS & INVITES</button><button data-jump="access">PLAYER ACCESS</button><button data-jump="corrections">CORRECTIONS</button></div><div id="manager"></div></main><footer class="foot">LINKS NEW BUILD · v635 · COMMISSIONER</footer><script src="./shell.js?v=635"></script><script>
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const q=new URLSearchParams(location.search),game=q.get('game')||'NFL Pick’em',isCollege=/college/i.test(game),poolId=q.get('pool');document.body.classList.toggle('is-college',isCollege);heroTitle.textContent=(isCollege?'COLLEGE PICK’EM':'NFL PICK’EM')+' ADMIN';adminGameTitle.textContent=(isCollege?'🎓 COLLEGE PICK’EM':'🏈 NFL PICK’EM')+' ADMIN';
let pools=[];try{pools=JSON.parse(localStorage.getItem('links-pools-v1')||'[]')}catch{}let pool=pools.find(x=>String(x.id)===String(poolId));if(!pool)try{pool=JSON.parse(localStorage.getItem('links-current-pool')||'null')}catch{};const M=document.getElementById('manager');
function weeks(){return Array.from({length:isCollege?15:22},(_,i)=>{const n=i+1,label=isCollege?'College Week '+n:(n<=18?'Week '+n:({19:'Wild Card',20:'Divisional',21:'Conference Championships',22:'Super Bowl'}[n]));return '<option value="'+n+'">'+label+'</option>'}).join('')}
async function renderAdmin(){if(!pool?.id){M.innerHTML='<div class="admin-card">Select a commissioner-owned pool first.</div>';return}adminMeta.textContent=(pool.name||'POOL')+' · '+(pool.code||'')+' · COMMISSIONER';backPool.href='./'+(isCollege?'college.html':'nfl.html')+'?pool='+encodeURIComponent(pool.id);
M.innerHTML=`<div id="settings" class="admin-card old-admin-section"><h3>⚙️ Pool Settings</h3><label class="small">Commissioner email</label><input id="commEmail" type="email" value="${E(pool.email||'')}" placeholder="commissioner@example.com"><div class="small">Used for player invites and commissioner contact.</div><label class="small" style="display:block;margin-top:10px">POOL RULES / PLAYER INSTRUCTIONS</label><textarea id="rules" maxlength="4000" placeholder="Picks must be saved before kickoff. Tiebreaker is the combined score of the final game."></textarea><button id="saveSettings" class="action green">SAVE POOL SETTINGS & RULES</button><div id="settingsMsg" class="proof">Ready.</div></div>
<div class="admin-card"><h3>⏰ PICK LOCK / DEADLINE</h3><div class="small">LINKS uses the first kickoff for the selected week. Set an override only when you want a different deadline.</div><div class="live-kickoff"><span class="small">FIRST KICKOFF FROM WEB</span><b id="webKickoff">Automatic schedule deadline</b></div><label class="small"><b>COMMISSIONER PICK-LOCK OVERRIDE</b></label><input id="lock" type="datetime-local"><div class="small">Leave blank to use automatic first kickoff.</div><button id="saveLock" class="action gold">SAVE PICK-LOCK DEADLINE</button><div id="lockMsg" class="proof">Checking…</div></div>
<div class="admin-card"><h3>🏆 FINALIZE WEEK</h3><div class="small">When games are finished, finalize the weekly winner here. This closes the selected week.</div><label class="small"><b>WEEK TO FINALIZE</b></label><select id="finalWeek">${weeks()}</select><div id="finalStatus" class="proof">Choose a completed week.</div><button id="finalizeWeek" class="action primary">🏆 FINALIZE WEEKLY WINNER</button></div>
<div class="admin-card college-only"><h3>🎓 College Week Setup</h3><div class="small">Choose how many Top 25 games count, then load the slate for commissioner selection.</div><select id="collegeCount">${Array.from({length:20},(_,i)=>'<option value="'+(i+1)+'" '+(i===9?'selected':'')+'>'+(i+1)+' games</option>').join('')}</select><button class="action gold" id="randomCollege">🎲 RANDOMLY PICK TOP 25 GAMES</button><button class="action primary" id="loadCollege">LOAD TOP 25 GAMES FOR MANUAL PICK</button></div>
<div id="access" class="admin-card tool-card old-admin-section"><h3>👥 Player Access</h3><div class="small">Like the old admin: ACTIVE players can submit picks. PENDING players stay locked. Manage everyone here.</div><button id="openAccess" class="action">MANAGE PLAYER ACCESS</button><div id="accessPane" class="tool-pane"><div id="accessRows">Loading…</div></div></div>
<div id="corrections" class="admin-card tool-card old-admin-section"><h3>🏈 Score / Result Correction</h3><div class="small">Automatic results stay in charge. Use only when a final result is wrong or delayed.</div><button id="scoreTool" class="action">OPEN SCORE CORRECTION</button><div id="scorePane" class="tool-pane"><label class="small">WEEK</label><select id="scoreWeek">${weeks()}</select><div class="proof">Automatic results are preferred. Correction controls will use the selected legacy week.</div></div></div>
<div class="admin-card tool-card"><h3>✏️ Pick Correction</h3><div class="small">Choose a week and player, then correct only the pick that needs changed.</div><button id="pickTool" class="action">OPEN PICK CORRECTION</button><div id="pickPane" class="tool-pane"><label class="small">WEEK</label><select id="pickWeek">${weeks()}</select><label class="small">PLAYER</label><select id="corrPlayer"></select><div class="proof">Select the player and week. Existing picks remain attached to the same legacy player.</div></div></div>
<div id="players" class="admin-card old-admin-section"><h3>Players & Invites</h3><div class="small">Existing players keep their picks and history. Add a player directly or send an invitation.</div><div class="section-title">INVITE NEW PLAYERS BY EMAIL</div><textarea id="emails" placeholder="player1@example.com\nplayer2@example.com"></textarea><button id="sendInv" class="action primary">SEND EMAIL INVITES</button><div id="invMsg" class="proof"></div><div class="section-title">ADD PLAYER</div><div class="player-grid"><label class="small">PLAYER NAME<input id="addName" placeholder="Example: Jake"></label><label class="small">PLAYER EMAIL · OPTIONAL<input id="addEmail" type="email" placeholder="player@example.com"></label></div><label class="small">TEMP PASSWORD<input id="addPass" value="1234"></label><button id="addPlayer" class="action green">ADD PLAYER</button><div id="addMsg" class="proof"></div><div class="section-title">CURRENT PLAYERS</div><div id="members">Loading…</div></div>
<div class="admin-card"><h3>🎮 Games in This Pool</h3><div class="small">Keep this at the bottom like the old admin. The pool’s active games stay together and players see only games enabled for this pool.</div><button id="gameManager" class="action">MANAGE POOL GAMES</button></div>`;
const load=async()=>{const qp=new URLSearchParams({pool:String(pool.id||''),name:String(pool.name||''),code:String(pool.code||'')});const rr=await fetch('./api/members?'+qp,{cache:'no-store'}),j=await rr.json();if(j.resolvedPoolId&&String(j.resolvedPoolId)!==String(pool.id)){pool={...pool,id:j.resolvedPoolId,name:j.poolName||pool.name,code:j.poolCode||pool.code};localStorage.setItem('links-current-pool',JSON.stringify(pool))}const ms=j.members||[];members.innerHTML=ms.map(x=>'<div class="member-row"><div><b>'+E(x.displayName||x.playerId)+'</b><small class="muted" style="display:block">'+E(x.status||'active')+'</small></div><button class="action" data-reset="'+E(x.playerId)+'" data-name="'+E(x.displayName||x.playerId)+'">SET TEMP PASSWORD</button></div>').join('')||'<p>No players yet.</p>';accessRows.innerHTML=ms.map(x=>'<div class="member-row"><div><b>'+E(x.displayName||x.playerId)+'</b><small class="muted" style="display:block">'+E(x.status||'active')+'</small></div><button class="action '+(x.status==='active'?'green':'red')+'" data-status="'+E(x.playerId)+'" data-current="'+E(x.status||'active')+'">'+(x.status==='active'?'ACTIVE':'PENDING')+'</button></div>').join('')||'<p>No players yet.</p>';corrPlayer.innerHTML=ms.map(x=>'<option value="'+E(x.playerId)+'">'+E(x.displayName||x.playerId)+'</option>').join('');document.querySelectorAll('[data-reset]').forEach(b=>b.onclick=async()=>{const pw=prompt('Set temporary password for '+b.dataset.name+':','1234');if(!pw)return;const r=await fetch('./api/members',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'resetPassword',pool:pool.id,poolName:pool.name,poolCode:pool.code,player:b.dataset.reset,password:pw})});alert(r.ok?'Temporary password saved.':'Password not saved.')});document.querySelectorAll('[data-status]').forEach(b=>b.onclick=async()=>{const status=b.dataset.current==='active'?'pending':'active';const r=await fetch('./api/members',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'setStatus',pool:pool.id,poolName:pool.name,poolCode:pool.code,player:b.dataset.status,status})});if(r.ok)load()})};
openAccess.onclick=()=>accessPane.classList.toggle('open');scoreTool.onclick=()=>scorePane.classList.toggle('open');pickTool.onclick=()=>pickPane.classList.toggle('open');addPlayer.onclick=async()=>{const name=addName.value.trim(),password=addPass.value,email=addEmail.value.trim();if(!name)return addMsg.textContent='Enter a player name.';const r=await fetch('./api/members',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'addPlayer',pool:pool.id,poolName:pool.name,poolCode:pool.code,name,email,password})}),j=await r.json().catch(()=>({}));addMsg.textContent=r.ok?name+' added.':j.error||'Player not added.';if(r.ok){addName.value='';addEmail.value='';load()}};sendInv.onclick=async()=>{const list=emails.value.split(/[\n,]+/).map(x=>x.trim()).filter(Boolean);if(!list.length)return invMsg.textContent='Enter at least one email.';invMsg.textContent='Sending…';let sent=0;for(const email of list){const r=await fetch('./api/invites',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pool:pool.id,email})});if(r.ok)sent++}invMsg.textContent=sent+' of '+list.length+' invitations created.'};
const gr=await fetch('./api/game-settings?pool='+encodeURIComponent(pool.id)+'&game='+encodeURIComponent(game)+'&period=current',{cache:'no-store'}),gj=await gr.json().catch(()=>({}));if(gj.settings?.lockAt){const d=new Date(gj.settings.lockAt);lock.value=new Date(d-d.getTimezoneOffset()*60000).toISOString().slice(0,16);lockMsg.textContent='Saved commissioner override.'}else lockMsg.textContent='Automatic first kickoff is active.';saveLock.onclick=async()=>{if(!lock.value)return lockMsg.textContent='Automatic first kickoff is active.';const r=await fetch('./api/game-settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pool:pool.id,game,period:'current',lockAt:new Date(lock.value).toISOString()})});lockMsg.textContent=r.ok?'Deadline saved.':'Deadline not saved.'};saveSettings.onclick=()=>settingsMsg.textContent='Layout matched to old admin. Rules persistence remains connected next.';finalizeWeek.onclick=()=>finalStatus.textContent='Week '+finalWeek.value+' selected for finalization.';gameManager.onclick=()=>location.href='./control-center.html?pool='+encodeURIComponent(pool.id);changeGame.onclick=()=>location.href='./control-center.html?pool='+encodeURIComponent(pool.id);if(isCollege){randomCollege.onclick=()=>alert('College random slate control is positioned like the old admin.');loadCollege.onclick=()=>alert('College manual Top 25 control is positioned like the old admin.')}load()}
document.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>document.getElementById(b.dataset.jump)?.scrollIntoView({behavior:'smooth',block:'start'}));renderAdmin();
</script></body></html>
