<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LINKS — PLAYMAKER v749</title><meta http-equiv="Cache-Control" content="no-store"><link rel="stylesheet" href="./shell.css?v=749"><script src="./build.js?v=749"></script><style>body{margin:0;background:#02080c;color:#eef4f2;font-family:Arial,sans-serif}.pmhero{height:clamp(180px,22vw,320px);background-color:#02070c;background-image:url('./assets/playmaker 3.png?v=749');background-position:center;background-size:contain;background-repeat:no-repeat;border-bottom:1px solid #315168}.wrap{max-width:1200px;margin:auto;padding:14px}.grid{display:grid;grid-template-columns:220px minmax(0,1fr) 310px;gap:12px}.panel{background:linear-gradient(145deg,#102c24,#071813);border:1px solid #2c654b;border-radius:10px;padding:14px}.book,.sport,.action{border:1px solid #35664f;border-radius:7px;background:#0d2a22;color:#fff;padding:10px;font-weight:900}.book{display:block;width:100%;margin:6px 0;text-align:left}.book.active,.sport.active,.action.primary{border-color:#35d07f;background:#174c35}.potd{width:100%;margin:0 0 12px;padding:15px;border:2px solid #e8bb5b;border-radius:10px;background:linear-gradient(135deg,#51370b,#162d1e);color:#fff;font-size:16px;font-weight:1000}.sports{display:flex;gap:6px;overflow:auto;margin-bottom:10px}.sport{white-space:nowrap}.market{border:1px solid #285642;border-radius:8px;padding:10px;margin:8px 0}.lines{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.pickline{border:1px solid #35664f;border-radius:6px;background:#0b251d;color:#fff;padding:10px}.slipitem{border-bottom:1px solid #285642;padding:9px 0}.muted{color:#8fa8a0;font-size:11px}.row{display:flex;gap:7px;flex-wrap:wrap}.top{display:flex;align-items:center;justify-content:space-between;padding:10px 4%;background:#03090d}.back{color:#fff;text-decoration:none}.imported{margin:0 0 12px;padding:11px;border:1px solid #35d07f;border-radius:8px;background:#0b251d;color: let BOOK='DraftKings',SPORT='NFL',EVENTS=[],CARD=[];const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function normalizeImported(x){return{selection:x.selection||x.label||'',event:x.event||x.eventID||'NFL Pick’em',market:x.market||'MONEYLINE',odds:x.odds||'',bookmaker:x.bookmaker||x.book||BOOK,source:x.source||'NFL Pick’em'}}try{CARD=JSON.parse(localStorage.getItem('links-playmaker-my-play')||'[]');if(!Array.isArray(CARD))CARD=[]}catch{CARD=[]}(function importPickem(){let imported=[];try{const s=sessionStorage.getItem('links-playmaker-import');if(s)imported=JSON.parse(s)||[]}catch{}if(!Array.isArray(imported)||!imported.length){try{imported=JSON.parse(localStorage.getItem('links-playmaker-card-v2')||'[]')||[]}catch{}}if(!Array.isArray(imported)||!imported.length)return;const incoming=imported.map(normalizeImported).filter(x=>x.selection);const keep=CARD.filter(x=>String(x.source||'').toLowerCase().indexOf('nfl pick')<0);CARD=[...keep,...incoming];localStorage.setItem('links-playmaker-my-play',JSON.stringify(CARD));try{sessionStorage.removeItem('links-playmaker-import')}catch{}const n=$('importNotice');if(n){n.hidden=false;n.textContent=incoming.length+' NFL PICK'+(incoming.length===1?'':'S')+' LOADED FROM PICK’EM · Ready in My Play.'}})();function renderCard(){const box=$('slip');if(!CARD.length){box.innerHTML='<div class="muted">Your selected plays stay private on this device.</div>';return}box.innerHTML=CARD.map((x,i)=>'<div class="slipitem"><b>'+esc(x.selection)+'</b><small style="display:block">'+esc(x.event)+' · '+esc(x.market)+(x.odds?' · '+esc(x.odds):'')+(x.bookmaker?' · '+esc(x.bookmaker):'')+'</small><button class="action" data-remove="'+i+'">REMOVE</button></div>').join('');box.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{CARD.splice(Number(b.dataset.remove),1);saveCard()})}function saveCard(){localStorage.setItem('links-playmaker-my-play',JSON.stringify(CARD));renderCard()}$('clearSlip').onclick=()=>{CARD=[];saveCard()};function american(o){return o==null?'':(Number(o)>0?'+':'')+o}function parseEvents(j){return(Array.isArray(j?.data)?j.data:[]).map(e=>{const picks=[];for(const o of Object.values(e.odds||{})){const entries=Object.entries(o.byBookmaker||{}),bk=entries[0];if(!bk)continue;const v=bk[1]||{};picks.push({selection:o.label||o.name||o.oddID,market:o.marketName||o.statID||'Market',odds:american(v.odds||v.price||v.americanOdds),bookmaker:BOOK})}return{event:e.name||e.eventName||e.eventID,picks:picks.slice(0,6)}})}async function loadOdds(){const st=$('oddsStatus');st.textContent='Loading…';try{const r=await fetch('./api/playmaker-odds?leagueID='+encodeURIComponent(SPORT)+'&limit=20',{cache:'no-store'}),j=await r.json();if(!r.ok)throw Error(j.error||'Live odds unavailable');EVENTS=parseEvents(j);$('markets').innerHTML=EVENTS.length?EVENTS.map((e,ei)=>'<div class="market"><b>'+esc(e.event)+'</b><div class="lines">'+e.picks.map((p,pi)=>'<button class="pickline" data-e="'+ei+'" data-p="'+pi+'">'+esc(p.selection)+'<br>'+esc(p.odds)+'</button>').join('')+'</div></div>').join(''):'<div class="muted">No current markets returned.</div>';$('markets').querySelectorAll('.pickline').forEach(b=>b.onclick=()=>{const e=EVENTS[Number(b.dataset.e)],p=e.picks[Number(b.dataset.p)];CARD.push({...p,event:e.event});saveCard()});st.textContent='Live odds loaded'}catch(e){st.textContent=e.message}}$('refreshOdds').onclick=loadOdds;document.querySelectorAll('.book').forEach(b=>b.onclick=()=>{document.querySelectorAll('.book').forEach(x=>x.classList.remove('active'));b.classList.add('active');BOOK=b.dataset.book;loadOdds()});document.querySelectorAll('.sport').forEach(b=>b.onclick=()=>{document.querySelectorAll('.sport').forEach(x=>x.classList.remove('active'));b.classList.add('active');SPORT=b.dataset.sport;loadOdds()});renderCard();try{let p=JSON.parse(localStorage.getItem('links-current-pool')||'null');if(p?.id){$('pmBackNav').href='./nfl.html?pool='+encodeURIComponent(p.id);$('pmBackNav').textContent='← NFL'}}catch{}
</script></body></html>
