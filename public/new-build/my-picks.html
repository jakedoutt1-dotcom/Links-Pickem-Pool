<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LINKS — My Picks</title><link rel="stylesheet" href="./shell.css?v=387"><style>.pickgroup{border:1px solid #29485e;border-radius:8px;padding:14px;margin:9px 0;background:#07131d}.pickgroup small{display:block;color:#8194a2}</style><style>.hero{position:relative;overflow:hidden;background-image:linear-gradient(90deg,#02070de8,#06111bc9 48%,#03080de8),url('./assets/links-stadium-hero.png')!important;background-size:cover!important;background-position:center 55%!important}.hero>*{position:relative;z-index:2}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,#03080d99);pointer-events:none}.logo{font-size:0;width:190px;height:52px;background:url('./assets/ChatGPT Image Sep 22, 2026, 07_35_27 PM.png') left center/contain no-repeat}.logo small{display:none}</style><script src="./build.js?v=global1"></script></head><body><header class="top"><div class="logo">⛓ LINKS<small>PICKS. POOLS. PEOPLE.</small></div><nav class="topnav"><a href="./index.html">HOME</a><a href="./control-center.html">CONTROL CENTER</a><a href="./my-pools.html">MY POOLS</a><a href="./results.html">RESULTS</a></nav><a class="back" href="./control-center.html">← CONTROL CENTER</a></header><section class="hero"><div class="eyebrow">PICK CENTER</div><h1>MY PICKS</h1><p>Your saved pool selections and Playmaker cards in one place.</p></section><div class="livebar"><div class="livebrand"><i class="dot"></i> LINKS LIVE</div><div id="liveTrack" class="track"><span>Loading live scores…</span></div></div><main class="grid"><section class="card"><h2>POOL PICKS</h2><div id="poolPicks" class="empty">No saved New Build pool picks yet.</div></section><aside class="card"><h2>PLAYMAKER</h2><div id="pmPicks"></div><div class="actions"><a class="action primary" href="./playmaker.html">OPEN PLAYMAKER</a></div></aside></main><footer class="foot">LINKS NEW BUILD · v387</footer><script src="./shell.js?v=387"></script><script>
let h=[];try{h=JSON.parse(localStorage.getItem('links-playmaker-history-v1')||'[]')}catch{}const p=document.getElementById('pmPicks');p.innerHTML=h.length?h.slice(0,5).map(x=>'<div class="pickgroup"><b>'+String(x.status||'SAVED')+' PLAY</b><small>'+new Date(x.savedAt).toLocaleString()+' · '+((x.card||[]).length)+' selections</small></div>').join(''):'<div class="empty">No saved Playmaker cards yet.</div>';
const sources=[['NFL Pick’em','links-nfl-picks-v1'],['College Pick’em','links-college-picks-v1'],['Survivor','links-survivor-v1'],['Confidence','links-confidence-v1'],['Game 33','links-game33-v1'],['March Madness','links-march-picks-v1'],['Golf','links-golf-pool-v1'],['NASCAR','links-nascar-pool-v1'],['Custom','links-custom-pool-v1'],['Fantasy / Dynasty','links-fantasy-roster-v1']];
function localCount(name,x){if(!x)return 0;if(name==='Survivor')return x.current?1:0;if(name==='Game 33')return x.team?1:0;if(name==='Golf'||name==='NASCAR'||name==='Custom')return Array.isArray(x.picks)?x.picks.length:0;if(name==='Fantasy / Dynasty')return Array.isArray(x.roster)?x.roster.length:0;if(Array.isArray(x))return x.length;return Object.values(x).filter(v=>name==='Confidence'?(v?.team&&v?.rank):Boolean(v)).length}
async function loadPoolPicks(){const pp=document.getElementById('poolPicks');let current=null;try{current=JSON.parse(localStorage.getItem('links-current-pool')||'null')}catch{}const player=localStorage.getItem('links-player-id');if(current?.id&&player){const games=(current.games||[current.game]).filter(Boolean),groups=[];for(const name of games){try{const r=await fetch('./api/picks?pool='+encodeURIComponent(current.id)+'&game='+encodeURIComponent(name)+'&period=current&player='+encodeURIComponent(player),{cache:'no-store'}),j=await r.json();if(r.ok&&j.picks?.length)groups.push({name,n:j.picks.length,shared:true})}catch{}}if(groups.length){pp.innerHTML=groups.map(x=>'<div class="pickgroup"><b>'+x.name+'</b><small>'+x.n+' shared '+(x.n===1?'selection':'selections')+' · '+String(current.name||'Pool').replace(/[<>]/g,'')+'</small></div>').join('');return}}let groups=[];for(const [name,k] of sources){try{const x=JSON.parse(localStorage.getItem(k)||'null'),n=localCount(name,x);if(n)groups.push({name,n})}catch{}}pp.innerHTML=groups.length?groups.map(x=>'<div class="pickgroup"><b>'+x.name+'</b><small>'+x.n+' saved '+(x.n===1?'selection':'selections')+' on this device</small></div>').join(''):'<div class="empty">No saved New Build pool picks yet.</div>'}loadPoolPicks();
</script></body></html>
