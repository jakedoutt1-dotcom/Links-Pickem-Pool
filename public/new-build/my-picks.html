· v387</footer><script src="./shell.js?v=404"></script><script>
let h=[];try{h=JSON.parse(localStorage.getItem('links-playmaker-history-v1')||'[]')}catch{}const p=document.getElementById('pmPicks');p.innerHTML=h.length?h.slice(0,5).map(x=>'<div class="pickgroup"><b>'+String(x.status||'SAVED')+' PLAY</b><small>'+new Date(x.savedAt).toLocaleString()+' · '+((x.card||[]).length)+' selections</small></div>').join(''):'<div class="empty">No saved Playmaker cards yet.</div>';
async function loadPoolPicks(){const pp=document.getElementById('poolPicks');let current=null;try{current=JSON.parse(localStorage.getItem('links-current-pool')||'null')}catch{}const player=localStorage.getItem('links-player-id');if(!current?.id||!player){pp.innerHTML='<div class="empty">Open a pool to see its saved selections.</div>';return}const games=(current.games||[current.game]).filter(Boolean),groups=[];for(const name of games){try{const r=await fetch('./api/picks?pool='+encodeURIComponent(current.id)+'&game='+encodeURIComponent(name)+'&period=current&player='+encodeURIComponent(player),{cache:'no-store'}),j=await r.json();if(r.ok&&j.picks?.length)groups.push({name,n:j.picks.length})}catch{}}pp.innerHTML=groups.length?groups.map(x=>'<div class="pickgroup"><b>'+x.name+'</b><small>'+x.n+' saved '+(x.n===1?'selection':'selections')+' · '+String(current.name||'Pool').replace(/[<>]/g,'')+'</small></div>').join(''):'<div class="empty">No saved selections yet for this pool.</div>'}
loadPoolPicks();
</script></body></html>
