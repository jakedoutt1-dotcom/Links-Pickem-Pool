<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LINKS — NFL Standings</title><link rel="stylesheet" href="./shell.css?v=672"><style>
.wrap{padding:18px 5%;max-width:1100px;margin:auto}.signed{padding:8px 5%;color:#e8bb5b;font-weight:900;text-align:right;background:#07131d}.weekbar{display:grid;grid-template-columns:auto 1fr auto;gap:8px;margin:12px 0}.weekbar button,.weekbar select{min-height:46px;border:1px solid #315168;border-radius:8px;background:#07131d;color:#fff;padding:8px;font-weight:900;text-align:center}.note{color:#aebcc6}.standings-wrap{overflow-x:auto}.srow{display:grid;grid-template-columns:28px minmax(110px,1fr) 38px 38px 58px 58px 58px;gap:4px;align-items:center;padding:8px 6px;border-bottom:1px solid #29485e;white-space:nowrap;min-width:520px}.shead{color:#91a8b6;font-size:9px;text-transform:uppercase;font-weight:900}.player{overflow:hidden;text-overflow:ellipsis;font-weight:900}.center{text-align:center}.win{color:#55ef8d;font-weight:950}.loss{color:#ff737c;font-weight:950}.winner{background:linear-gradient(90deg,#0b6b34,#123f29);border:1px solid #55ef8d;border-radius:9px}@media(max-width:560px){.wrap{padding:12px 2.5%}.card{padding:10px}.srow{font-size:10px;padding:7px 4px;min-width:500px}}
</style><script src="./build.js?v=672"></script><script src="./standings-winner.js?v=1" defer></script></head><body><header class="top"><div class="logo">⛓ LINKS</div><button class="back" id="signOut">SIGN OUT</button></header><div id="signed" class="signed"></div><nav class="nflnav" id="nflnav"></nav><main class="wrap"><section class="card"><div class="eyebrow">NFL PICK’EM</div><h1>STANDINGS</h1><div class="weekbar"><button id="prev">←</button><select id="week"></select><button id="next">→</button></div><div id="status" class="proof">Loading current week…</div><div id="body"></div></section></main><footer class="foot">LINKS NEW BUILD · v672</footer><script src="./shell.js?v=672"></script><script>
const q=new URLSearchParams(location.search),pool=q.get('pool')||'',role=localStorage.getItem('links-player-role')||'',name=localStorage.getItem('links-player-name')||'',esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let selected=0,current=0,manual=false;const labels={19:'Wild Card',20:'Divisional',21:'Conference Championships',22:'Super Bowl'};signed.textContent=name?'SIGNED IN: '+name:'';for(let w=1;w<=22;w++)week.add(new Option(w<=18?'Week '+w:labels[w],w));
function label(w){return w<=18?'Week '+w:labels[w]}
function go(w){manual=true;selected=Math.max(1,Math.min(22,Number(w)||1));week.value=String(selected);const u=new URL(location.href);u.searchParams.set('week',selected);history.replaceState(null,'',u);load()}
prev.onclick=()=>go(selected-1);next.onclick=()=>go(selected+1);week.onchange=()=>go(week.value);signOut.onclick=()=>{['links-current-pool','links-player-id','links-player-name','links-player-role','links-session-v1'].forEach(k=>localStorage.removeItem(k));location.replace('./index.html')};
function showWinner(j){if(!j.finalizedWinner)return;const run=()=>window.LINKSStandingsWinner?.celebrate({body,winner:j.finalizedWinner,label:label(selected).toUpperCase()+' WINNER'});if(window.LINKSStandingsWinner)run();else setTimeout(run,80)}
async function load(){status.textContent='Loading '+label(selected)+'…';body.innerHTML='';try{const r=await fetch('./api/standings-v649?pool='+encodeURIComponent(pool)+'&week='+selected+'&role='+encodeURIComponent(role)+'&_='+Date.now(),{cache:'no-store'}),j=await r.json();if(!r.ok)throw Error(j.error||'Standings unavailable');if(!j.locked&&!/admin|commissioner/i.test(role)){status.innerHTML='<b>🔒 '+label(selected)+' standings will appear after picks lock.</b><div class="note">Wins, losses, record and tiebreaker information stay hidden until the deadline.</div>';return}status.innerHTML='<b>'+label(selected).toUpperCase()+'</b> · '+(j.allFinal?'FINAL':'IN PROGRESS');const rows=j.rows||[];if(!rows.length){body.innerHTML='<div class="proof">No saved picks for this week.</div>';return}body.innerHTML='<div class="standings-wrap"><div class="srow shead"><span>#</span><span>Player</span><span class="center">W</span><span class="center">L</span><span class="center">Record</span><span class="center">Tie</span><span class="center">Diff</span></div>'+rows.map((x,i)=>'<div class="srow '+(j.finalizedWinner===x.player?'winner':'')+'"><b>'+(i+1)+'</b><span class="player">'+esc(x.player)+'</span><span class="center win">'+Number(x.wins||0)+'</span><span class="center loss">'+Number(x.losses||0)+'</span><span class="center">'+Number(x.wins||0)+'–'+Number(x.losses||0)+'</span><span class="center">'+esc(x.tiePick??'—')+'</span><span class="center">'+esc(x.tieDiff??'—')+'</span></div>').join('')+'</div>';showWinner(j)}catch(e){status.textContent=e.message||'Standings unavailable'}}
async function boot(){try{const r=await fetch('https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?limit=1',{cache:'no-store'}),j=await r.json();current=Number(j.week?.number||1)}catch{current=1}selected=current;week.value=String(selected);const u=new URL(location.href);u.searchParams.set('week',selected);history.replaceState(null,'',u);load()}boot();
</script></body></html>
