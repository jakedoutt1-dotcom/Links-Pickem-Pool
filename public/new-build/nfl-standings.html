age.removeItem(k));location.replace('./index.html')};for(let w=1;w<=22;w++)week.add(new Option(w<=18?'Week '+w:labels[w],w));week.value=String(selected);function changeWeek(w){w=Math.max(1,Math.min(22,Number(w)||1));selected=w;week.value=String(w);const u=new URL(location.href);u.searchParams.set('week',w);history.replaceState(null,'',u);document.querySelectorAll('.nflnav a').forEach(a=>{if(!a.href)return;try{const x=new URL(a.href);if(x.searchParams.has('week')){x.searchParams.set('week',w);a.href=x.href}}catch{}});load()}prev.onclick=()=>changeWeek(selected-1);next.onclick=()=>changeWeek(selected+1);week.onchange=()=>changeWeek(week.value);async function load(){const token=++renderToken,statusEl=document.getElementById('status'),bodyEl=document.getElementById('body'),label=selected<=18?'Week '+selected:labels[selected];statusEl.textContent='Loading '+label+' standings…';bodyEl.innerHTML='';try{const r=await fetch('./api/standings-v649?pool='+encodeURIComponent(pool)+'&week='+selected+'&role='+encodeURIComponent(role)+'&_='+Date.now(),{cache:'no-store'}),j=await r.json();if(token!==renderToken)return;if(!r.ok)throw Error(j.error||'Standings unavailable');if(!j.locked&&!/admin|commissioner/i.test(role)){statusEl.innerHTML='🔒 '+label+' standings will appear after '+label+' picks lock.';bodyEl.innerHTML='<div class="lockbox"><b>'+esc(label)+' standings are protected until picks lock.</b><div class="muted" style="margin-top:6px">Wins, losses, picks and tiebreakers will appear after the deadline.</div></div>';return}statusEl.innerHTML=j.actualTie!=null?'Final-game combined score: <b>'+j.actualTie+'</b>':'Wins and losses count only after a game is FINAL. Tiebreaker settles equal win totals after the final game.';const rows=j.rows||[];if(!rows.length){bodyEl.innerHTML='<div class="lockbox">No saved picks are available for '+esc(label)+'.</div>';return}bodyEl.innerHTML='<div class="tablewrap"><table><thead><tr><th>#</th><th>Player</th><th>W</th><th>L</th><th>Record</th><th>Tie Pick</th><th>Tie Diff</th></tr></thead><tbody>'+rows.map((x,i)=>{const won=!!j.finalizedWinner&&j.finalizedWinner===x.player;return '<tr class="'+(won?'winner':'')+'"><td>'+(i+1)+'</td><td><b>'+esc(x.player)+'</b>'+(won?'<span class="winner-tag">🏆 WINNER</span>':'')+'</td><td class="win">'+x.wins+'</td><td class="loss">'+x.losses+'</td><td class="record">'+x.wins+'–'+x.losses+'</td><td>'+esc(x.tiePick??'—')+'</td><td>'+esc(x.tieDiff??'—')+'</td></tr>'}).join('')+'</tbody></table></div>'}catch(e){if(token!==renderToken)return;statusEl.textContent=e.message||'Standings unavailable.'}}load();</script></body></html>
