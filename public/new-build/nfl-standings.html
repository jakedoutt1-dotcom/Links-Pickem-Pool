<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LINKS — NFL Standings</title><link rel="stylesheet" href="./shell.css?v=648"><script src="./build.js?v=648"></script><style>.wrap{padding:18px 5%;max-width:1050px;margin:auto}.nflnav{display:flex;gap:7px;overflow-x:auto;padding:10px 5%;background:#07131d;border-bottom:1px solid #29485e;position:sticky;top:0;z-index:50}.nflnav a{flex:0 0 auto;min-height:42px;display:flex;align-items:center;padding:0 12px;border:1px solid #315168;border-radius:7px;background:#0a1a25;color:#fff;text-decoration:none;font-size:11px;font-weight:900}.nflnav a.active{border-color:#e8bb5b;color:#e8bb5b}.weekbar{display:grid;grid-template-columns:auto 1fr auto;gap:8px;margin:12px 0}.weekbar button,.weekbar select{min-height:46px;border:1px solid #315168;border-radius:8px;background:#07131d;color:#fff;padding:8px;font-weight:900;text-align:center}.standing{display:grid;grid-template-columns:42px 1fr auto;align-items:center;gap:10px;padding:13px;margin:8px 0;border:1px solid #315168;border-radius:10px;background:#0a1823}.standing .rank{font-size:20px;font-weight:950;color:#91a8b6}.standing .name{font-size:16px;font-weight:950}.standing .score{font-size:14px;font-weight:900}.standing.winner{border-color:#2aa766;background:linear-gradient(90deg,#0b3522,#0a1823);box-shadow:0 0 0 1px #2aa76655}.standing.winner .rank,.standing.winner .name,.standing.winner .score{color:#63efa1}.winner-tag{display:inline-block;margin-left:8px;padding:3px 7px;border-radius:6px;background:#168b50;color:#fff;font-size:9px;font-weight:950}.signed{padding:8px 5%;color:#e8bb5b;font-weight:900;text-align:right;background:#07131d}.muted{color:#9fb0bb}</style></head><body><header class="top"><div class="logo">⛓ LINKS</div><button class="back" id="signOut">SIGN OUT</button></header><div id="signed" class="signed"></div><nav class="nflnav"><a id="navPicks">PICKS</a><a id="navScores">LIVE SCORES</a><a id="navCompare">COMPARE PICKS</a><a id="navMatter">PICKS THAT MATTER</a><a id="navProjected">PROJECTED</a><a class="active" id="navStandings">STANDINGS</a><a id="navPrint">PRINT MY PICKS</a><a id="navAdmin" style="display:none">ADMIN</a></nav><main class="wrap"><section class="card"><div class="eyebrow">NFL PICK’EM</div><h1>STANDINGS</h1><p class="muted">Choose any week to see that week's standings and weekly winner.</p><div class="weekbar"><button id="prev">←</button><select id="week"></select><button id="next">→</button></div><div id="status" class="proof">Loading standings…</div><div id="body"></div></section></main><footer class="foot">LINKS NEW BUILD · v648</footer><script src="./shell.js?v=648"></script><script>const q=new URLSearchParams(location.search),pool=q.get('pool')||'',role=localStorage.getItem('links-player-role')||'',playerName=localStorage.getItem('links-player-name')||localStorage.getItem('links-player-id')||'',esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let selected=Math.max(1,Math.min(22,Number(q.get('week')||0)||1));signed.textContent=playerName?'SIGNED IN: '+playerName:'';const url=(path,extra='')=>'./'+path+'?pool='+encodeURIComponent(pool)+'&week='+selected+extra;navPicks.href=url('nfl.html');navScores.href=url('nfl.html','&view=scores');navCompare.href=url('compare-picks.html');navMatter.href=url('pick-tools.html','&sport=nfl&tool=matter');navProjected.href=url('pick-tools.html','&sport=nfl&tool=projected');navStandings.href=url('nfl-standings.html');navPrint.href=url('nfl.html','&print=1');navAdmin.href='./commissioner.html?pool='+encodeURIComponent(pool)+'&game='+encodeURIComponent('NFL Pick’em');if(/admin|commissioner/i.test(role))navAdmin.style.display='flex';signOut.onclick=()=>{['links-current-pool','links-player-id','links-player-name','links-player-role','links-session-v1'].forEach(k=>localStorage.removeItem(k));location.replace('./index.html')};const labels={19:'Wild Card',20:'Divisional',21:'Conference Championships',22:'Super Bowl'};for(let w=1;w<=22;w++)week.add(new Option(w<=18?'Week '+w:labels[w],w));week.value=String(selected);function go(w){w=Math.max(1,Math.min(22,Number(w)||1));const u=new URL(location.href);u.searchParams.set('week',w);location.href=u.href}prev.onclick=()=>go(selected-1);next.onclick=()=>go(selected+1);week.onchange=()=>go(week.value);async function load(){status.textContent='Loading '+(selected<=18?'Week '+selected:labels[selected])+' standings…';body.innerHTML='';try{const r=await fetch('./api/compare-picks?pool='+encodeURIComponent(pool)+'&week='+selected+'&role='+encodeURIComponent(role),{cache:'no-store'}),j=await r.json();if(!r.ok)throw Error(j.error||'Standings unavailable');if(!j.locked){status.innerHTML='<b>STANDINGS LOCKED</b><div class="muted">This week’s standings appear after the weekly pick deadline.</div>';return}const results=j.results||{},players=j.players||[],rows=players.map(p=>{let correct=0,graded=0;for(const [idx,pick] of Object.entries(p.picks||{})){const win=results[idx];if(win){graded++;if(String(pick)===String(win))correct++}}return{name:p.player,correct,graded,tie:p.tie}}).sort((a,b)=>b.correct-a.correct||String(a.name).localeCompare(String(b.name)));if(!rows.length){status.textContent='No saved picks are available for this week.';return}const finals=Object.keys(results).length,max=Math.max(...rows.map(x=>x.correct)),complete=finals>0;status.innerHTML='<b>'+(selected<=18?'WEEK '+selected:String(labels[selected]).toUpperCase())+'</b><div class="muted">'+finals+' game'+(finals===1?'':'s')+' graded'+(complete?' · Leader highlighted in green':'')+'</div>';body.innerHTML=rows.map((x,i)=>{const winner=complete&&x.correct===max;return '<div class="standing '+(winner?'winner':'')+'"><div class="rank">'+(i+1)+'</div><div class="name">'+esc(x.name)+(winner?'<span class="winner-tag">'+(rows.filter(y=>y.correct===max).length>1?'TIED LEADER':'WEEKLY WINNER')+'</span>':'')+'<div class="muted" style="font-size:10px;margin-top:3px">Tiebreaker: '+esc(x.tie??'—')+'</div></div><div class="score">'+x.correct+' correct</div></div>'}).join('')}catch(e){status.textContent=e.message||'Standings unavailable.'}}load();</script></body></html>
