<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LINKS — NFL Standings</title><link rel="stylesheet" href="./shell.css?v=668"><style>.wrap{padding:18px 5%;max-width:1100px;margin:auto}.nflnav{display:flex;gap:7px;overflow-x:auto;padding:10px 5%;background:#07131d;border-bottom:1px solid #29485e;position:sticky;top:0;z-index:50}.nflnav a{flex:0 0 auto;min-height:42px;display:flex;align-items:center;padding:0 12px;border:1px solid #315168;border-radius:7px;background:#0a1a25;color:#fff;text-decoration:none;font-size:11px;font-weight:900}.nflnav a.active{border-color:#e8bb5b;color:#e8bb5b}.weekbar{display:grid;grid-template-columns:auto 1fr auto;gap:8px;margin:12px 0}.weekbar button,.weekbar select{min-height:46px;border:1px solid #315168;border-radius:8px;background:#07131d;color:#fff;padding:8px;font-weight:900;text-align:center}.row{display:grid;grid-template-columns:34px minmax(110px,1fr) 92px 54px 54px;gap:6px;align-items:center;padding:8px 10px;border-bottom:1px solid #29485e;white-space:nowrap}.playercell{min-width:0;overflow:hidden;text-overflow:ellipsis;font-weight:900}.tiecell{font-size:11px;color:#aebcc6;text-align:center}.statcell{text-align:center;font-size:12px;font-weight:950}.row b{line-height:1.1}@media(max-width:560px){.wrap{padding:12px 2.5%}.card{padding:10px}.row{grid-template-columns:26px minmax(90px,1fr) 70px 40px 40px;gap:3px;padding:7px 5px;font-size:11px}.tiecell{font-size:9px}.statcell{font-size:10px}}.winner{background:linear-gradient(90deg,#0b6b34,#123f29);border:1px solid #55ef8d;border-radius:9px}.win{color:#55ef8d;font-weight:950}.loss{color:#ff737c;font-weight:950}.banner{padding:14px;margin:12px 0;border:1px solid #55ef8d;border-radius:10px;background:#0b3d24;text-align:center;font-weight:950}.signed{padding:8px 5%;color:#e8bb5b;font-weight:900;text-align:right;background:#07131d}.note{color:#aebcc6}</style></head><body><header class="top"><div class="logo">⛓ LINKS</div><button class="back" id="signOut">SIGN OUT</button></header><div id="signed" class="signed"></div><nav class="nflnav" id="nav"></nav><main class="wrap"><section class="card"><div class="eyebrow">NFL PICK’EM</div><h1>STANDINGS</h1><div class="weekbar"><button id="prev">←</button><select id="week"></select><button id="next">→</button></div><div id="status" class="proof">Loading current week…</div><div id="body"></div></section></main><footer class="foot">LINKS NEW BUILD · v668</footer><script>const q=new URLSearchParams(location.search),pool=q.get('pool')||'',role=localStorage.getItem('links-player-role')||'',name=localStorage.getItem('links-player-name')||'',esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));let selected=Number(q.get('week')||0)||0,current=0; signed.textContent=name?'SIGNED IN: '+name:'';for(let w=1;w<=22;w++)week.add(new Option(w<=18?'Week '+w:({19:'Wild Card',20:'Divisional',21:'Conference Championships',22:'Super Bowl'}[w]),w));function links(){const w=selected||current||1,u=(f,x='')=>'./'+f+'?pool='+encodeURIComponent(pool)+'&week='+w+x;nav.innerHTML='<a href="'+u('nfl.html')+'">PICKS</a><a href="'+u('nfl-scores.html')+'">LIVE SCORES</a><a href="'+u('compare-picks.html')+'">COMPARE PICKS</a><a href="'+u('pick-tools.html','&sport=nfl&tool=matter')+'">PICKS THAT MATTER</a><a href="'+u('pick-tools.html','&sport=nfl&tool=projected')+'">PROJECTED</a><a class="active">STANDINGS</a><a href="'+u('nfl.html','&pickcard=1')+'">PRINT MY PICKS</a>'+( /admin|commissioner/i.test(role)?'<a href="./commissioner.html?pool='+encodeURIComponent(pool)+'&game='+encodeURIComponent('NFL Pick’em')+'">ADMIN</a>':'')}function go(w){selected=Math.max(1,Math.min(22,Number(w)||1));week.value=selected;links();const u=new URL(location.href);u.searchParams.set('week',selected);history.replaceState(null,'',u);load()}prev.onclick=()=>go(selected-1);next.onclick=()=>go(selected+1);week.onchange=()=>go(week.value);signOut.onclick=()=>{['links-current-pool','links-player-id','links-player-name','links-player-role','links-session-v1'].forEach(k=>localStorage.removeItem(k));location.replace('./index.html')};async function load(){status.textContent='Loading Week '+selected+'…';body.innerHTML='';try{const r=await fetch('./api/compare-picks?pool='+encodeURIComponent(pool)+'&week='+selected+'&role='+encodeURIComponent(role)+'&_='+Date.now(),{cache:'no-store'}),j=await r.json();if(!r.ok)throw Error(j.error||'Standings unavailable');if(!j.locked&&!/admin|commissioner/i.test(role)){status.innerHTML='<b>PICKS ARE STILL PRIVATE</b><div class="note">Standings appear after the weekly picks lock.</div>';return}const players=j.players||[],results=j.results||{},games=j.games||[];let allFinal=games.length>0;const rows=players.map(p=>{let wins=0,losses=0,finals=0;for(let i=0;i<Math.max(games.length,Object.keys(p.picks||{}).length);i++){const pick=p.picks?.[i],win=results[i]??results[String(i)];if(!win){allFinal=false;continue}finals++;if(pick===win)wins++;else if(pick)losses++}return{...p,wins,losses,finals}}).sort((a,b)=>b.wins-a.wins||(Number(a.tie)||999)-(Number(b.tie)||999));status.innerHTML='<b>WEEK '+selected+'</b> · '+(allFinal?'FINAL':'IN PROGRESS');if(!rows.length){body.innerHTML='<div class="proof">No saved picks for this week.</div>';return}const top=allFinal?rows[0]:null;body.innerHTML=(top?'<div class="banner">🏆 WEEK '+selected+' WINNER · '+esc(top.player)+'</div>':'')+rows.map((x,i)=>'<div class="row '+(top&&x.player===top.player?'winner':'')+'"><b>#'+(i+1)+'</b><div class="playercell">'+esc(x.player)+'</div><div class="tiecell">TB '+esc(x.tie??'—')+'</div><div class="statcell win">'+x.wins+' W</div><div class="statcell loss">'+x.losses+' L</div></div>').join('')}catch(e){status.textContent=e.message||'Standings unavailable'}}async function boot(){if(!selected){try{const r=await fetch('https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?limit=1',{cache:'no-store'}),j=await r.json();current=Number(j.week?.number||1)}catch{current=1}selected=current}week.value=selected;links();load()}boot();</script></body></html>
