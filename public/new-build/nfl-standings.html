<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LINKS — NFL Standings</title><link rel="stylesheet" href="./shell.css?v=711"><style>.wrap{padding:18px 5%;max-width:1100px;margin:auto}.weekbar{display:grid;grid-template-columns:auto 1fr auto;gap:8px;margin:12px 0}.weekbar button,.weekbar select{min-height:46px;border:1px solid #315168;border-radius:8px;background:#07131d;color:#fff;padding:8px;font-weight:900}.standings-wrap{overflow-x:auto}.srow{display:grid;grid-template-columns:28px minmax(110px,1fr) 38px 38px 58px 58px 58px;gap:4px;padding:8px 6px;border-bottom:1px solid #29485e;min-width:520px}.shead{color:#91a8b6;font-size:9px;font-weight:900}.center{text-align:center}.win{color:#55ef8d}.loss{color:#ff737c}</style><script src="./build.js?v=711"></script></head><body><header class="top"><div class="logo">⛓ LINKS</div></header><nav class="nflnav" id="nflnav"></nav><main class="wrap"><section class="card"><div class="eyebrow">NFL PICK’EM</div><h1>STANDINGS</h1><div class="weekbar"><button id="prev">←</button><select id="week"></select><button id="next">→</button></div><div id="standingsStatus" class="proof">Loading…</div><div id="standingsBody"></div></section></main><footer class="foot">LINKS NEW BUILD · v711</footer><script src="./shell.js?v=711"></script><script>
const q=new URLSearchParams(location.search),po=(()=>{try{return JSON.parse(localStorage.getItem('links-current-pool')||'null')||{}}catch{return{}}})(),pool=q.get('pool')||po.id||'',role=localStorage.getItem('links-player-role')||'',weekEl=document.getElementById('week'),statusEl=document.getElementById('standingsStatus'),bodyEl=document.getElementById('standingsBody'),labels={19:'Wild Card',20:'Divisional',21:'Conference Championships',22:'Super Bowl'},esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let selected=Number(q.get('week')||0)||1,current=selected;for(let w=1;w<=22;w++)weekEl.add(new Option(w<=18?'Week '+w:labels[w],w));function label(w){return w<=18?'Week '+w:labels[w]}function go(w){selected=Math.max(1,Math.min(22,Number(w)||1));weekEl.value=selected;const u=new URL(location.href);u.searchParams.set('week',selected);history.replaceState(null,'',u);load()}document.getElementById('prev').onclick=()=>go(selected-1);document.getElementById('next').onclick=()=>go(selected+1);weekEl.onchange=()=>go(weekEl.value);async function load(){statusEl.textContent='Loading '+label(selected)+'…';bodyEl.innerHTML='';try{const r=await fetch('./api/standings-v649?pool='+encodeURIComponent(pool)+'&week='+selected+'&role='+encodeURIComponent(role)+'&_='+Date.now(),{cache:'no-store'}),j=await r.json();if(!r.ok)throw Error(j.error||'Standings unavailable');if(!j.locked&&!/admin|commissioner/i.test(role)){statusEl.innerHTML='<b>🔒 '+label(selected)+' standings will appear after picks lock.</b>';return}const rows=j.rows||[];statusEl.innerHTML='<b>'+label(selected).toUpperCase()+'</b> · '+((j.allFinal||selected<current)?'FINAL':'IN PROGRESS');bodyEl.innerHTML=rows.length?'<div class="standings-wrap"><div class="srow shead"><span>#</span><span>Player</span><span>W</span><span>L</span><span>Record</span><span>Tie</span><span>Diff</span></div>'+rows.map((x,i)=>'<div class="srow"><b>'+(i+1)+'</b><b>'+esc(x.player)+'</b><span class="center win">'+Number(x.wins||0)+'</span><span class="center loss">'+Number(x.losses||0)+'</span><span class="center">'+Number(x.wins||0)+'–'+Number(x.losses||0)+'</span><span class="center">'+esc(x.tiePick??'—')+'</span><span class="center">'+esc(x.tieDiff??'—')+'</span></div>').join('')+'</div>':'<div class="proof">No saved picks for this week.</div>'}catch(e){statusEl.textContent=e.message||'Standings unavailable'}}async function boot(){try{const r=await fetch('https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?limit=1',{cache:'no-store'}),j=await r.json();current=Number(j.week?.number||1)||1}catch{}selected=Math.max(1,Math.min(22,Number(q.get('week')||0)||current));weekEl.value=selected;load()}boot();
</script></body></html>
