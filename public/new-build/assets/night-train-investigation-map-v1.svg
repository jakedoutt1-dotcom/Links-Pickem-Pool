<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1100" viewBox="0 0 2000 1100" role="img" aria-labelledby="title desc"><title id="title">Night Train carriage connection plan</title><desc id="desc">Dining D1 connects the public corridor Q1 through G1 and the pantry P1 through an internal door. P1 connects service passage S1. H2 connects S1 to Q1 opposite compartment C4. Q1 accesses C2,C4,C6 and the guard van containing lockers L1 through L8. C4 has a vestibule and a separate inward-opening interior door. Exterior train exits are sealed. Diagram not to scale; closure notices determine which doors were available.</desc><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#d2c7aa" stroke-width="1"/></pattern></defs><rect width="2000" height="1100" fill="#eee5cc"/><rect x="20" y="20" width="1960" height="1060" fill="url(#grid)" stroke="#4c594f" stroke-width="4"/><g fill="#263a40" font-family="Arial, sans-serif"><text x="80" y="80" font-size="34" font-weight="bold">NORTHLINE RAIL · CARRIAGE CONNECTION PLAN</text><text x="80" y="123" font-size="23">Survey revision 4 · authoritative door connections · schematic, NOT TO SCALE</text></g><g stroke="#30454b" stroke-width="7" fill="#f9f3df"><rect x="80" y="200" width="330" height="440"/><rect x="500" y="200" width="250" height="240"/><rect x="840" y="200" width="300" height="240"/><rect x="1230" y="200" width="250" height="240"/><rect x="1570" y="200" width="340" height="240"/><rect x="500" y="490" width="1410" height="150" fill="#d4e0d8"/><rect x="80" y="730" width="330" height="190"/><rect x="500" y="730" width="1410" height="190" fill="#e1d4ad"/></g><g stroke="#30454b" stroke-width="5" fill="none"><path d="M410 550H500M500 580H410"/><path d="M220 640V730M270 730V640"/><path d="M410 790H500M500 840H410"/><path d="M600 440V490M650 490V440M960 440V490M1020 490V440M1330 440V490M1390 490V440M1700 440V490M1760 490V440"/><path d="M970 640V730M1030 730V640"/></g><g fill="#eee5cc"><rect x="397" y="548" width="15" height="33"/><rect x="218" y="631" width="53" height="15"/><rect x="218" y="724" width="53" height="14"/><rect x="397" y="788" width="15" height="54"/><rect x="492" y="788" width="15" height="54"/><rect x="968" y="632" width="64" height="15"/><rect x="968" y="724" width="64" height="15"/></g><g stroke="#30454b" stroke-width="3" fill="none"><path d="M840 365H960M1020 365H1140M960 365V309A56 56 0 0 1 1016 365"/><path d="M880 246H920V325H880ZM1050 236H1110V292H1050Z"/><path d="M1570 276H1910M1612 276V380M1654 276V380M1696 276V380M1738 276V380M1780 276V380M1822 276V380M1864 276V380"/></g><g font-family="Arial, sans-serif" text-anchor="middle" fill="#263a40"><g font-size="31" font-weight="bold"><text x="245" y="350">DINING</text><text x="245" y="390">D1</text><text x="625" y="290">C2</text><text x="990" y="290">C4</text><text x="1355" y="290">C6</text><text x="1740" y="250">GUARD VAN</text><text x="245" y="815">PANTRY P1</text><text x="1260" y="565">PUBLIC CORRIDOR Q1</text><text x="1300" y="820">SERVICE PASSAGE S1</text></g><g font-size="22"><text x="990" y="409">vestibule</text><text x="990" y="342">interior slide-bolt door</text><text x="900" y="230">berth</text><text x="1080" y="222">table</text><text x="1080" y="320">window above table</text><text x="456" y="530">G1</text><text x="1000" y="686">H2</text><text x="245" y="866">internal connection</text><text x="1590" y="345">L1</text><text x="1633" y="345">L2</text><text x="1675" y="345">L3</text><text x="1717" y="345">L4</text><text x="1759" y="345">L5</text><text x="1801" y="345">L6</text><text x="1843" y="345">L7</text><text x="1885" y="345" font-weight="bold">L8</text></g></g><g font-family="Arial, sans-serif" fill="#34494b" font-size="22"><text x="80" y="988">LEGEND: parallel lines = connecting doorway · curved arc = inward swing · coloured bands = corridors</text><text x="80" y="1029">H2 reaches Q1 opposite C4; it does not open beside the victim’s table. G1 status: consult dated closure notice.</text><text x="80" y="1063">Exterior exits remained sealed. No direct dining-to-C4 door, external walkway or hidden connector is shown.</text></g></svg>