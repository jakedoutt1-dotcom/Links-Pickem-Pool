<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
 <title id="title">LINKS Circuit Rush</title><desc id="desc">A premium black and gold circuit arena with bright connected tracks and glowing terminals.</desc>
