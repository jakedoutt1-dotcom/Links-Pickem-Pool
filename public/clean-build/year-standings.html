<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LINKS Year-Long Standings</title><style>body{margin:0;background:#05090d;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:980px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center}.logo{font-size:30px;font-weight:1000;color:#efbd58}.card{margin-top:20px;padding:22px;border:1px solid #29485d;border-radius:14px;background:#0a141d}h1{margin:0 0 7px}.sub{color:#9db0bc}.row{display:grid;grid-template-columns:55px 1fr 90px 90px;padding:13px 10px;border-bottom:1px solid #1d3444}.head{color:#efbd58;font-size:11px;font-weight:900;text-transform:uppercase}.empty{text-align:center;padding:40px;color:#8fa1ac}a{color:#efbd58;text-decoration:none;font-weight:900}</style></head><body><div class="wrap"><div class="top"><div class="logo">LINKS</div><a href="./">HOME</a></div><div class="card"><h1>Year-Long Standings</h1><div class="sub">Season totals are calculated from completed weekly results. Weekly standings remain available separately.</div><div class="row head"><div>Rank</div><div>Player</div><div>Wins</div><div>Correct</div></div><div id="standings" class="empty">Season standings will appear from the pool's saved NFL results.</div></div></div><script>const q=new URLSearchParams(location.search);const pool=q.get('pool')||q.get('poolId')||'';async function load(){if(!pool)return;try{const r=await fetch('/new-build/api/legacy-history?pool='+encodeURIComponent(pool),{cache:'no-store'});const j=await r.json();const weeks=Array.isArray(j.weeks)?j.weeks:Array.isArray(j.history)?j.history:[];const m=new Map;for(const w of weeks){const rows=w.standings||w.players||[];for(const x of rows){const n=x.name||x.player||x.playerName;if(!n)continue;const v=m.get(n)||{name:n,wins:0,correct:0};v.correct+=Number(x.correct||x.wins||0);if(x.winner===true||x.isWinner===true)v.wins++;m.set(n,v)}}const a=[...m.values()].sort((a,b)=>b.wins-a.wins||b.correct-a.correct||a.name.localeCompare(b.name));if(!a.length)return;document.getElementById('standings').className='';document.getElementById('standings').innerHTML=a.map((x,i)=>'<div class="row"><div>'+(i+1)+'</div><div><b>'+x.name+'</b></div><div>'+x.wins+'</div><div>'+x.correct+'</div></div>').join('')}catch(e){}}load()</script></body></html>
