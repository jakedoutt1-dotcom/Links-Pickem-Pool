<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LINKS Year-Long Standings</title><link rel="stylesheet" href="./css/theme.css"><style>.row{display:grid;grid-template-columns:55px 1fr 90px 90px 90px;padding:13px 10px;border-bottom:1px solid #1d3444}.head{color:#efbd58;font-size:11px;font-weight:900;text-transform:uppercase}.empty{text-align:center;padding:40px;color:#8fa1ac}@media(max-width:600px){.row{grid-template-columns:45px 1fr 60px 70px}.weeks{display:none}}</style></head><body><main class="shell"><div class="bar"><div class="brand">LINKS</div><div class="nav"><a href="./nfl/">NFL</a><a href="./">Home</a></div></div><section class="card"><h1>Year-Long Standings</h1><p class="muted">Completed weekly results combined across the regular season and playoffs. Weekly standings stay separate.</p><div class="row head"><div>Rank</div><div>Player</div><div>Wins</div><div>Correct</div><div class="weeks">Weeks</div></div><div id="rows" class="empty">Loading season standings…</div></section></main><script type="module">import{api,pool,esc}from'./js/core.js';const p=pool(),el=document.getElementById('rows');if(!p)el.textContent='Open this page from your pool to see season standings.';else api('/new-build/api/season-standings?pool='+encodeURIComponent(p)).then(j=>{const a=j.rows||[];if(!a.length){el.textContent='No completed weeks yet.';return}el.className='';el.innerHTML=a.map(x=>`<div class="row"><div>${x.rank}</div><div><b>${esc(x.player)}</b></div><div>${x.weeklyWins}</div><div>${x.correct}</div><div class="weeks">${x.weeksPlayed}</div></div>`).join('')}).catch(e=>el.textContent=e.message)</script></body></html>
